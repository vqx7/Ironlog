<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ironlog</title>
<script>window.IRONLOG_APP=true;window.__installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.__installEvt=e;if(window.ironlogInstallReady)window.ironlogInstallReady();});
window.addEventListener('appinstalled',()=>{window.__installEvt=null;if(window.ironlogInstallReady)window.ironlogInstallReady();});</script>
<meta name="theme-color" content="#08090b">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ironlog">
<meta name="description" content="Log lifting sessions, track progress and plan training. Works offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* ============================================================
   IRONLOG visual system (r20)
   Night gym by default: near-black surfaces, white type, and one
   volt accent that means "go" and "done" (the Start button, a
   finished set, a trained day, the active tab, progress). Gold is
   kept for personal records only. The four plate colours still
   carry meaning and nothing else:
     green  on target, rising
     amber  under target, needs a look
     blue   over target, information, supersets
     red    falling, injured, destructive
   Display: Big Shoulders Display (condensed, signage). Body:
   Hanken Grotesk. Every number is tabular.
   Light mode keeps the same structure on cool paper; volt stays a
   fill with dark type on it, and thin volt lines turn dark there,
   since volt on white cannot be seen.
   r20 layout: sections are open space on the page, not boxes. A
   section is a big condensed title with its summary, separated
   from the next by a hairline; what sits inside is set on soft
   filled surfaces (a stat row, a panel, a card per exercise), not
   outlined. Controls are filled, not outlined: pills for the main
   action, soft tiles for the rest. The header and tab bar are
   frosted glass over the page. One inked hero card leads Today.
   ============================================================ */
:root{
  --bg:#f2f3f5; --surface:#ffffff; --surface-2:#eceef1; --surface-3:#e0e3e8;
  --ink:#0d0f12; --ink-2:#23272d; --muted:#565e69; --line:#d8dce2; --line-soft:#e3e6ea;
  --btn:#ffffff; --btn-b:#dcdfe4; --field:#ffffff; --field-b:#d3d7dd; --card-b:#e3e6ea;
  --glass:rgba(242,243,245,.9);
  --green:#0b7a42; --yellow:#8a5300; --red:#b42318; --blue:#1d5bd6;
  --green-bg:#dcf2e5; --yellow-bg:#fbebd0; --red-bg:#fde3e0; --blue-bg:#e1ebfd;
  --on-accent:#ffffff; --on-ink:#f4f5f7;
  --volt:#d4ff3f; --on-volt:#0b0c0e; --volt-line:#0d0f12; --volt-soft:#f0ffc4;
  --gold:#ffc53d; --on-gold:#1a1300;
  /* The Today card follows the theme (item 57): light on a light page. The
     rest-timer dock stays inked in both themes, so it reads as a bar laid
     over the page rather than part of it. */
  --hero:#ffffff; --on-hero:#0d0f12; --hero-2:#f1f3f5;
  --shadow:0 1px 2px rgba(13,15,18,.05),0 10px 30px rgba(13,15,18,.06);
  --hero-bg:radial-gradient(150px 150px at 90% 12%,color-mix(in srgb,var(--volt) 14%,transparent),transparent 70%),linear-gradient(165deg,#ffffff,#f6f7f9 72%);
  --hero-ring:var(--volt-line); --hero-shadow:0 0 0 1px var(--card-b),0 1px 2px rgba(13,15,18,.05),0 12px 32px rgba(13,15,18,.08);
  --dock:#0d0f12; --on-dock:#f4f5f7;
  --dock-bg:radial-gradient(140px 140px at 90% 12%,color-mix(in srgb,var(--volt) 18%,transparent),transparent 70%),linear-gradient(165deg,#1b1e23,#0d0f12 70%);
  --font:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --display:'Big Shoulders Display','Arial Narrow','Roboto Condensed','Helvetica Neue',system-ui,sans-serif;
  --r-lg:22px; --r-md:14px; --r-sm:12px;
  --head-h:52px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#08090b; --surface:#131518; --surface-2:#1c1f23; --surface-3:#272b30;
    --ink:#f3f4f6; --ink-2:#d9dce1; --muted:#9aa1ab; --line:#262a30; --line-soft:#1b1e22;
    --btn:#1e2125; --btn-b:transparent; --field:#1e2125; --field-b:transparent; --card-b:transparent;
    --glass:rgba(8,9,11,.88);
    --green:#3ddc84; --yellow:#ffb020; --red:#ff5a4e; --blue:#5aa7ff;
    --green-bg:#0f2a1c; --yellow-bg:#33250a; --red-bg:#3a1512; --blue-bg:#0f2440;
    --on-accent:#0a0b0d; --on-ink:#0a0b0d;
    --volt:#d4ff3f; --on-volt:#0b0c0e; --volt-line:#d4ff3f; --volt-soft:#232c0c;
    --hero:#131518; --on-hero:#f3f4f6; --hero-2:#1c1f23;
    --hero-bg:radial-gradient(150px 150px at 90% 10%,color-mix(in srgb,var(--volt) 15%,transparent),transparent 70%),linear-gradient(165deg,#1a1d21,#101215 72%);
    --hero-ring:var(--volt); --hero-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 14px 40px rgba(0,0,0,.18);
    --dock:var(--hero); --on-dock:var(--on-hero); --dock-bg:var(--hero-bg);
    --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08090b; --surface:#131518; --surface-2:#1c1f23; --surface-3:#272b30;
  --ink:#f3f4f6; --ink-2:#d9dce1; --muted:#9aa1ab; --line:#262a30; --line-soft:#1b1e22;
  --btn:#1e2125; --btn-b:transparent; --field:#1e2125; --field-b:transparent; --card-b:transparent;
  --glass:rgba(8,9,11,.88);
  --green:#3ddc84; --yellow:#ffb020; --red:#ff5a4e; --blue:#5aa7ff;
  --green-bg:#0f2a1c; --yellow-bg:#33250a; --red-bg:#3a1512; --blue-bg:#0f2440;
  --on-accent:#0a0b0d; --on-ink:#0a0b0d;
  --volt:#d4ff3f; --on-volt:#0b0c0e; --volt-line:#d4ff3f; --volt-soft:#232c0c;
  --hero:#131518; --on-hero:#f3f4f6; --hero-2:#1c1f23;
  --hero-bg:radial-gradient(150px 150px at 90% 10%,color-mix(in srgb,var(--volt) 15%,transparent),transparent 70%),linear-gradient(165deg,#1a1d21,#101215 72%);
  --hero-ring:var(--volt); --hero-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 14px 40px rgba(0,0,0,.18);
  --dock:var(--hero); --on-dock:var(--on-hero); --dock-bg:var(--hero-bg);
  --shadow:none;
  color-scheme:dark;
}
/* Accent colour, chosen in Settings > General. The tokens keep the name
   --volt (the original accent) and mean "the accent": go, done, progress.
   Blue is the default. With the blue accent, the blue status colour (above
   target, information, supersets) turns violet, so "done" and "above target"
   never look alike. Every pair is checked for 4.5:1 in tests/design.js. */
:root[data-accent="blue"]{--volt:#2a63f5;--on-volt:#ffffff;--volt-line:#1f4fd1;--volt-soft:#e2ebff;--blue:#6d28d9;--blue-bg:#efe9ff}
:root[data-accent="ember"]{--volt:#ff6a2b;--on-volt:#0b0c0e;--volt-line:#c2410c;--volt-soft:#ffe6db}
@media (prefers-color-scheme:dark){
  :root[data-accent="blue"]:not([data-theme="light"]){--volt:#2a63f5;--on-volt:#ffffff;--volt-line:#6f9bff;--volt-soft:#0f1d40;--blue:#b69cff;--blue-bg:#221a3d}
  :root[data-accent="ember"]:not([data-theme="light"]){--volt:#ff6a2b;--on-volt:#0b0c0e;--volt-line:#ff7a3d;--volt-soft:#2f1609}
}
:root[data-accent="blue"][data-theme="dark"]{--volt:#2a63f5;--on-volt:#ffffff;--volt-line:#6f9bff;--volt-soft:#0f1d40;--blue:#b69cff;--blue-bg:#221a3d}
:root[data-accent="ember"][data-theme="dark"]{--volt:#ff6a2b;--on-volt:#0b0c0e;--volt-line:#ff7a3d;--volt-soft:#2f1609}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
/* Content inside <details> is rendered through the browser's own shadow slot,
   which the rule above cannot reach, so padded inputs stuck out of their card. */
details>*{box-sizing:border-box}
input[type=file]{max-width:100%;width:100%;font-size:14px}
html{scroll-padding-top:calc(var(--head-h) + env(safe-area-inset-top,0px));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.02;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:30px;text-transform:uppercase}
h3{font-size:21px}
p{margin:.35em 0}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums;font-weight:600}
b{font-weight:650}

/* ---------- header ---------- */
/* One sticky bar on every tab: the wordmark, this calendar week, and the save
   state. It replaced a decorative four-colour strip and the week grid that
   used to sit only on Today. */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);-webkit-backdrop-filter:saturate(170%) blur(18px);backdrop-filter:saturate(170%) blur(18px);display:flex;align-items:center;gap:10px;height:var(--head-h);padding:0 16px;border-bottom:1px solid var(--line-soft)}
.top h1{font-size:22px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;line-height:1;flex:none}
.top h1 span{color:var(--muted);font-weight:600}
/* A small phone keeps the week bar as wide as it can: the wordmark drops to
   IRON, which frees room for seven days. */
@media (max-width:374px){.top{gap:6px;padding:0 10px}.top h1{font-size:18px;letter-spacing:.03em}.top h1 span{display:none}}
.wkbar{flex:1 1 auto;min-width:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.wkbar .w{-webkit-appearance:none;appearance:none;position:relative;min-width:0;border:0;border-radius:12px;background:transparent;padding:2px 0;margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;line-height:1;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent}
.wkbar div.w{cursor:default}
/* Every day is a button, so each disc answers a press. An empty past day
   carries a small + : tapping it logs a workout for that date. */
.wkbar .w .dn{transition:transform .12s ease}
.wkbar .w:active .dn{transform:scale(.9)}
.wkbar .w.add .dn{position:relative}
.wkbar .w.add .dn::after{content:"+";position:absolute;right:-3px;bottom:-3px;width:13px;height:13px;border-radius:50%;background:var(--surface);color:var(--muted);box-shadow:0 0 0 1px var(--line);font:800 11px/13px var(--font);text-align:center}
@media (prefers-reduced-motion:reduce){.wkbar .w .dn{transition:none}}
.wkbar .w .wd{font:650 9.5px/1.1 var(--font);letter-spacing:.06em;text-transform:uppercase}
/* Each day is a small disc, like an activity ring: filled volt when trained,
   dashed when planned, a ring around today. */
.wkbar .w .dn{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font:800 15px/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums;background:var(--surface-2)}
.wkbar .w .nm{display:none;font-size:10px;line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px}
.wkbar .w.on .dn{background:var(--volt);color:var(--on-volt)}
.wkbar .w.plan .dn{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.wkbar .w.miss .dn{background:transparent;box-shadow:inset 0 0 0 1.5px var(--red)}
.wkbar .w.rest .dn{background:transparent;color:var(--muted)}
.wkbar .w.cardio .dn{background:transparent;box-shadow:inset 0 0 0 2px var(--volt-line)}
.wkbar .w.today .wd{color:var(--ink)}
.wkbar .w.today .dn{outline:2px solid var(--ink);outline-offset:2px}
.wkbar .w.live::after{content:"";position:absolute;top:0;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--volt);box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--volt-line)}
@media (max-width:374px){.wkbar .w .dn{width:24px;height:24px;font-size:13.5px}.wkbar .w.today .dn{outline-offset:1px}}
.ssb{flex:none;width:30px;height:30px;border-radius:50%;border:0;background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0;font:700 14px/1 var(--font);color:var(--muted);cursor:pointer}
.ssb .sst{display:none;font:600 12.5px var(--font)}
.ssb.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,transparent)}
.ssb.warn{color:var(--yellow);border-color:var(--yellow);background:var(--yellow-bg)}
.ssb.bad{color:var(--red);border-color:var(--red);background:var(--red-bg)}
@media (min-width:620px){
  :root{--head-h:62px}
  .wkbar{gap:5px}
  .wkbar .w .nm{display:block}
  .ssb{width:auto;border-radius:999px;padding:0 10px}
  .ssb .sst{display:inline}
}
.sync-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
main{max-width:760px;margin:0 auto;padding:6px 16px 150px}

/* ---------- page header ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:22px 0 14px}
.ph h2{font-size:46px;font-weight:800;letter-spacing:.01em;line-height:.95}
.ph .kick{font:600 12px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 2px}
.ph .meta{font-size:14px;color:var(--muted);margin:3px 0 0}
.ph-a{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- bottom tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--glass);-webkit-backdrop-filter:saturate(170%) blur(18px);backdrop-filter:saturate(170%) blur(18px);border-top:1px solid var(--line-soft);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{position:relative;background:none;border:0;min-height:58px;min-width:0;padding:7px 1px 6px;font:600 11px var(--font);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] svg{stroke:var(--volt-line);stroke-width:2.1}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:5px;left:50%;width:44px;height:30px;margin-left:-22px;border-radius:999px;background:color-mix(in srgb,var(--volt) 14%,transparent);z-index:-1}
.tabs button{isolation:isolate}
/* A session in progress: the Today tab reads Session and carries a dot, so it
   can be found again from any tab. */
.tabs button.live::after{content:"";position:absolute;top:7px;left:50%;margin-left:9px;width:8px;height:8px;border-radius:50%;background:var(--volt);box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--volt-line)}

/* ---------- help ---------- */
.hb{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--muted);font:700 13px var(--font);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.hb[aria-expanded="true"]{background:var(--ink);color:var(--on-ink);border-color:transparent}
.ht{font-size:14px;color:var(--ink-2);margin:4px 0 12px;padding:11px 13px;background:var(--surface);border-radius:var(--r-md);line-height:1.5}
.block .ht,.card .ht,.sheet .ht{background:var(--surface-2)}
.hrow{display:flex;align-items:center;gap:8px}

/* ---------- the one section component ----------
   Every foldable block on every tab is a .sec. It is open space on the
   page: a big condensed title and its summary, a hairline above, and no
   box. What sits inside is set on soft filled surfaces. Folds inside a
   section are .subsec: a hairline and a smaller title. */
.sec{background:transparent;border:0;border-top:1px solid var(--line-soft);border-radius:0;margin:0;overflow:visible}
.hero+.sec,.ph+.sec,.jump+.sec,.sec:first-child{border-top:0}
.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:66px;padding:12px 0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.sec>summary::-webkit-details-marker{display:none}
.sec-t{font:700 21px/1.15 var(--font);letter-spacing:-.015em;white-space:nowrap;flex:none}
/* The summary wraps to a second line instead of being cut off on a small phone. */
.sec-s{flex:1 1 auto;min-width:0;text-align:right;font-size:12px;line-height:1.3;color:var(--muted);font-variant-numeric:tabular-nums;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chev{width:22px;height:28px;border-radius:0;background:transparent;flex:none;display:inline-flex;align-items:center;justify-content:center}
.chev::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-2px) rotate(45deg);transition:transform .18s ease}
details[open]>summary .chev::before{transform:translateY(2px) rotate(-135deg)}
.sec-b{padding:0 0 22px}
.sec>summary:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:var(--r-md)}
.subsec{border-top:1px solid var(--line-soft);margin:14px 0 0;padding:0}
.subsec:last-child{margin-bottom:-8px}
.subsec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:52px;padding:6px 0;-webkit-tap-highlight-color:transparent}
.subsec>summary::-webkit-details-marker{display:none}
.subsec-t{font-weight:700;font-size:16px;flex:none}
.subsec>.sec-b{padding:2px 0 14px}
/* Inner cards lose their box inside a section: the section is the box. */
.sec-b .card{background:none;border:0;border-radius:0;padding:0;margin:14px 0 0;box-shadow:none}
.sec-b>.card:first-child{margin-top:0}
.panel{background:var(--surface);border-radius:var(--r-md);padding:13px 14px}
.block .panel,.card .panel,.sheet .panel{background:var(--surface-2)}

.callout{border-radius:var(--r-md);padding:11px 13px;font-size:14px;background:var(--surface)}
.callout.green{background:var(--green-bg)}.callout.yellow{background:var(--yellow-bg)}.callout.red{background:var(--red-bg)}.callout.blue{background:var(--blue-bg)}
.callout b{font-weight:650}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;letter-spacing:.02em;padding:4px 10px;border-radius:999px;background:var(--surface);color:var(--ink);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.green{background:var(--green-bg);color:var(--green)}.pill.yellow{background:var(--yellow-bg);color:var(--yellow)}.pill.red{background:var(--red-bg);color:var(--red)}.pill.blue{background:var(--blue-bg);color:var(--blue)}

/* ---------- basic blocks ---------- */
.card{background:var(--surface);border:1px solid var(--card-b);border-radius:var(--r-lg);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.section{margin:18px 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.spread{justify-content:space-between}
.stack>*+*{margin-top:10px}
.explain{font-size:13px;color:var(--muted);margin:2px 0 8px}

.btn{min-height:44px;border-radius:var(--r-md);border:1px solid var(--btn-b);background:var(--btn);font-weight:650;font-size:15px;padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);transition:background .12s,transform .08s}
.btn:active{transform:scale(.97)}
.block .btn,.card .btn,.sheet .btn,.panel .btn{background:var(--surface-2);border-color:transparent}
.btn.primary,.block .btn.primary,.card .btn.primary,.sheet .btn.primary,.panel .btn.primary{background:var(--volt);color:var(--on-volt);border-color:transparent;border-radius:999px}
.btn.danger{color:var(--red)}
.btn.sm{min-height:44px;padding:0 12px;font-size:14px;border-radius:var(--r-sm)}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btn.noted{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--btn-b);background:var(--btn);cursor:pointer;font-size:16px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.ib.sm{width:32px;height:32px;font-size:13px;color:var(--muted)}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--field);border:1px solid var(--field-b);border-radius:var(--r-sm);min-height:44px;padding:6px 11px;font-size:16px;width:100%;min-width:0;color:var(--ink)}
.block input,.block select,.sheet input,.sheet select,.sheet textarea,.card input,.card select{background:var(--surface-2);border-color:var(--field-b)}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 1px var(--ink)}
textarea{min-height:74px;resize:vertical}
label.field{display:block;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.01em}
label.field>input,label.field>select,label.field>textarea{margin-top:4px;color:var(--ink);font-weight:400}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.check-inline{display:flex;align-items:flex-start;gap:10px;font-size:15px;line-height:1.35}
.check-inline input{width:20px;height:20px;flex:none;margin:0;accent-color:var(--ink)}
.dmeta .check-inline{min-height:44px;align-items:center;cursor:pointer}

.tag{display:inline-block;font-size:11.5px;font-weight:650;letter-spacing:.02em;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap;vertical-align:1px}
.tag.rare,.tag.yellow{background:var(--yellow-bg);color:var(--yellow)}
.tag.green{background:var(--green-bg);color:var(--green)}
.tag.red{background:var(--red-bg);color:var(--red)}
.tag.blue{background:var(--blue-bg);color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;position:relative;padding:0 14px;border-radius:999px;border:1px solid var(--btn-b);background:var(--btn);cursor:pointer;font-size:14px;font-weight:600;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--on-ink);border-color:transparent}

.plate{display:inline-block;width:6px;height:22px;border-radius:2px;flex:none}
.plate.green{background:var(--green)} .plate.yellow{background:var(--yellow)} .plate.red{background:var(--red)} .plate.blue{background:var(--blue)} .plate.none{background:var(--line)}

/* ---------- program: days ---------- */
.day{background:var(--surface);border:1px solid var(--card-b);border-radius:var(--r-lg);margin:10px 0;overflow:hidden}
.day:first-child{margin-top:4px}
.day.rest{opacity:.75}
.dh{display:flex;gap:8px;align-items:center;padding:8px 8px 6px 10px}
.dh .dlabel{font:700 20px var(--display);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;flex:none}
.dh input[type=text]{font-weight:600;min-height:40px;background:var(--surface-2);border-color:transparent}
.dmeta{padding:0 12px 4px;font-size:13.5px;color:var(--muted)}
.dmeta.row{flex-wrap:nowrap;gap:8px}
.dmeta .check-inline{flex:none;color:var(--ink);font-size:14px;align-items:center}
ul.items,ul.lib{list-style:none;margin:0;padding:2px 10px 6px}
ul.items:empty{min-height:54px;margin:6px 12px;border:2px dashed var(--line);border-radius:var(--r-sm)}
ul.items:empty::before{content:"Drop or add exercises here";display:block;padding:14px;color:var(--muted);font-size:14px;text-align:center}
.it{border-bottom:1px solid var(--line-soft);padding:3px 0}
.it:last-child{border-bottom:0}
.ir{display:flex;align-items:center;gap:6px}
.ir .ib{width:40px;height:40px;background:transparent}
.ib:disabled{opacity:.35;cursor:default}
.sgrip{width:22px;height:32px;display:inline-flex;align-items:center;justify-content:center;cursor:grab;color:var(--muted);font-size:15px;touch-action:none;flex:none;user-select:none;-webkit-user-select:none;border-radius:6px;margin-left:-6px;opacity:.4}
.sgrip:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.dgrip{width:26px;height:40px;display:inline-flex;align-items:center;justify-content:center;cursor:grab;color:var(--muted);font-size:19px;touch-action:none;flex:none;user-select:none;-webkit-user-select:none;margin-left:-4px}
.dfold{background:transparent!important;border:0!important}
.dfold::before{content:"";display:inline-block;width:8px;height:8px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateY(-2px) rotate(45deg)}
.dfold[aria-expanded="true"]::before{transform:translateY(2px) rotate(-135deg)}
.grip{width:30px;height:40px;display:inline-flex;align-items:center;justify-content:center;cursor:grab;color:var(--muted);font-size:19px;touch-action:none;flex:none;user-select:none;-webkit-user-select:none}
.imain{flex:1;min-width:0;text-align:left;background:none;border:0;padding:6px 2px;cursor:pointer;color:var(--ink)}
.imain b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600;line-height:1.25}
.imain span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ied{padding:8px 2px 12px 36px}
.sortable-ghost{opacity:.35}
.sortable-chosen{background:var(--surface-3)}
.lib-panel{max-height:340px;overflow:auto;border-radius:var(--r-md);margin-top:10px;background:var(--surface)}
.lib-panel .it{border-color:var(--line)}

/* ---------- logger ---------- */
.block{background:var(--surface);border:1px solid var(--card-b);border-radius:var(--r-lg);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.block.ss{box-shadow:inset 3px 0 0 var(--blue)}
.block.ss+.block.ss{margin-top:-4px}
.it.ss .imain b::after{content:" · SS";color:var(--blue);font-size:12px}
.bh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.bh-acts{display:flex;gap:3px;flex:none}
.bh h3{overflow-wrap:anywhere;font-size:24px;text-transform:uppercase;letter-spacing:.02em}
.bh p{margin-top:3px}
.bh>div:first-child{min-width:0}
.hint{font-size:14px;background:var(--surface-2);padding:10px 12px;border-radius:var(--r-md);margin:12px 0 6px;line-height:1.45}
.hint b{font-weight:650}
.lmrow{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 0}
.lm{display:inline-block;font:650 12px/1 var(--font);letter-spacing:.02em;padding:4px 8px;border-radius:999px;border:1px solid var(--ink);color:var(--ink);white-space:nowrap}
.bnote{margin:6px 0 0;padding:6px 9px;background:var(--surface-2);border-radius:var(--r-sm);color:var(--ink)}
.aiout{white-space:pre-wrap;margin-top:10px;min-height:1.4em;line-height:1.55}
.lnote{margin:6px 0 0;padding:6px 9px;border:1px dashed var(--line);border-radius:var(--r-sm);color:var(--muted)}
.linkbtn{background:none;border:0;padding:4px 2px;margin:0;color:var(--ink);font:inherit;font-weight:650;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.flag{color:var(--yellow);font-weight:650}
.tp{display:block;margin-top:3px;color:var(--muted)}
.tp:empty{display:none}
.tp.beat{color:var(--green);font-weight:650}
.tp.ez{color:var(--blue)}
.trend{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.sg{position:relative;display:grid;grid-template-columns:24px minmax(0,1.3fr) minmax(0,1fr) minmax(0,.8fr) 40px 44px;gap:6px;align-items:center;margin-top:6px}
.sg.head{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:650;margin-top:12px}
.sg .n{font:700 17px var(--display);color:var(--muted);text-align:center}
@media (max-width:360px){.sg input::placeholder{font-size:13px;letter-spacing:-.02em}}
.sg input{text-align:center;padding:6px 4px;font-variant-numeric:tabular-nums;font-weight:600}
.sg select{text-align:center;padding:6px 2px;min-height:44px}
.sg select.unset{color:var(--muted)}
.sg.done input,.sg.done select{border-color:color-mix(in srgb,var(--volt-line) 55%,transparent);background:var(--volt-soft)}
.sg.norir{grid-template-columns:24px minmax(0,1.3fr) minmax(0,1fr) 40px 44px}
.sg .n.drop{color:var(--blue)}
.sg .n.warm{color:var(--yellow);font-size:15px}
.wbtn,.cbtn{height:44px;border-radius:var(--r-sm);border:1px solid var(--field-b);background:var(--surface-2);cursor:pointer;font-weight:700;color:var(--muted)}
.wbtn.on{background:var(--yellow);color:var(--on-accent);border-color:transparent}
.wbtn.drop{background:var(--blue);color:var(--on-accent);border-color:transparent}
.cbtn{font-size:17px}
.cbtn{border-radius:50%;width:44px}
.cbtn.on{background:var(--volt);color:var(--on-volt);border-color:transparent}
.sg.pr::after{content:attr(data-pr);position:absolute;right:0;top:-9px;background:var(--gold);color:var(--on-gold);font:700 10px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:6px;pointer-events:none}
.ci-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap}
.ci-row>span{min-width:58px;font-weight:600}
.caldue{margin:6px 0 0;color:var(--blue)}
ol.steps{margin:6px 0 10px;padding-left:22px;font-size:15px}
ol.steps li{margin:2px 0}
.ob{min-height:calc(100dvh - 40px);display:flex;flex-direction:column;gap:14px;padding:10px 0 28px}
body.obmode .tabs,body.obmode header.top{display:none}
body.obmode .ob{padding-top:calc(env(safe-area-inset-top,0px) + 10px)}
.ob-card .btn:not(.primary){background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
body.obmode main,body.obmode #view{padding-bottom:24px}
.ob-top{padding:18px 2px 4px}
.ob-logo{font:800 44px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.ob-logo span{color:var(--muted);font-weight:600}
.ob-tag{margin:10px 0 0;color:var(--muted);font-size:16px;line-height:1.4}
.ob-card{background:var(--surface);border:1px solid var(--card-b);border-radius:var(--r-lg);padding:18px}
.ob-card h2{font:700 26px/1.1 var(--display);letter-spacing:.01em;margin:0 0 6px}
.ob-card p{margin:0 0 14px;color:var(--muted);font-size:15px;line-height:1.4}
.ob-card .btn+.btn{margin-top:8px}
.ob-skip{align-self:center;min-height:44px;color:var(--muted)}
.ob-dots{display:flex;justify-content:center;gap:6px;margin-top:auto;padding-top:6px}
.ob-dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.ob-dots i.on{background:var(--volt)}
.ob-back{align-self:flex-start;min-height:44px;color:var(--muted);text-decoration:none}
.ob-h{font:700 30px/1.05 var(--display);letter-spacing:.01em;margin:4px 0 0}
.ob-units{display:flex;gap:6px}
.ob-units .chip{min-height:44px;flex:1;justify-content:center}
.ob-opts{display:flex;flex-direction:column;gap:8px}
.ob-opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:60px;padding:12px 16px;border-radius:var(--r-md);border:1px solid var(--btn-b);background:var(--btn);color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.ob-opt b{font-size:16px;font-weight:700}
.ob-opt span{font-size:13.5px;color:var(--muted)}
.ob-opt.primary{background:var(--volt);border-color:var(--volt);color:var(--on-volt)}
.ob-opt.primary span{color:var(--on-volt);opacity:.8}
.ob-opt input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.ob-splash{min-height:60vh;display:flex;align-items:center;justify-content:center}
.welcome h3{margin-bottom:10px;font:700 24px/1.15 var(--font);letter-spacing:-.015em}
/* The account offer on the welcome card: an accent edge so it reads as the first step. */
.welcome .acct-offer{box-shadow:inset 3px 0 0 var(--volt)}
/* Log a past workout: one row per routine day, name left, detail right. */
.fbshot{display:flex;align-items:center;gap:10px}
.fbshot img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.fbpick{cursor:pointer}
.fbinbox li{align-items:flex-start}
.fbthumb{display:block;max-width:160px;max-height:220px;margin-top:6px;border-radius:8px;border:1px solid var(--line)}
.fbctx{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;margin:4px 0 0}
.btn.pastday{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;min-height:48px}
.btn.pastday small{font-weight:500;opacity:.75;white-space:nowrap}
.short-list{list-style:none;margin:10px 0 0;padding:0}
.short-list li{padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:15px}
.short-list li:last-child{border-bottom:0}
.hide-grp{margin-top:12px}
.hide-grp>p{margin:0 0 6px}
.lh-row{margin-top:10px;flex-wrap:wrap}
.lh-row input[type=date]{width:auto;flex:0 1 160px;min-height:44px;padding:4px 8px;font-size:16px}
.whtr{margin:8px 0 0}

/* ---------- stats ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line-soft);border:1px solid var(--card-b);border-radius:var(--r-lg);overflow:hidden}
@media(min-width:560px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:559px){.kpis>.kpi:last-child:nth-child(odd){grid-column:1/-1}}
.kpi{background:var(--surface);border:0;border-radius:0;padding:14px 16px 15px}
.kpi .v{font:800 40px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.005em}
.kpi .v .small{font:600 14px var(--font);color:var(--muted)}
.kpi .l{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.35}
.mrow{display:grid;grid-template-columns:6px 92px minmax(0,1fr) auto;gap:9px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:14.5px}
.mrow:last-child{border-bottom:0}
.mrow .plate{height:18px}
.mrow .r{text-align:right;white-space:nowrap;min-width:60px;font-variant-numeric:tabular-nums}
.band{position:relative;height:12px;background:var(--surface-3);border-radius:6px;overflow:hidden}
.sec .band{background:var(--surface-2)}
.band .zone{position:absolute;top:0;bottom:0;background:var(--green-bg)}
.band .fill{position:absolute;top:0;bottom:0;left:0;border-radius:6px}
.band .fill.prog{background:var(--volt);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--volt-line) 40%,transparent)}
.band .fill.under{background:var(--yellow)} .band .fill.in{background:var(--green)} .band .fill.over{background:var(--blue)}
.band .fill.down{background:var(--red)}
.band .fill.track{background:var(--muted)}
.band .fill.ghost{opacity:.35}
.band .fill.conf{background:var(--ink);opacity:.6}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 6px}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:4px;vertical-align:1px;font-style:normal}
.chartbox{position:relative;height:220px;margin-top:10px}
.chips.rng{justify-content:flex-end;margin:8px 0 0;gap:4px}
.chips.rng .chip{min-height:30px;padding:0 11px;font-size:13px}
.chartbox.tall{height:320px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.heat div{aspect-ratio:1;border-radius:50%;background:var(--surface-2)}
.heat div.on{background:var(--volt)}
.heat div.fut{opacity:.35}
.heat div.today{outline:2px solid var(--ink);outline-offset:-2px}
.heat-h{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-align:center}
table.t{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:7px 4px;border-bottom:1px solid var(--line-soft);text-align:left}
table.t th{color:var(--muted);font-weight:650;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
table.t td.r,table.t th.r{text-align:right}
.scroll-x{overflow-x:auto}
.jump{position:sticky;top:calc(var(--head-h) + env(safe-area-inset-top,0px));z-index:15;display:flex;gap:6px;overflow-x:auto;padding:8px 16px;margin:0 -16px;background:var(--glass);-webkit-backdrop-filter:saturate(170%) blur(18px);backdrop-filter:saturate(170%) blur(18px);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.jump::-webkit-scrollbar{display:none}
.jump .chip{flex:none;min-height:32px;font-size:13px}
.sec[id^="sec-"]{scroll-margin-top:calc(var(--head-h) + 56px + env(safe-area-inset-top,0px))}
.bw-entry{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto;gap:8px;align-items:end;margin-top:12px}
.bw-entry .btn{min-height:44px}
.bw-list{list-style:none;margin:10px 0 0;padding:0}
.bw-list li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line-soft);font-size:15px}
.bw-list li:last-child{border-bottom:0}
.bw-list .d{color:var(--muted);flex:1}
.body-sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.body-sum>div{background:var(--surface);border-radius:var(--r-md);padding:12px 14px}
.body-sum>div:only-child{grid-column:1/-1}
.body-sum .v{font:800 34px/1 var(--display);font-variant-numeric:tabular-nums}
.body-sum .v .small{font:600 13px var(--font);color:var(--muted)}
.body-sum .l{font-size:12px;color:var(--muted);margin-top:4px}

/* ---------- week strip ---------- */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:0 0 8px}
.wk .d{-webkit-appearance:none;appearance:none;width:100%;min-width:0;border:1px solid transparent;border-radius:var(--r-md);background:var(--surface);padding:6px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;font:inherit;color:var(--muted);cursor:default}
.wk .d .wd{font:600 10.5px var(--font);letter-spacing:.08em;text-transform:uppercase}
.wk .d .dn{font:800 19px/1.05 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.wk .d .nm{font-size:10px;line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.wk .d.plan{border:1px dashed var(--muted);background:transparent;color:var(--ink)}
.wk .d.miss{border:1px dashed var(--red);background:transparent}
.wk .d.on{background:var(--volt);color:var(--on-volt);cursor:pointer}
.wk .d.on .dn{color:var(--on-volt)}
.wk .d.today{box-shadow:0 0 0 2px var(--ink)}
.wk .d.fut{opacity:.75}
.wk .d.cardio{border-color:var(--volt-line);color:var(--ink)}
.cyc{display:flex;gap:4px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cyc::-webkit-scrollbar{display:none}
/* A soft fade at the right edge shows the row scrolls. */
.cyc{-webkit-mask-image:linear-gradient(90deg,#000 86%,transparent);mask-image:linear-gradient(90deg,#000 86%,transparent);padding-right:24px}
.cyc .c{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;white-space:nowrap;color:var(--muted);background:transparent}
.cyc .c b{margin-right:5px;font:800 13px var(--display)}
.cyc .c.done{background:var(--volt);color:var(--on-volt);border-color:transparent}
.cyc .c.next{border:2px solid var(--ink);color:var(--ink);font-weight:650}
.cyc .c.rest{color:var(--muted);border-style:dashed}

/* ---------- today: the hero is the one inked block ---------- */
.hero{background:var(--hero-bg),var(--hero);color:var(--on-hero);border:0;border-radius:28px;padding:18px 18px 16px;margin:14px 0 14px;box-shadow:var(--hero-shadow)}
.hero .eyebrow{color:var(--on-hero);opacity:.7}
.hero .hello{font:700 17px/1.2 var(--font);letter-spacing:-.01em;margin:0 0 6px;color:var(--on-hero)}
.hero h2{font-size:54px;font-weight:800;line-height:.92;margin:6px 0 8px;letter-spacing:.01em;overflow-wrap:anywhere}
.hero .muted{color:var(--on-hero);opacity:.72}
.hero .overb{color:var(--yellow)}
.eyebrow{font:600 12px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.hero-note{background:color-mix(in srgb,var(--on-hero) 9%,transparent);border-radius:var(--r-md);padding:10px 12px;margin:10px 0 0}
.hero .btn{background:color-mix(in srgb,var(--on-hero) 9%,transparent);color:var(--on-hero);border-color:transparent}
.hero .btn.primary{background:var(--volt);color:var(--on-volt);border-color:transparent;box-shadow:0 0 0 1px rgba(0,0,0,.2),0 6px 20px color-mix(in srgb,var(--volt) 25%,transparent)}
.hero .btn.noted{box-shadow:inset 0 0 0 1px var(--on-hero)}
.hero .tag.blue{background:color-mix(in srgb,var(--on-hero) 16%,transparent);color:var(--on-hero)}
.btn.big{font:800 23px var(--display);letter-spacing:.07em;text-transform:uppercase;min-height:58px;margin-top:16px;border-radius:999px}
.inline-sel{display:flex;align-items:center;gap:8px;color:inherit;margin:0;white-space:nowrap;min-width:0;font-size:13px;opacity:.9}
.inline-sel select{max-width:200px;min-width:0;flex:1 1 auto;padding:6px 8px;font-size:13px;min-height:36px}
.hero .inline-sel{flex:1 1 auto}
.hero .inline-sel select{max-width:none;background:color-mix(in srgb,var(--on-hero) 10%,transparent);color:var(--on-hero);border-color:color-mix(in srgb,var(--on-hero) 25%,transparent)}

  if(!manual&&(document.visibilityState!=='visible'||Date.now()-acctWait.last<3000)){waitSchedule();return;}
  acctWait.busy=true;acctWait.last=Date.now();const m0=ui.modal;
  const sheet=()=>{const m=ui.modal;return m&&m.kind==='account'&&m.mode==='wait'?m:null;};
  if(manual&&sheet()){m0.busy=true;m0.err='';renderModal();}
  try{
    acct.user=await A.signIn(acctWait.email,acctWait.pw);waitStop();
    try{localStorage.removeItem(ACCT_LATER);}catch(e){/* nothing to clear */}
    if(sheet())closeModal();
    toast('Email confirmed. Signed in and syncing.');await cloudInit();acctRerender();
  }catch(e){
    const m=sheet();
    const unconfirmed=e&&(e.code==='email_not_confirmed'||/Confirm your email/i.test(e.message||''));
    if(!unconfirmed&&/Wrong email or password/.test((e&&e.message)||'')){waitStop();if(m){m.mode='signin';m.err='That password did not work. Sign in with the one you chose.';}}
    else if(m&&manual)m.err=unconfirmed?'Not confirmed yet. Open the link in the email first.':((e&&e.message)||'Try again.');
    if(!unconfirmed)log('auth',e);
  }finally{acctWait.busy=false;const m=sheet();if(m){m.busy=false;renderModal();}waitSchedule();}
}

async function acctInit(){

    if(ev==='PASSWORD_RECOVERY'&&!(ui.modal&&ui.modal.kind==='account'))openModal({kind:'account',mode:'newpw',pw:''});
    // Signed in some other way while waiting for the confirmation (another tab sharing this storage): stop waiting.
    if(ev==='SIGNED_IN'&&user&&acctWait.pw){waitStop();const m=ui.modal;if(m&&m.kind==='account'&&m.mode==='wait'){closeModal();toast('Email confirmed. Signed in and syncing.');}}

       signed this browser in, but nothing syncs here until we know this is
       where Ironlog is used (cloud-supabase.js holds it). If this storage
       is the one waiting for the confirmation (the same browser, or an
       Android app sharing it), this is the place: stay signed in. Otherwise
       ask (item 61): here, or the home-screen app, which on an iPhone keeps
       separate storage and signs itself in when it comes back to the front. */
    let mine=null;try{mine=JSON.parse(localStorage.getItem(ACCT_WAIT)||'null');}catch(e){/* no marker */}
    if(mine&&Date.now()-(+mine.t||0)<60*60000){
      try{localStorage.removeItem(ACCT_WAIT);}catch(e){/* nothing to clear */}
      if(typeof A.release==='function')A.release();
      openModal({kind:'account',mode:'sent',title:'Email confirmed',msg:'You are signed in. Your log syncs to your account.'});

/* Two tabs (or the app and a second window) used to overwrite each other: each
   wrote its whole state, so the one that saved last erased what the other had
   saved. Now each tab hears the other's save and merges it into its own
   state, record by record, with this tab's last save as the base: changes
   made only there are taken, changes made only here are kept. Content is
   compared with canon(), which ignores key order, so two tabs holding the
   same data never keep rewriting it back and forth. */
window.addEventListener('storage',ev=>{
  if(ev.storageArea&&ev.storageArea!==localStorage)return;
  if(ev.key===SYNC_KEY&&ev.newValue){
    try{const m=JSON.parse(ev.newValue);if(m&&typeof m==='object'){if(m.meta&&typeof m.meta==='object')cloud.meta=m.meta;if(m.editAt&&typeof m.editAt==='object')cloud.editAt=m.editAt;if(m.last)cloud.last=m.last;}}catch(e){log('tabs',e);}

  try{incoming=normalize(JSON.parse(ev.newValue));}catch(e){log('tabs',e);return;}
  try{base=lastSaved?normalize(JSON.parse(lastSaved)):null;}catch(e){base=null;}

  if(canon(state)!==canon(incoming))saveNow();
  if(!ui.modal)rerenderKeepScroll();else render();
  conflictNote(stat);
});

   starts the timer, which is a user gesture, so the beep is allowed to play
   later. A backgrounded tab can still suppress it, which is why the bar also
   changes state and the elapsed time is computed from an absolute end stamp
   rather than counted down. */

function beep(){

      const o=actx.createOscillator(),g=actx.createGain();

      g.gain.exponentialRampToValueAtTime(0.0001,t0+off+0.18);

  }catch(e){log('audio',e);}

   the volume bands silently counted it as hard anyway. A native picker is one
   tap, which is the difference between measuring and assuming. */
/* RIR is picked from a strip of 0 to 5 instead of the phone's dropdown wheel
   (open, spin, confirm on every set). The cell shows the value; tapping it
   opens the strip under that set, and ticking a set done with no RIR yet
   opens it by itself, so logging effort is one tap. */
const RIR_OPTS=['0','1','2','3','4','5'];
function rirSelect(val,bi,si,target){
  const cur=val==null||val===''?'':String(val);
  return `<button type="button" class="rirb${cur===''?' unset':''}" data-act="rirOpen" data-f="rir" data-b="${bi}" data-s="${si}" aria-haspopup="true" aria-expanded="false" aria-label="Reps in reserve for set ${si+1}: ${cur===''?'not set':cur}">${cur===''?(target!=null?'–':'RIR'):esc(cur)}</button>`;
}
function rirStripHTML(bi,si,cur){
  const opts=RIR_OPTS.slice();if(cur!==''&&!opts.includes(cur)){opts.push(cur);opts.sort((a,b)=>a-b);}
  return `<div class="rirstrip" role="group" aria-label="Reps in reserve for set ${si+1}" data-b="${bi}" data-s="${si}"><span class="rs-l">RIR</span>${opts.map(o=>`<button type="button" data-act="rirPick" data-b="${bi}" data-s="${si}" data-v="${o}" aria-pressed="${cur===o}"${cur===o?' class="on"':''}>${o}</button>`).join('')}<button type="button" class="rs-x" data-act="rirPick" data-b="${bi}" data-s="${si}" data-v="" aria-label="Clear RIR">✕</button></div>`;
}
function rirClose(){const el=document.querySelector('.rirstrip');if(!el)return;const b=document.querySelector(`.rirb[data-b="${el.dataset.b}"][data-s="${el.dataset.s}"]`);if(b)b.setAttribute('aria-expanded','false');el.remove();}
function rirShowStrip(bi,si){
  rirClose();const btn=document.querySelector(`.rirb[data-b="${bi}"][data-s="${si}"]`);const s=state.draft&&state.draft.ex[bi]&&state.draft.ex[bi].sets[si];
  if(!btn||!s)return;const row=btn.closest('.sg');if(!row)return;
  row.insertAdjacentHTML('afterend',rirStripHTML(bi,si,s.rir==null?'':String(s.rir)));btn.setAttribute('aria-expanded','true');
  // The rest bar appears on the same tap and can cover the strip; lift it
  // into view above the bar and the tabs.
  requestAnimationFrame(()=>{const st=row.nextElementSibling;if(!st||!st.classList.contains('rirstrip'))return;
    let lim=window.innerHeight;for(const id of ['timer','tabs']){const el=document.getElementById(id);if(el&&!el.hidden){const t=el.getBoundingClientRect().top;if(t>0)lim=Math.min(lim,t);}}
    const r=st.getBoundingClientRect();if(r.bottom>lim-8)window.scrollBy({top:r.bottom-lim+16,behavior:'smooth'});});
}
/* Cardio and mobility inside a session: saved as their own entries on Finish,

    <label class="field">Avg HR<input type="text" inputmode="numeric" data-cf="hr" data-c="${ci}" value="${c.hr==null?'':c.hr}" placeholder="optional"></label></div>
    <div class="row" style="margin-top:6px"><select data-cf="when" data-c="${ci}" style="flex:1" aria-label="When">${CWHEN.map(([k,l])=>`<option value="${k}" ${c.when===k?'selected':''}>${l}</option>`).join('')}</select><button class="btn sm danger" data-act="cDraftDel" data-c="${ci}">Remove</button></div>`).join('');

  <div class="row" style="margin-top:${n?10:0}px"><button class="btn sm" data-act="cDraftAdd" data-when="pre">+ Before lifting</button><button class="btn sm" data-act="cDraftAdd" data-when="post">+ After lifting</button></div>`});
}

/* The first machine, cable or Smith exercise in a session is offered a
   calibration set when none was done in the last 3 weeks, RIR is on, and
   you have at least 3 real sessions. Not now waits another 3 weeks. */
function calDueIdx(d){
  if(state.settings.rirMode==='off')return -1;
  if(state.sessions.filter(s=>!s.demo).length<3)return -1;
  const cut=addDays(today(),-21);
  if(state.settings.calSnooze&&state.settings.calSnooze>cut)return -1;
  const c=calStats();if(c.lastDate&&c.lastDate>cut)return -1;
  if(d.ex.some(b=>b.sets.some(x=>x.cal)))return -1;
  return d.ex.findIndex(b=>{const ex=EX(b.exId);return !ex.timed&&['machine','cable','smith'].includes(ex.equip)&&!b.inj;});
}

/* The open day: the one picked last, else the day + adds to, else the first
   training day. An empty string means the user closed them all. */
function dayFocusId(R){
  if(typeof ui.dayFocus==='string'&&(ui.dayFocus===''||R.days.some(d=>d.id===ui.dayFocus)))return ui.dayFocus;
  const t=R.days[ui.bTarget];if(t)return t.id;
  const f=R.days.find(d=>!d.rest)||R.days[0];return f?f.id:'';
}
function itemHTML(R,di,it,ii){

    <button class="btn sm" data-act="iSwap" data-uid="${it.uid}" style="align-self:flex-end">Swap</button><button class="btn sm danger" data-act="iDel" data-day="${di}" data-i="${ii}" style="align-self:flex-end">Remove</button></div>
    ${nx?`<div class="row" style="margin-top:8px"><button class="btn sm ${linked?'noted':''}" data-act="ssToggle" data-uid="${it.uid}">${linked?'Unlink superset':'Superset with next'}</button>${linked?`<span class="small muted">Paired with ${esc(exName(nx.exId))}: alternate sets, rest once after the pair.</span>`:''}</div>`:''}
    ${ex.note?`<p class="small muted">${esc(ex.note)}</p>`:''}</div>`:''}</li>`;
}
function bLibItems(){return libFiltered(ui.bLibQ,ui.bLibM,'',false).map(e=>`<li class="it" data-ex="${e.id}"><div class="ir"><span class="grip" aria-hidden="true">⠿</span><div class="imain"><b>${esc(e.name)}</b><span>${esc(ML[e.primary])}, ${esc(EQL[e.equip]||e.equip)}${e.rare?', less common':''}</span></div><button class="ib" aria-label="Add ${esc(e.name)}" data-act="libAdd" data-ex="${e.id}">+</button></div></li>`).join('');}
function libFiltered(q,m,e,rare){
  q=(q||'').toLowerCase().trim();
  return state.exercises.filter(x=>!x.archived&&(!q||x.name.toLowerCase().includes(q))&&(!m||x.primary===m||x.secondary.includes(m))&&(!e||x.equip===e)&&(!rare||x.rare)).sort((a,b)=>a.name.localeCompare(b.name));
}
function volumeRows(sets,conf){
  const bands=state.settings.bands;
  const maxScale=Math.max(24,...MK.map(m=>Math.max(sets[m]||0,bands[m][1]+2)));
  const hasConf=!!conf;
  const head=hasConf?`<div class="legend"><span><i style="background:var(--ink);opacity:.55"></i>RIR logged</span><span><i style="background:var(--green);opacity:.34"></i>assumed hard (RIR blank)</span></div>`:'';
  return head+MK.map(m=>{
    const v=sets[m]||0;const[lo,hi]=bands[m];const tr=TRACK_ONLY.has(m);const cls=tr?'track':v<lo?'under':v>hi?'over':'in';
    const plate=tr?'none':v<lo?'yellow':v>hi?'blue':'green';
    const c=hasConf?Math.min(conf[m]||0,v):0;
    const tip=` data-tip="${esc(ML[m])}: ${r1(v)} hard sets${hasConf?`, ${r1(c)} with RIR logged, ${r1(v-c)} assumed`:''}. ${tr?'Tracked only: no study sets a weekly dose for it.':`Target ${lo} to ${hi}; the upper number is typical, not a ceiling.`}"`;
    return `<div class="mrow"><span class="plate ${plate}"></span><span>${ML[m]}</span><div class="band"${tip}><div class="zone" style="left:${lo/maxScale*100}%;width:${(hi-lo)/maxScale*100}%"></div><div class="fill ${cls}${hasConf?' ghost':''}" style="width:${Math.min(100,v/maxScale*100)}%"></div>${hasConf&&c>0?`<div class="fill conf" style="width:${Math.min(100,c/maxScale*100)}%"></div>`:''}</div><span class="r num">${r1(v)}<span class="muted small"> /${lo}-${hi}</span></span></div>`;
  }).join('');
}

/* ---------- DASHBOARD ---------- */
function viewDash(){
  const I=IDX();const R=activeRoutine();
  /* Adherence counts only days the routine actually plans work on: a non-rest
     day with no exercises in it used to inflate the denominator. Each week is
     capped at its own planned days, so training seven days against a six-day
     routine no longer reports 117%. The window is the four completed weeks
     before this one, which the label now says out loud. */
  const planned=trainDaysOf(R)*weekFactor(R);
  const cur=weekStart(today());
  const sessDates=new Set(state.sessions.map(s=>s.date));
  /* Only weeks since your first session count. Before that there was nothing
     to adhere to, and counting those weeks read 0% on day one. */
  const firstWk=state.sessions.length?weekStart(sortedSessions()[0].date):null;
  let done4=0,wks4=0;
  for(let k=1;k<=4;k++){
    const ws=addDays(cur,-7*k);if(!firstWk||ws<firstWk)break;let n=0;wks4++;
    for(let d=0;d<7;d++)if(sessDates.has(addDays(ws,d)))n++;
    done4+=Math.min(n,planned);
  }
  const adher=planned&&wks4?Math.round(done4/(planned*wks4)*100):null;
  const thisWeek=I.weekSets[cur]||{};
  const thisWeekConf=I.weekConf[cur]||{};
  // Each set once, as on Today. Summing the per-muscle counts double counts
  // secondary work (a bench set is 1 chest + 0.5 triceps + 0.5 delts).
  const wkHard=weekStats().got;
  const pr14=I.prs.filter(p=>p.date>=addDays(today(),-14)).length;
  const stalled=Object.entries(I.exStats).filter(([,s])=>s.stalled);
  // How much of the last 4 weeks of volume is measured rather than assumed.
  const rc=I.rirCov;const covPct=rc.total&&state.settings.rirMode!=='off'?Math.round(rc.logged/rc.total*100):null;
  // Only said when it matters: under 70% of recent sets carry an RIR.
  const cov=covPct==null||covPct>=70?'':`<p class="small muted hastip" style="margin:0 0 12px" data-tip="A blank RIR is read as your usual RIR on that lift once you have rated 3 of its sets in 12 weeks, else the set counts as hard. The lighter shading shows those sets.">RIR on ${covPct}% of recent sets. The lighter part of each bar is assumed.</p>`;
  let h=pageHead('Your log, measured','Stats',`${state.sessions.length} session${state.sessions.length===1?'':'s'} logged${state.sessions.length?`, since ${fmtDate(sortedSessions()[0].date)}`:''}`,helpBtn('stats'))+`${helpText('stats','Everything here is calculated from your logged sets: performance trends, not direct measurements of muscle size. Tap a section title to open or fold it. Each visit starts with only the top section open. Each section has its own ? for what the numbers mean.')}
  <nav class="jump" aria-label="Stats sections">${orderKeys(state.settings.secOrder.dash||[],DSEC_KEYS).filter(k=>!state.settings.hidden.includes('dash:'+k)).map(k=>DSECS.find(x=>x[0]===k)).map(([k,l])=>`<button class="chip" data-act="dashJump" data-sec="${k}">${l}</button>`).join('')}</nav>`;
  if(!state.sessions.length){
    h+=`<div class="card"><p style="margin:0"><b>No sessions yet.</b> Planned volume works now; trends start after a few sessions. ${tipi('Trends, stall detection and rankings need a few sessions of each exercise. To preview the full Stats page, load demo data in Settings.','About Stats')}</p></div>`;
  }
  h+=`<div class="kpis"><div class="kpi"><div class="v">${adher==null?'n/a':adher+'%'}</div><div class="l">${!planned?'Adherence: no planned days':adher==null?'Adherence: appears after your first full week':`Adherence, previous ${wks4} full week${wks4===1?'':'s'} (${r1(done4)}/${r1(planned*wks4)})`}</div></div>
  <div class="kpi"><div class="v">${wkHard}</div><div class="l">Hard sets this week, of ${weekStats().tgt} planned</div></div>
  <div class="kpi"><div class="v" style="color:${stalled.length>=3?'var(--red)':'inherit'}">${stalled.length}</div><div class="l">Stalled exercises</div></div>${extraKpis()}</div>`;
  if(state.sessions.length)h+=dashSummary();
  if(aiOn()&&state.sessions.some(x=>!x.demo))h+=`<div class="card row spread"><span class="small">Ask Claude a question about your own log: a stall, a split, a weak point.</span><button class="btn sm primary" data-act="aiReview">Ask Claude</button></div>`;

  const avg=actualAvg4();const plan=plannedSets(R);const bands=state.settings.bands;

  // volume: five ways to read the same hard-set counts, plus tonnage
  h+=dsec('volume','Volume','Hard sets per muscle. Direct work counts 1, secondary counts 0.5. A set counts as hard when you logged RIR 3 or less. A blank RIR is read as your usual RIR on that lift once you have rated 3 of its sets in the last 12 weeks, and until then counts as hard, because most working sets are. Blank sets are shaded lighter so you can see how much of the bar is measured and how much is assumed. Amber is under your band, green is inside it, blue is over. Load is total weight × reps per week, comparable week to week but not session to session.',
    `${cov}
  <div class="chips">${[['planned','Planned'],['week','This week'],['avg','Recent average'],['trend','Weekly trend'],['region','By region'],['load','Load']].map(([k,l])=>`<button class="chip ${ui.volMode===k?'on':''}" data-act="volMode" data-v="${k}">${l}</button>`).join('')}</div>
  ${ui.volMode==='region'?regionBody(avg,thisWeek):ui.volMode==='trend'?trendBody():ui.volMode==='load'?`<div class="card">${volHeadline()}${state.sessions.length?`${rangeChips('vol',weeksSpan(firstDate(state.sessions)),8)}<div class="chartbox"><canvas id="chVol"></canvas></div>${chartFallback()}`:'<p class="small muted">Log a session to start this chart.</p>'}</div>`:`<div class="card">${ui.volMode==='planned'?volumeRows(plan):ui.volMode==='week'?volumeRows(thisWeek,state.settings.rirMode==='off'?null:thisWeekConf):(avg?`<p class="small muted" style="margin:0 0 6px">Averaged over the ${avg._weeks} week${avg._weeks===1?'':'s'} with training in the last 4. Weeks with no sessions are excluded rather than counted as zero.</p>${volumeRows(avg,state.settings.rirMode==='off'?null:avg._conf)}`:'<p class="muted">No sessions in the previous 4 full weeks.</p>')}</div>`}`,`${wkHard} hard sets this week`);

  // muscles: weak points, then return on volume folded beneath
  const inj=injuredSet();
  const reasons={};const add=(m,t,c)=>{(reasons[m]||(reasons[m]=[])).push([t,c]);};
  for(const m of inj)add(m,'Injured, targets paused','red');
  for(const s of I.scores)if(s.label==='lagging'&&!inj.has(s.m))add(s.m,s.indirect?'Lagging strength (indirect)':'Lagging strength','red');
  // Plan and actual being under band is one fact about one muscle, not two.
  // Counting it twice also pushed it up a sort that ranks by flag count.
  for(const m of MK){
    if(inj.has(m))continue;
    if(TRACK_ONLY.has(m))continue;
    const uPlan=(plan[m]||0)<bands[m][0],uAct=!!avg&&(avg[m]||0)<bands[m][0];
    if(uPlan&&uAct)add(m,'Under band (plan and actual)','yellow');
    else if(uPlan)add(m,'Under band (plan)','yellow');
    else if(uAct)add(m,'Under band (actual)','yellow');
  }
  for(const m of state.settings.priorities)add(m,'Your priority','blue');
  const wp=Object.entries(reasons).sort((a,b)=>b[1].length-a[1].length);
  const weakBody=`<div class="card">${wp.length?wp.map(([m,rs])=>{const [lo,hi]=bands[m];const bits=[`this week ${r1(thisWeek[m]||0)} of ${lo}-${hi} hard sets`];if(avg)bits.push(`recent average ${r1(avg[m]||0)}`);if((plan[m]||0)<lo)bits.push(`routine plans ${r1(plan[m]||0)}`);
      return `<div style="padding:6px 0;border-bottom:1px solid var(--line)"><div class="row spread"><b>${ML[m]}</b><div class="chips">${rs.map(([t,c])=>`<span class="tag ${c}">${t}</span>`).join('')}</div></div><p class="small muted" style="margin:2px 0 0">${bits.join(', ')}</p></div>`;}).join(''):'<p class="muted">Nothing flagged.</p>'}</div>`;

  // stalls (folded inside Lifts)
  let stl='';
  if(stalled.length){
    stl+=stalled.map(([id,s])=>`<div class="row spread" style="padding:6px 0;border-bottom:1px solid var(--line)"><span><span class="plate yellow" style="height:14px;vertical-align:-2px"></span> ${esc(exName(id))}</span><span class="muted small">last ${fmtDate(s.last.date)}</span></div>`).join('');
    if(stalled.length>=3)stl+=`<p class="small hastip" style="color:var(--red);margin-top:8px" data-tip="Several lifts flat together often points to fatigue. Check sleep, food and stress; Deload week is under More options on Today (half the sets, about 90% loads, kept out of your trends).">${stalled.length} stalled at once: likely fatigue</p>`;
  }else stl+='<p class="muted">No stalls detected.</p>';
  const lw=lastLighterWeek();
  if(lw)stl+=`<p class="small muted" style="margin-top:8px">${lw.weeks==null?`No lighter week in the last 12 (usual ${lw.norm} hard sets a week).`:`Last lighter week: ${lw.weeks} week${lw.weeks===1?'':'s'} ago (${lw.sets>0?`${lw.sets} hard sets against your usual ${lw.norm}`:'a week off'}).`}</p>`;

  // exercise trend
  const withData=Object.keys(I.byEx).filter(id=>I.byEx[id].length).sort((a,b)=>exName(a).localeCompare(exName(b)));
  if(!ui.dashEx||!I.byEx[ui.dashEx])ui.dashEx=withData[0]||null;
  let exh='<div class="card">';
  if(ui.dashEx){
    const st=I.exStats[ui.dashEx];const ex=EX(ui.dashEx);const exps=I.byEx[ui.dashEx];
    exh+=`<select data-bind="dashEx" aria-label="Exercise">${withData.map(id=>`<option value="${id}" ${id===ui.dashEx?'selected':''}>${esc(exName(id))}</option>`).join('')}</select>
    <div style="margin-top:8px">${exHeadline(ui.dashEx)}</div>${noE1(ex)?`<div class="kpis" style="margin-top:8px"><div class="kpi"><div class="v">${st.n}</div><div class="l">Sessions logged</div></div><div class="kpi"><div class="v">${st.stalled?'Yes':'No'}</div><div class="l">Stalled</div></div></div>`:''}<div class="kpis" style="margin-top:8px${noE1(ex)?';display:none':''}"><div class="kpi"><div class="v">${st.best?(ex.bw?'≈':'')+fmtW(st.best):'n/a'}</div><div class="l">Best e1RM (${U()}${loadNote(ex)})</div></div><div class="kpi"><div class="v">${st.pct==null?'n/a':(st.pct>=0?'+':'')+r1(st.pct)+'%'}</div><div class="l">Change over 6 weeks</div></div><div class="kpi"><div class="v">${st.slope==null?'n/a':(st.slope>=0?'+':'')+r1(st.slope)+'%'}</div><div class="l">Fitted trend per week</div></div><div class="kpi"><div class="v">${st.n}</div><div class="l">Sessions logged</div></div></div>
    ${st.pct!=null&&st.slope!=null&&(st.pct>0)!==(st.slope>0)&&Math.abs(st.pct)>0.5&&Math.abs(st.slope)>0.1?`<p class="small muted hastip" style="margin-top:6px" data-tip="The change compares the endpoints; the trend fits a line through every session. When they split, trust the trend: one unusual session is pulling an endpoint.">Change and trend disagree</p>`:''}
    ${noE1(ex)?'':`${rangeChips('ex',weeksSpan(exps[0].date),8,'all')}<div class="chartbox"><canvas id="chEx"></canvas></div>${chartFallback()}
    <p class="small muted hastip" style="margin:4px 0 0" data-tip="Filled diamond: a new best estimate. Hollow diamond: a rep PR, more reps at a load than ever before, which can sit below an earlier best. The dashed line to the right appears only when the trend is clearly up, with a range, 4 weeks out. The thin dotted line is your RIR at the top load.">Reading the chart</p>`}
    ${st.easier?`<p class="small" style="color:var(--blue);margin-top:6px"><b>${esc(easierText(ex,st.easier))}</b></p>`:''}
    ${st.fade?`<p class="small" style="color:var(--yellow);margin-top:6px"><b>Set-to-set drop-off is widening at ${esc(loadLabel(ex,st.fade.w))}${ex.bw?'':' '+U()}: ${st.fade.from} → ${st.fade.to} reps lost from first set to last across your last three sessions.</b> That usually means fatigue or shorter rest rather than lost strength.</p>`:''}
    ${ex.bw&&!state.bodyweights.length?'<p class="small" style="color:var(--yellow)">Log your bodyweight on the Today tab so this bodyweight exercise can be trended.</p>':bwBackfillNote(ui.dashEx)}
    <div class="scroll-x"><table class="t" style="margin-top:8px"><tr><th>Date</th><th>Sets</th><th class="r">e1RM</th></tr>${exps.slice(-8).reverse().map(x=>`<tr><td>${fmtDate(x.date)}${x.progress?' <span class="tag green">PR</span>':''}</td><td>${x.pts.map(p=>setShort(ex,p.w,p.r)).join(', ')}</td><td class="r num">${x.best?(ex.bw?'≈':'')+fmtW(x.best):''}</td></tr>`).join('')}</table></div>`;
  }else exh+='<p class="muted">Log a session to see exercise trends.</p>';
  exh+='</div>';
  const bestsBody=bestsBoard();
  const prBody=I.prs.length?I.prs.slice(0,15).map(p=>{const ex=EX(p.exId);return `<div class="row spread" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(ex.name)} <span class="tag ${p.type==='e1RM'?'green':'blue'}">${ex.timed&&p.type==='Rep PR'?'Time PR':p.type}</span></span><span class="num">${p.type==='e1RM'?fmtW(p.value)+' '+U():setShort(ex,p.w,p.r)} <span class="muted small">${fmtDate(p.date)}</span></span></div>`;}).join(''):'<p class="muted">No PRs yet. Your first session of an exercise sets the baseline.</p>';
  h+=dsec('exercise','Lifts',`Estimated 1RM works on reps to failure (reps plus RIR; a blank RIR counts as 0, so it errs low): Brzycki up to 10, Epley for 11 and 12, nothing past 12, and a set called at more than 4 RIR is left out. It is in the same frame you log in, so per dumbbell or per side where that applies. Bodyweight lifts add the share of your bodyweight they move (≈): all of it for pull-ups and dips, 64% for push-ups. Leg raises, crunches, Nordics and similar lifts that turn about a joint get no estimate; their progress is reps and load. A lift is moving or falling only past 3% over 6 weeks with a clear trend, since estimates swing 2 to 8% day to day. Stalled: the trend over your last 6 sessions, or the last 3 weeks if that covers more, is flat or down (at least 4 sessions), leaving out deload, lighter and trimmed sessions. An e1RM PR beats your best from the same band of reps to failure (1-5, 6-10, 11-12); a rep PR is a set no earlier set matched on both load and reps. Reps to failure include RIR, so changing a set's RIR later can add or remove an e1RM PR.`,
    exh+sub('stalls','Stalls',stl,stalled.length?`<span class="pill ${stalled.length>=3?'red':'yellow'}">${stalled.length} stalled</span>`:'none')+sub('prs','Recent PRs',prBody,`${pr14} in 14 days`)+sub('bests','All-time bests',bestsBody.html,bestsBody.n?`${bestsBody.n} lifts`:'none yet'),`${Object.keys(I.byEx).length} lifts tracked`);

  // consistency heat map
  // Starts at your first logged week; weeks ahead fill a young log.
  const hFirst=firstDate(state.sessions);const hWin=weekWindow(hFirst,'heat',12);const hN=weeksSpan(hFirst);
  let heat=`<div class="card">${rangeChips('heat',hN,12)}<div class="heat-h">${DAYS.map(d=>`<span>${d[0]}</span>`).join('')}</div><div class="heat">`;
  const t=today();
  if(!hWin.length)heat+='</div><p class="small muted" style="margin:6px 0 0">Your first logged session starts this grid.</p><div>';
  for(const w of hWin)for(let i=0;i<7;i++){const d=addDays(w.wk,i);heat+=`<div class="${sessDates.has(d)?'on':''} ${d>t?'fut':''} ${d===t?'today':''}" data-tip="${fmtDateLong(d)}${sessDates.has(d)?': lifted':''}"></div>`;}
