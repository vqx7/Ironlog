    o.scales.x.ticks={...o.scales.x.ticks,autoSkip:win.length>8,maxTicksLimit:win.length>8?7:undefined,font:{size:10},color:c=>{const w=win[c.tick?c.tick.value:c.index];return w&&w.fut?faded:ink;}};
    return win.map(w=>w.wk===cur?'This wk':fmtDate(w.wk));
  };
  // muscle weekly
  {const win=weekWindow(sFirst,'muscle',8);
  if(win.length){
  const confV=[],assumV=[];
  for(const w of win){
    if(w.fut){confV.push(null);assumV.push(null);continue;}
    const tot=(I.weekSets[w.wk]||{})[ui.dashMuscle]||0;
    const c=Math.min((I.weekConf[w.wk]||{})[ui.dashMuscle]||0,tot);
    confV.push(r1(c));assumV.push(r1(tot-c));
  }
  const [lo,hi]=state.settings.bands[ui.dashMuscle];
  // The band lines sit on a second, hidden axis so that turning on stacking
  // for the bars cannot stack them on top of each other. Both axes are pinned
  // to the same explicit range so the lines land where they should.
  const yMax=Math.ceil(Math.max(hi+2,...confV.map((v,i)=>(v||0)+(assumV[i]||0)))*1.1/5)*5;
  const mOpts=baseOpts();
  mOpts.scales.x.stacked=true;mOpts.scales.y.stacked=true;
  mOpts.scales.y.min=0;mOpts.scales.y.max=yMax;
  mOpts.scales.y1={display:false,stacked:false,min:0,max:yMax,position:'right',grid:{drawOnChartArea:false}};
  mOpts.plugins.legend.labels.filter=it=>it.text!=='_bandLo';
  mOpts.plugins.tooltip={filter:it=>!win[it.dataIndex].fut||it.datasetIndex>1,callbacks:{title:its=>{const w=win[its[0].dataIndex];return w?`Week of ${fmtDate(w.wk)}${w.fut?' (ahead)':''}`:'';}}};
  const labels=weekAxis(win,mOpts);
  mkChart('chMuscle',{type:'bar',data:{labels,datasets:[
    {label:state.settings.rirMode==='off'?'Hard sets':'RIR logged',data:confV,backgroundColor:blue,yAxisID:'y'},
    {label:'Assumed hard',data:assumV,backgroundColor:blue+'55',yAxisID:'y'},
    {type:'line',label:'_bandLo',data:labels.map(()=>lo),borderColor:green+'aa',borderWidth:1,borderDash:[3,3],pointRadius:0,yAxisID:'y1',fill:false},
    {type:'line',label:`Target ${lo} to ${hi}`,data:labels.map(()=>hi),borderColor:green+'aa',borderWidth:1,borderDash:[3,3],backgroundColor:green+'22',pointRadius:0,yAxisID:'y1',fill:'-1'}
  ]},options:mOpts});
  }}
  // balance radar, built from the same source the table on screen uses
  const bal=actualAvg4()||(I.weekSets[cur]||{});
  const regs=regionBalance(bal);
  const rMax=Math.max(150,Math.ceil(Math.max(...regs.map(x=>x.pct))/50)*50);
  mkChart('chRadar',{type:'radar',data:{labels:regs.map(x=>x.label),datasets:[
    {label:'Your volume',data:regs.map(x=>Math.round(x.pct)),borderColor:blue,backgroundColor:blue+'33',pointBackgroundColor:blue,pointRadius:3,borderWidth:2},
    {label:'Target (100%)',data:regs.map(()=>100),borderColor:green,borderDash:[5,4],pointRadius:0,borderWidth:2,fill:false}
  ]},options:radarOpts(rMax)});

  if(ui.dashEx&&I.byEx[ui.dashEx]&&I.byEx[ui.dashEx].some(x=>x.best!=null)){
    const exps=I.byEx[ui.dashEx].filter(x=>x.best!=null);
    // Real dates on the x axis, counted in days from the first session.
    const base=exps[0].date;const xs=exps.map(x=>daysBetween(base,x.date));const lastX=xs[xs.length-1];
    const vals=exps.map(x=>r1(toD(x.best)));const isPR=exps.map(x=>!!x.progress);
    // A rep PR can land below an earlier best estimate, which read as a mistake
    // when every PR looked the same. New-best sessions are filled, rep PRs hollow.
    const prType=exps.map(x=>{if(!x.progress)return null;const p=I.prs.find(q=>q.exId===ui.dashEx&&q.date===x.date);return p?p.type:'Rep PR';});
    const surf=cssv('--surface');
    const pj=exProjection(ui.dashEx);
    // Monotone interpolation: a smoothed curve must never draw a value above or
    // below what was actually logged between two sessions.
    const ds=[{label:`Best e1RM (${U()})`,data:vals.map((v,i)=>({x:xs[i],y:v})),borderColor:blue,backgroundColor:blue+'1f',fill:'start',cubicInterpolationMode:'monotone',yAxisID:'y',
      pointRadius:isPR.map(x=>x?5.5:2.5),pointStyle:isPR.map(x=>x?'rectRot':'circle'),pointBorderWidth:isPR.map(x=>x?2:1),
      pointBackgroundColor:prType.map(t=>t==='e1RM'?green:t?surf:blue),pointBorderColor:isPR.map(x=>x?green:blue)}];
    let pjIdx=-1;
    if(pj){
      pjIdx=ds.length;
      ds.push({label:'If the trend holds',data:[{x:lastX,y:vals[vals.length-1]},{x:lastX+28,y:r1(toD(pj.value))}],borderColor:blue,borderDash:[4,4],borderWidth:2,
        pointRadius:[0,3.5],pointBackgroundColor:cssv('--surface'),pointBorderColor:blue,fill:false,yAxisID:'y'});
    }
    const eo=baseOpts();
    const win=dayWindow(base,lastX,'ex',42,'all',pj?lastX+28:null);
    eo.scales.x={...eo.scales.x,...dayAxis(base,win),ticks:{...eo.scales.x.ticks,...dayAxis(base,win).ticks}};
    eo.interaction={mode:'nearest',axis:'x',intersect:false};
    eo.plugins.tooltip={filter:it=>!(it.datasetIndex===pjIdx&&it.dataIndex===0),callbacks:{
      title:its=>its.length?(its[0].datasetIndex===pjIdx?`In 4 weeks, around ${fmtDate(addDays(base,Math.round(its[0].parsed.x)))}`:fmtDateLong(addDays(base,Math.round(its[0].parsed.x)))):'',
      afterLabel:it=>it.datasetIndex===0&&prType[it.dataIndex]?(prType[it.dataIndex]==='e1RM'?'New best estimate':'Rep PR: more reps at a load than ever before'):''}};
    if(exps.some(x=>x.topRir!=null)){
      ds.push({label:'RIR at top load',data:exps.map((x,i)=>({x:xs[i],y:x.topRir==null?null:r1(x.topRir)})),borderColor:yellow,backgroundColor:yellow,borderDash:[2,3],borderWidth:1.5,pointRadius:2,spanGaps:true,fill:false,yAxisID:'y1'});
      eo.scales.y1={position:'right',min:0,max:5,ticks:{color:cssv('--muted'),stepSize:1},grid:{drawOnChartArea:false},border:{display:false},title:{display:true,text:'RIR',color:cssv('--muted')}};
    }
    mkChart('chEx',{type:'line',data:{datasets:ds},options:eo});
  }
  /* One bar per week, split by the session it came from. Session-by-session
     bars alternated chest days with leg days, which are not comparable; weeks
     are. The unfinished current week is labelled as such. */
  {
    const win=weekWindow(sFirst,'vol',8);const wks=win.map(w=>w.wk);
    if(win.length){
    const base=n=>String(n||'Session').replace(/ \((lighter|deload)\)$/,'');
    const types=[];const byT={};
    for(const x of I.sessVol){const wk=weekStart(x.date);const i=wks.indexOf(wk);if(i<0)continue;const t=base(x.day);
      if(!byT[t]){byT[t]=wks.map((_,j)=>win[j].fut?null:0);types.push(t);}byT[t][i]+=x.vol;}
    const pal=[blue,green,yellow,cssv('--red'),'#8b5cf6','#14b8a6','#f97316',muted];
    const vo=baseOpts();vo.scales.x.stacked=true;vo.scales.y.stacked=true;
    const labels=weekAxis(win,vo);
    vo.plugins.tooltip={filter:it=>it.raw!=null,callbacks:{title:its=>its.length?`Week of ${fmtDate(wks[its[0].dataIndex])}`:'',label:it=>`${it.dataset.label}: ${Math.round(it.raw).toLocaleString()} ${U()}`,
      footer:its=>{if(!its.length)return '';const i=its[0].dataIndex;const tot=types.reduce((a,t)=>a+toD(byT[t][i]||0),0);return `Week total: ${Math.round(tot).toLocaleString()} ${U()}`;}}};
    mkChart('chVol',{type:'bar',data:{labels,
      datasets:types.map((t,i)=>({label:t,data:byT[t].map(v=>v==null?null:Math.round(toD(v))),backgroundColor:pal[i%pal.length]+(i<pal.length?'':'99'),borderRadius:2,stack:'v'}))},options:vo});
    }
  }
  const bw=[...state.bodyweights].sort((a,b)=>a.date<b.date?-1:1);
  if(bw.length){
    const avg=bw.map(b=>{const from=addDays(b.date,-6);const w=bw.filter(x=>x.date>=from&&x.date<=b.date);return r1(toD(w.reduce((a,x)=>a+x.kg,0)/w.length));});
    const base=bw[0].date;const xs=bw.map(b=>daysBetween(base,b.date));
    const win=dayWindow(base,xs[xs.length-1],'bw',28,'all');const ax=dayAxis(base,win);
    const bo=baseOpts();bo.scales.x={...bo.scales.x,...ax,ticks:{...bo.scales.x.ticks,...ax.ticks}};
    bo.interaction={mode:'nearest',axis:'x',intersect:false};
    bo.plugins.tooltip={callbacks:{title:its=>its.length?fmtDateLong(addDays(base,Math.round(its[0].parsed.x))):''}};
    mkChart('chBW',{type:'line',data:{datasets:[{label:`Bodyweight (${U()})`,data:bw.map((b,i)=>({x:xs[i],y:r1(toD(b.kg))})),borderColor:muted,backgroundColor:muted,pointRadius:2,showLine:false},{label:'7-day average',data:avg.map((v,i)=>({x:xs[i],y:v})),borderColor:blue,pointRadius:0,tension:.3,borderWidth:2}]},options:bo});
  }
}

/* ---------- HISTORY ---------- */
function viewHistory(){
  const ss=[...state.sessions].sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
  const I=IDX();
  const real=ss.filter(x=>!x.demo).length;
  let h=pageHead('Every session, newest first','History',`${ss.length} session${ss.length===1?'':'s'}${ss.length&&real!==ss.length?` (${ss.length-real} demo)`:''}`,'<button class="btn sm" data-act="pastOpen">Log a past workout</button>');
  const cs=[...state.cardio].sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
  if(cs.length)h+=sec({sk:'history:cardio',key:'cardio',title:'Cardio and mobility',sub:`${cs.length} entr${cs.length===1?'y':'ies'}`,body:`<ul class="clist">${cs.slice(0,40).map(c=>`<li><span><b>${esc(CARDIOL[c.kind])}</b> <span class="small muted">${fmtDate(c.date)} · ${c.min} min${c.hr?` · ${c.hr} bpm`:''}${c.when!=='solo'?' · '+CWHENL[c.when].toLowerCase():''}${c.note?' · '+esc(c.note):''}</span></span><button class="ib sm" data-act="cardioDel" data-id="${c.id}" aria-label="Delete ${fmtDate(c.date)} cardio">✕</button></li>`).join('')}</ul>${cs.length>40?`<p class="small muted">${cs.length-40} older entries are in the CSV export.</p>`:''}`});
  const tr=state.trash||[];
  if(tr.length)h+=sec({sk:'history:trash',key:'trash',title:'Recently deleted',sub:`<span class="hastip" data-tip="${esc(`The ${TRASH_MAX} most recent deletions, each kept ${TRASH_DAYS} days`)}">${tr.length}</span>`,body:`<ul class="clist">${tr.map(x=>{const nm=x.kind==='session'?`${x.data.dayName||'Session'}, ${fmtDate(x.data.date)}`:x.kind==='cardio'?`${CARDIOL[x.data.kind]||'Cardio'}, ${fmtDate(x.data.date)}`:`Routine: ${x.data.name||'Routine'}`;return `<li><span>${esc(nm)} <span class="small muted">deleted ${fmtDate(x.date)}</span></span><button class="btn sm" data-act="restore" data-id="${x.id}" data-k="${x.kind}">Restore</button></li>`;}).join('')}</ul>`});
  if(!ss.length)return h+'<div class="card"><p style="margin:0">No sessions yet. Start one on Today, or log one you did without the app with Log a past workout.</p></div>';
  const withData=Object.keys(I.byEx).sort((a,b)=>exName(a).localeCompare(exName(b)));
  if(ui.histEx&&!I.byEx[ui.histEx])ui.histEx='';
  let body=`<label class="field">Show sessions with<select data-bind="histEx"><option value="">Any exercise</option>${withData.map(id=>`<option value="${id}" ${ui.histEx===id?'selected':''}>${esc(exName(id))}</option>`).join('')}</select></label><div style="margin-top:6px">`;
  const shown=ui.histEx?ss.filter(x=>x.ex.some(b=>b.exId===ui.histEx)):ss;
  if(!shown.length)body+='<p class="muted">No sessions with that exercise.</p>';
  // Every session used to be rebuilt into one string on every render. Past a
  // few hundred logs that is a visible stall on a phone for rows nobody has
  // scrolled to yet.
  const page=shown.slice(0,ui.histLimit);
  /* Sessions sit under their week (Monday start), with the week's totals on
     the header, so a light or missed week shows without counting rows. The
     totals cover every session of that week in the current filter, not only
     the rows loaded so far. */
  const wkTot={};
  for(const s of shown){const w=weekStart(s.date);const o=wkTot[w]||(wkTot[w]={n:0,sets:0,vol:0});o.n++;o.sets+=s.ex.reduce((a,b)=>a+b.sets.filter(isWork).length,0);o.vol+=(I.sessVol.find(v=>v.id===s.id)||{}).vol||0;}
  const thisWk=weekStart(today());let lastWk=null;
  for(const s of page){
    const wk=weekStart(s.date);
    if(wk!==lastWk){lastWk=wk;const o=wkTot[wk];const lbl=wk===thisWk?'This week':wk===addDays(thisWk,-7)?'Last week':`Week of ${fmtDate(wk)}`;
      body+=`<div class="hweek"><span class="hw-t">${lbl}</span><span class="hw-s" data-tip="${esc(`${o.n} session${o.n===1?'':'s'}, ${o.sets} working sets, ${Math.round(toD(o.vol)).toLocaleString()} ${U()} lifted`)}">${o.sets} sets · ${fmtK(o.vol)} ${U()}</span></div>`;}
    const nSets=s.ex.reduce((a,b)=>a+b.sets.filter(isWork).length,0);const vol=(I.sessVol.find(v=>v.id===s.id)||{}).vol||0;const open=ui.histOpen===s.id;
    body+=`<div class="hitem${open?' open':''}"><button class="pick" style="border:0;padding:0" data-act="histToggle" data-id="${s.id}" aria-expanded="${open}"><span style="min-width:0"><b>${esc(s.dayName||'Session')}</b>${s.deload?' <span class="tag blue">deload</span>':''}${s.free?' <span class="tag">freestyle</span>':''}${s.ex.some(b=>b.cut)?' <span class="tag">trimmed</span>':''}${s.demo?' <span class="tag">demo</span>':''}<br><span class="small muted">${fmtDateRow(s.date)}</span></span><span class="num small" style="text-align:right;flex:none">${nSets} sets<br><span class="muted">${Math.round(toD(vol)).toLocaleString()} ${U()}${s.durMin?` · ${s.durMin} min`:''}</span></span></button>`;
    if(ui.histEx&&!open){const b=s.ex.find(x=>x.exId===ui.histEx);const ex=EX(ui.histEx);if(b)body+=`<p class="small" style="margin:6px 0 0">${b.sets.map(x=>setStr(ex,x)).join(', ')}${histUnits(ex)}</p>`;}
    if(open){
      body+='<div class="panel" style="margin-top:10px">';
      if(s.chk)body+=`<p class="small muted" style="margin:0 0 6px">Check-in: ${CHK_Q.filter(([k])=>s.chk[k]).map(([k,l,n])=>`${l.toLowerCase()} ${chkWord(n[s.chk[k]-1])}`).join(', ')}</p>`;
      body+=s.ex.map(b=>{const ex=EX(b.exId);return `<p class="small" style="margin:0 0 6px"><b>${esc(ex.name)}</b>: ${b.sets.map(x=>setStr(ex,x)).join(', ')}${histUnits(ex)}${b.note?`<br><span class="muted">${esc(b.note)}</span>`:''}</p>`;}).join('');
      if(s.notes)body+=`<p class="small muted" style="margin:0 0 6px">${esc(s.notes)}</p>`;
      body+=`<div class="row" style="margin-top:8px"><button class="btn sm" data-act="histEdit" data-id="${s.id}">Edit</button><button class="btn sm" data-act="histRepeat" data-id="${s.id}" data-tip="Start a new session today with these exercises">Do again</button><button class="btn sm danger" data-act="histDel" data-id="${s.id}">Delete</button></div></div>`;
    }
    body+='</div>';
  }
  body+='</div>';
  if(shown.length>page.length)body+=`<button class="btn block" style="margin-top:10px" data-act="histMore">Show ${Math.min(HIST_PAGE,shown.length-page.length)} more (${page.length} of ${shown.length})</button>`;
  h+=sec({sk:'history:sessions',key:'sessions',title:'Sessions',sub:ui.histEx?`${shown.length} with ${esc(exName(ui.histEx))}`:`${ss.length} logged`,body,def:true});
  return h;
}

function rirSettings(){
  const s=state.settings;const c=calStats();
  const sum=!c.n?'No calibration sets yet: an exercise\'s ⋯ menu in a session, on a machine or cable lift.'
    :!c.recent?`${c.n} calibration set${c.n===1?'':'s'}, none in the last ${CAL_WEEKS} weeks.`
    :`${c.recent} recent calibration set${c.recent===1?'':'s'}: median miss ${c.raw>0?'+':''}${r1(c.raw)} reps (${c.raw>0?'you stop with more left than you call':c.raw<0?'closer to failure than you call':'accurate'}). Correction applied: ${c.bias>0?'+':''}${c.bias}.`;
  return `<label class="field">Reps in reserve<select data-bind="rirMode">
    <option value="on" ${s.rirMode==='on'?'selected':''}>On: log RIR and use it as logged</option>
    <option value="cal" ${s.rirMode==='cal'?'selected':''}>On, corrected by my calibration sets</option>
    <option value="off" ${s.rirMode==='off'?'selected':''}>Off: don't ask, count every working set as hard</option></select></label>
  ${s.rirMode==='off'?'':`<label class="check-inline"><input type="checkbox" data-bind="rirAsk" ${s.rirAsk===true?'checked':''}><span class="hastip" data-tip="Off: tap a set's RIR box when you want to rate it. On: the 0 to 5 picker opens by itself after each set you tick.">Open the RIR picker after each set</span></label>
  <p class="small muted hastip" style="margin:0" data-tip="A blank RIR is read as your usual RIR on that lift: the middle value of the sets of it you rated in the last 12 weeks, once there are 3. That is a convention, so rating a set only sometimes cannot make it look stronger or weaker. Until there are 3, a blank set counts as hard and as 0 reps left for 1RM estimates, which errs low and never inflates a PR. Recovery, calibration and the light-load check use only the RIR you entered.">Skipping RIR on some sets is fine.</p>`}
  ${s.rirMode==='cal'&&c.recent<2?'<p class="small" style="margin:0"><b>Needs 2 calibration sets from the last 12 weeks before any correction applies.</b></p>':''}
  <p class="small hastip" style="margin:0" data-tip="Off hides the RIR picker: every working set counts as hard and estimates use reps alone. Corrected shifts RIR you called at 4 or less by your typical error, shrunk toward zero while you have few calibration sets and capped at 2 reps; compound and isolation lifts use their own sets once each has 2. A set called at 0 is shifted too: unless a rep actually failed, 0 is still a call, and people under-call reps left by about 1 on average, only slightly less near failure (Halperin 2022). Your log never changes, so switching is reversible.">${esc(sum)}</p>`;
}

/* ---------- modal rendering ---------- */
/* Re-rendering a sheet used to rebuild it from the top: a tap on a muscle chip
   halfway down the exercise editor threw the sheet back to its first line and
   dropped the cursor. When the same sheet is redrawn, its scroll positions and
   the focused field (with the caret) are put back. */
function renderModal(){
  const el=$('#modal');const m=ui.modal;
  const same=!!m&&renderModal.last===m&&!el.hidden;
  const old=same?el.querySelector('.sheet'):null,oldIn=same?el.querySelector('.sheet-scroll'):null;
  const st=old?old.scrollTop:0,ist=oldIn?oldIn.scrollTop:0;
  const ae=document.activeElement;const fk=same&&ae&&el.contains(ae)?focusKey(ae):null;
  const ss=fk&&typeof ae.selectionStart==='number'?ae.selectionStart:null,se=fk&&typeof ae.selectionEnd==='number'?ae.selectionEnd:null;
  renderModalBody();
  if(el.hidden||!ui.modal){document.body.classList.remove('modal-open');renderModal.last=null;return;}
  document.body.classList.add('modal-open');renderModal.last=ui.modal;
  if(!same)return;
  const sh=el.querySelector('.sheet'),inn=el.querySelector('.sheet-scroll');
  if(sh)sh.scrollTop=st;if(inn)inn.scrollTop=ist;
  if(fk){let n=null;try{n=el.querySelector(fk);}catch(e){/* stale selector */}
    if(n&&typeof n.focus==='function')try{n.focus({preventScroll:true});if(ss!=null&&typeof n.setSelectionRange==='function')n.setSelectionRange(ss,se);}catch(e){/* caret restore is best effort */}}
}

/* One place that applies a choice from the exercise picker, or an exercise
   just created from it, for every mode the picker opens in. Adding to a
   session scrolls to the new exercise and marks it, instead of leaving it
   somewhere below the fold. */
function applyPick(m,id){
  if(!m||!id)return;
  if(m.mode==='addDay'){const R=curRoutineB();const d=R.days[m.day];closeModal();if(!d){rerenderKeepScroll();return;}d.items.push(newItem(id));if(d.rest)d.rest=false;commit();rerenderKeepScroll();toast(`${exName(id)} added to ${dayLabel(R,m.day)}`);return;}
  if(m.mode==='swapItem'){const f=findItem(m.uid);if(f){f.it.exId=id;commit();}closeModal();rerenderKeepScroll();return;}
  const d=state.draft;closeModal();if(!d){rerenderKeepScroll();return;}
  const half=p=>(d.deload||d.light)?{...p,sets:Math.max(1,Math.ceil(p.sets/2))}:p;
  if(m.mode==='addBlock'){d.ex.push(newBlock(id,half(planFor(id)),{deload:!!d.deload,before:d.date}));saveNow();afterAdd(d.ex.length-1);return;}
  /* Swapping used to replace the whole block, so sets already logged on the
     old exercise vanished. Now logged sets stay with the exercise they were
     done on, and the new one takes over the sets still to do. */
  if(m.mode==='swapBlock'){const b=d.ex[m.b];if(!b){rerenderKeepScroll();return;}
    const orig=JSON.parse(JSON.stringify(b));const bi=m.b,did=d.id;
    const done=b.sets.filter(x=>x.done);const left=b.sets.filter(x=>!x.done&&!x.warm&&!x.drop).length;
    const nb=newBlock(id,{...b.plan,sets:done.length?Math.max(1,left):b.plan.sets},{deload:!!d.deload,before:d.date});nb.swappedFrom=b.swappedFrom||b.exId;if(nb.swappedFrom===id)nb.swappedFrom=null;
    snapshot(()=>{const dd=state.draft;if(!dd||dd.id!==did)return false;
      const at=dd.ex.findIndex(x=>x===nb);if(at<0||nb.sets.some(x=>x.done))return false;
      if(done.length){dd.ex.splice(at,1);const i=dd.ex.findIndex(x=>x===b);if(i>=0)dd.ex[i]=orig;else return false;}else dd.ex[at]=orig;
      return true;});
    if(done.length){b.sets=done;b.plan={...b.plan,sets:done.filter(x=>!x.warm&&!x.drop).length||1};d.ex.splice(bi+1,0,nb);}
    else d.ex[bi]=nb;
    fixSupersets(d.ex.map(x=>x.plan));saveNow();rerenderKeepScroll();
    toast(done.length?`${EX(id).name} added for the sets left. Logged sets stay with ${EX(orig.exId).name}.`:`Swapped to ${EX(id).name}`,true);return;}
  rerenderKeepScroll();
}
function afterAdd(bi){
  rerenderKeepScroll();
  const el=document.getElementById('blk-'+bi);if(!el)return;
  let calm=false;try{calm=window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){/* no media queries */}
  try{el.scrollIntoView({block:'start',behavior:calm?'auto':'smooth'});}catch(e){el.scrollIntoView();}
  el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');
}

/* Routine housekeeping. Empty: no exercise on any day. Duplicate: same name
   and same days and exercises as an earlier routine. Only routines that are
   not active and have no logged sessions are offered for cleanup; logged
   sessions are kept either way. */
const routineEmpty=r=>r.days.every(d=>!d.items.length);
const routineSig=r=>JSON.stringify([r.name.trim().toLowerCase(),r.schedule,r.days.map(d=>[d.name,!!d.rest,d.items.map(i=>[i.exId,+i.sets,+i.repMin,+i.repMax,+i.rir,+i.rest])])]);
function routineClutter(){
  const used=new Set(state.sessions.map(x=>x.routineId));const seen=new Set();const out=[];
  for(const r of state.routines){
    const sig=routineSig(r);const dup=seen.has(sig);seen.add(sig);
    if(r.id===state.activeRoutineId||used.has(r.id))continue;
    if(routineEmpty(r)||dup)out.push(r);
  }
  return out;
}
const nameTaken=(nm,exceptId)=>state.routines.some(r=>r.id!==exceptId&&r.name.trim().toLowerCase()===nm.trim().toLowerCase());
function curRoutineB(){return state.routines.find(r=>r.id===ui.bRoutine)||activeRoutine();}
function findItem(uidv){for(const r of state.routines)for(let di=0;di<r.days.length;di++){const i=r.days[di].items.findIndex(x=>x.uid===uidv);if(i>=0)return {r,di,i,it:r.days[di].items[i]};}return null;}
function newItem(exId){return {uid:uid(),exId,...defPlan(exId)};}
/* Toggle the link between entry i and i+1. get(x) returns the object holding ss. */
function linkToggle(arr,i,get){
  const a=get(arr[i]),b=arr[i+1]&&get(arr[i+1]);if(!a||!b)return false;
  if(a.ss&&a.ss===b.ss){const g=uid(),old=a.ss;for(let k=i+1;k<arr.length&&get(arr[k]).ss===old;k++)get(arr[k]).ss=g;}
  else{const id=a.ss||b.ss||uid();const olds=[a.ss,b.ss].filter(Boolean);for(const x of arr){const o=get(x);if(o.ss&&olds.includes(o.ss))o.ss=id;}a.ss=id;b.ss=id;}
  const tmp=arr.map(get);fixSupersets(tmp);return true;
}
function move(arr,i,j){if(j<0||j>=arr.length)return;const [x]=arr.splice(i,1);arr.splice(j,0,x);}
/* Null when the row is gone. Rebuilding the view removes a still-focused reps
   field, and the browser then fires its pending change for a set that − Set,
   Swap or Undo has just removed. */
function draftSet(t){const b=state.draft&&state.draft.ex[+t.dataset.b];return b&&b.sets[+t.dataset.s]||null;}
/* Exercises added or swapped in a session, relative to the routine day it was
   logged against, so Finish can offer to make the change permanent. */
function routineUpdates(d){
  const R=state.routines.find(r=>r.id===d.routineId);if(!R)return null;
  const day=R.days.find(x=>x.id===d.dayId);if(!day)return null;
  const have=new Set(day.items.map(i=>i.exId));const add=[],swap=[];const seen=new Set();
  for(const b of d.ex){
    if(have.has(b.exId)||seen.has(b.exId)||!b.sets.some(s=>s.done&&!s.warm))continue;seen.add(b.exId);
    // Limited-equipment swaps are for that session only.
    if(d.limited&&b.swappedFrom)continue;
    if(b.swappedFrom&&have.has(b.swappedFrom))swap.push({from:b.swappedFrom,to:b.exId});
    else{const {ss:_s,...p}=b.plan;add.push({exId:b.exId,plan:{...p,sets:Math.max(1,+p.sets||3)}});}
  }
  if(!add.length&&!swap.length)return null;
  const bits=[...swap.map(x=>`${exName(x.from)} → ${exName(x.to)}`),...add.map(x=>`add ${exName(x.exId)}`)];
  return {rid:R.id,dayId:day.id,dayName:day.name,add,swap,text:bits.join(', ')};
}
function toTrash(kind,data){
  state.trash=[{id:data.id,kind,date:today(),data:JSON.parse(JSON.stringify(data))},...(state.trash||[]).filter(t=>!(t.id===data.id&&t.kind===kind))].slice(0,TRASH_MAX);
  while(state.trash.length>1&&JSON.stringify(state.trash).length>TRASH_BYTES)state.trash.pop();
}

/* Everything in this app lives in one browser, so "did the backup actually
   land" is the single question that matters. The downloads capability confirms
   the save, so that path marks the export itself. The anchor fallback confirms
   nothing: it can be blocked silently by a sandboxed frame, and the old code
   still cleared the "Backup due" nag. So that path asks. */
async function exportFile(data,filename,mime,okMsg,onSaved,fallbackTitle,fallbackHelp){
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      const dl=await window.claude.use('downloads');
      if(dl){try{await dl.save({filename,data});onSaved&&onSaved();toast(okMsg);return;}catch(e){if(e&&e.code==='declined'){toast('Save cancelled');return;}log('export',e);}}
    }
  }catch(e){log('export',e);}
  /* The installed app on a phone: the share sheet is how a file reaches Files
     or iCloud Drive (a download link inside a home-screen app on iOS opens a
     preview with nowhere to save). A completed share is taken as saved. */
  try{
    const file=typeof File==='function'?new File([data],filename,{type:mime}):null;
    if(file&&isStandalone()&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:filename});onSaved&&onSaved();toast(okMsg);return;}
      catch(e){if(e&&e.name==='AbortError'){toast('Save cancelled');return;}log('export',e);}
    }
  }catch(e){log('export',e);}
  let clicked=false;
  try{
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
    clicked=true;
  }catch(e){log('export',e);}
  if(!clicked){openModal({kind:'text',title:fallbackTitle,help:fallbackHelp,text:data,readonly:true});return;}
  confirmBox('Did the file download?',
    `Look for ${filename}. If nothing appeared, this browser blocked the download and you should copy the text instead.`,
    'Yes, I have the file',()=>{onSaved&&onSaved();toast('Backup recorded');},false,
    {label:'Show the text instead',fn:()=>openModal({kind:'text',title:fallbackTitle,help:fallbackHelp,text:data,readonly:true})});
}
function exportBackup(){
  const data=JSON.stringify({app:'ironlog',version:APP_VERSION,exported:new Date().toISOString(),state},null,1);
  return exportFile(data,`ironlog-backup-${today()}.json`,'application/json','Backup saved',markExported,
    'Backup text','Copy all of this and keep it somewhere safe. Paste it into Import on any device to restore.');
}
/* One row per set, in display units, for anyone who wants this in a spreadsheet.
   This is not a backup: it cannot be imported, and it carries no routines or
   settings. The JSON export remains the thing that restores the app. */
function exportCSV(){
  const q=v=>{const s=String(v==null?'':v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const rows=[['date','day','deload','exercise','primary','set','warmup','dropset','per_side','load_entry',`load_${U()}`,`total_load_${U()}`,'reps','rir',`e1rm_${U()}`,'exercise_note','session_note','session_minutes','avg_hr','unit','calibration']];
  for(const ss of sortedSessions()){
    for(const b of ss.ex){
      const ex=EX(b.exId);
      b.sets.forEach((s,i)=>{
        const total=loadOf(ex,s,ss.date);const est=s.warm||s.drop||noE1(ex)?null:e1(total,+s.r,rirEst(s,ex));
        rows.push([ss.date,ss.dayName,ss.deload?'yes':'no',ex.name,ML[ex.primary]||ex.primary,i+1,s.warm?'yes':'no',s.drop?'yes':'no',ex.perSide?'yes':'no',loadWords(ex),
          fmtW(+s.w||0),fmtW(total),s.r,(s.rir==null||s.rir==='')?'':s.rir,est==null?'':fmtW(est),b.note||'',ss.notes||'',ss.durMin||'','',ex.timed?'seconds':'reps',s.cal?`stop at ${s.cal.at}, called ${s.cal.pred} left`:'']);
      });
    }
  }
  for(const c of [...state.cardio].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0))
    rows.push([c.date,'Cardio','no',CARDIOL[c.kind],'',1,'no','no','no','','','','','','',[CWHENL[c.when],c.note].filter(Boolean).join('; '),c.min,c.hr==null?'':c.hr,'minutes','']);
  if(rows.length===1){toast('No sessions to export');return;}
  const data=rows.map(r=>r.map(q).join(',')).join('\r\n');
  return exportFile(data,`ironlog-sets-${today()}.csv`,'text/csv','CSV saved',null,
    'CSV text','Copy all of this and paste it into a spreadsheet. This is not a backup.');
}
function importData(text){
  let obj;try{obj=JSON.parse(text);}catch(e){toast('That is not valid backup text');return;}
  const s=obj&&obj.state?obj.state:obj;
  if(!s||typeof s!=='object'||!Array.isArray(s.exercises)||!Array.isArray(s.routines)||!Array.isArray(s.sessions)){toast('That file is not an Ironlog backup');return;}
  // Validate first and report honestly, rather than importing something that
  // renders once and then throws.
  let clean;try{clean=normalize(s);}catch(e){toast('That backup could not be read');return;}
  const dropped=normalize.dropped;
  if(!clean.sessions.length&&s.sessions.length){toast('No readable sessions in that backup');return;}
  const body=`This backup has ${clean.sessions.length} session${clean.sessions.length===1?'':'s'} and ${clean.routines.length} routine${clean.routines.length===1?'':'s'}.`
    +(dropped?` ${dropped} damaged record${dropped===1?' was':'s were'} skipped.`:'')
    +' It will replace everything currently in the app. You can step this back with Undo.';
  confirmBox('Replace all data?',body,'Replace my data',()=>{snapshot();state=clean;commit();closeModal();ui.tab='today';render();toast('Backup imported',true);},true);
}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function makeDemo(){
  state.sessions=state.sessions.filter(s=>!s.demo);state.bodyweights=state.bodyweights.filter(b=>!b.demo);state.measurements=state.measurements.filter(m=>!m.demo);
  const R=activeRoutine();const rnd=mulberry(11);
  const rate={chest:.006,lats:.009,upperBack:.008,traps:.005,lowerBack:.004,frontDelts:.005,sideDelts:0,rearDelts:.007,biceps:.012,triceps:.004,forearms:.006,abs:.007,obliques:.005,neck:.01,quads:.011,hamstrings:.001,glutes:.008,adductors:.008,abductors:.006,calves:.003,tibialis:.01};
  // Dumbbell lifts logged per dumbbell carry per-hand numbers (these were totals before r13 gave dumbbells that meaning).
  const base={bench:275,incBench:245,rackPull:455,sldl:315,hackSquat:405,legPress:720,bss:45,seatedDbPress:65,cableLateral:30,leanAwayLat:35,cableY:25,lowHighFly:60,pecDeck:220,dbPullover:110,kelsoShrug:180,dbShrug:70,reversePecDeck:140,inclineCurl:30,bayesianCurl:45,preacher:110,hammer:35,wristCurl:115,revWristCurl:60,ohCableExt:110,jmPress:185,pressdown:120,woodchop:70,cableCrunch:150,legExt:250,adductor:250,abductor:250,standCalf:350,seatedCalf:220,seatedCurl:180,tibRaise:50,neckCurl:45,neckExt:70,landmineRow:250,cableRow:250,pullup:45,dips:90,hyperext:45};
  const eqBase={barbell:185,dumbbell:60,cable:100,machine:200,smith:185,landmine:180,other:50,bodyweight:0};
  const BW=185;const cur=weekStart(today());const t=today();
  // Weekly routines land on their weekdays; cycles run in order, one cycle day
  // per calendar day, across the same eight weeks.
  const realDates=new Set(state.sessions.map(x=>x.date));
  const realBW=new Set(state.bodyweights.map(x=>x.date)),realMeas=new Set(state.measurements.map(x=>x.date));
  const slots=[];
  if(R.schedule==='weekly'){for(let k=0;k<8;k++){const ws=addDays(cur,-7*(7-k));R.days.forEach((d,di)=>slots.push({k,date:addDays(ws,di),di}));}}
  else{const start=addDays(cur,-49);for(let p=0;;p++){const date=addDays(start,p);if(date>t)break;slots.push({k:Math.floor(p/7),date,di:p%R.days.length});}}
  for(const sl of slots){
    const k=sl.k,date=sl.date,di=sl.di,d=R.days[di];
    (()=>{
      if(d.rest||!d.items.length)return;if(date>t)return;if(rnd()<0.08)return;
      // A demo session on a day with a real one stacked two sessions of the same
      // lift on one date, and the strength chart plunged between them.
      if(realDates.has(date))return;
      const ex=d.items.map(it=>{
        const e=EX(it.exId);const rr=rate[e.primary]||0.005;const b0=base[it.exId]!=null?base[it.exId]:eqBase[e.equip]||60;
        const repMid=it.repMin+(it.repMax-it.repMin)*0.6;const sets=[];
        if(e.bw&&b0===0){
          const top=Math.min(it.repMax+2,Math.round(it.repMin+k*rr*40+rnd()));
          for(let j=0;j<it.sets;j++)sets.push({w:0,r:Math.max(1,top-Math.round(j*0.8+rnd()*0.6)),rir:1,warm:false});
        }else{
          const total=(e.bw?BW+b0:b0)*(1+repMid/30)*(1+rr*k+(rnd()-0.5)*0.03);
          let L=Math.max(5,Math.round((total/(1+repMid/30)-(e.bw?BW:0))/5)*5);
          const eff=(e.bw?BW:0)+L;const r0=Math.max(1,Math.min(30,Math.round(30*(total/eff-1))));
          for(let j=0;j<it.sets;j++)sets.push({w:L*LB,r:Math.max(1,r0-Math.round(j*0.8+rnd()*0.6)),rir:1,warm:false});
        }
        return {exId:it.exId,sets};
      });
      state.sessions.push({id:uid(),date,dayIdx:di,dayId:d.id,dayName:d.name,routineId:R.id,ex,notes:'',demo:true});
    })();
  }
  for(let i=56;i>=0;i-=2){const date=addDays(t,-i);if(realBW.has(date))continue;state.bodyweights.push({id:uid(),date,kg:(BW-1+(56-i)*0.03+(rnd()-0.5)*1.6)*LB,demo:true});}
  if(!realMeas.has(addDays(t,-56)))state.measurements.push({id:uid(),date:addDays(t,-56),arm:16.0*IN,forearm:13.1*IN,chest:44.0*IN,waist:33.5*IN,thigh:24.0*IN,calf:15.0*IN,neck:16.0*IN,demo:true});
  if(!realMeas.has(addDays(t,-1)))state.measurements.push({id:uid(),date:addDays(t,-1),arm:16.3*IN,forearm:13.2*IN,chest:44.4*IN,waist:33.6*IN,thigh:24.4*IN,calf:15.0*IN,neck:16.2*IN,demo:true});
  commit();
}

/* Freestyle and Do again build a session that is not tied to a routine day:
   no dayId and no routineId, so the cycle never advances on it. */
function freeDraft(name,ex){return {id:uid(),startedAt:Date.now(),date:today(),dayIdx:0,dayId:null,dayName:name,routineId:'',free:true,deload:false,light:false,cardio:[],notes:'',editingId:null,ex:ex||[]};}
/* ---------- a past workout, date first ----------
   The phone was left at home, so the sets are on paper or in memory. The
   date comes first and everything is read as of that day: which routine day
   was due, last time's numbers and targets, and PRs. The logger then runs in
   quick entry (draft.past): no rest timer, no clock, no check-in, and a set
   ticks itself once its reps are typed, so a whole workout goes in one pass.
   The session is saved under its date, so next up, targets and PRs after it
   read correctly even when it is entered after later sessions. */
function pastDue(R,date){
  const ok=i=>!!R.days[i]&&!R.days[i].rest&&R.days[i].items.length>0;
  if(R.schedule==='weekly'){const i=(parse(date).getDay()+6)%7;return ok(i)?i:-1;}
  const cs=cycleState(R,date);return ok(cs.next)?cs.next:-1;
}
function pastDraft(date,di){
  const R=activeRoutine();const deload=!!state.deloadWeek&&state.deloadWeek===weekStart(date);
  const day=di==null?null:R.days[di];
  if(!day){const d=freeDraft('Freestyle');return {...d,date,startedAt:null,past:true};}
  const items=day.items.map(it=>deload?{...it,sets:Math.max(1,Math.ceil(it.sets/2))}:it);
  const note=deload?'Deload: half sets, about 90% loads, 3+ RIR.':'';
  return {id:uid(),startedAt:null,date,dayIdx:di,dayId:day.id,dayName:day.name+(deload?' (deload)':''),routineId:R.id,deload,light:false,past:true,cardio:[],notes:note,note0:note,editingId:null,ex:items.map(it=>newBlock(it.exId,it,{deload,before:date}))};
}
/* Anything the lifter put into a session: a ticked set, typed reps, cardio
   minutes, a note on an exercise, or session notes other than the text the
   app wrote itself. The grey numbers and prefilled loads are the app's. */
function draftEntered(d){
  if(!d)return false;
  if(d.ex.some(b=>(b.note&&b.note.trim())||b.sets.some(x=>x.done||+x.r>0)))return true;
  if((d.cardio||[]).some(c=>c.min>0))return true;
  const n=(d.notes||'').trim();if(!n)return false;
  return typeof d.note0==='string'?n!==d.note0.trim():true;
}
function pastSheet(m){
  const R=activeRoutine();const due=pastDue(R,m.date);
  const on=state.sessions.filter(x=>x.date===m.date).map(x=>x.dayName||'Session');
  const opts=R.days.map((d,i)=>({d,i})).filter(x=>!x.d.rest&&x.d.items.length>0).sort((a,b)=>(b.i===due)-(a.i===due));
  const btn=({d,i})=>`<button class="btn block${i===due?' primary':''} pastday" data-act="pastGo" data-day="${i}"><span>${esc(dayLabel(R,i))}: ${esc(d.name)}</span>${i===due?'<small>due then</small>':`<small>${d.items.length} exercises</small>`}</button>`;
  return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pastH"><div class="sheet-h"><h3 id="pastH">Log a past workout</h3><button class="ib" aria-label="Close" data-act="mClose">✕</button></div>

  ${on.length?`<p class="small muted" style="margin:6px 0 0">Already logged that day: ${esc(on.join(', '))}.</p>`:''}
  <div class="stack" style="margin-top:12px">${opts.map(btn).join('')}<button class="btn block pastday" data-act="pastGo" data-day="free"><span>Freestyle</span><small>any exercises</small></button></div>
  <p class="small muted" style="margin:10px 0 0">Quick entry: type each set. ${tipi('No rest timer or clock. A set counts as done once its reps are typed. Last time, targets and PRs are read as of that date.','About quick entry')}</p></div>`;

/* Re-run the suggestion for one block, for example after its heaviest
   available load changes. Only untouched sets take the new load. */
function refreshBlock(b){
  const d=state.draft;if(!d||!b)return;const old=b.sets.find(x=>!x.done&&!x.warm);const oldW=old?old.w:null;
  const sg=suggest(b.exId,b.plan,{deload:!!d.deload,before:d.date});
  Object.assign(b,{inj:sg.inj||null,hint:sg.text,last:sg.last,target:sg.target,tgt:sg.tgt,easier:sg.easier||null,lastR:sg.lastR,lastNote:lastNoteOf(b.exId,d.date)});
  for(const x of b.sets)if(!x.done&&!x.warm&&!x.drop&&x.r==null&&x.w===oldW)x.w=sg.w;
}

  undo(){
    if(!undoStack.length){toast('Nothing left to undo');return;}
    /* Undo used to put back the whole state from before the action, which
       also threw away every session, weigh-in or set logged since then. Now
       only the action is reversed: a three-way merge with the state right
       after the action as the base, what is here now as one side and the
       state before the action as the other. Records changed since the action
       keep their newer version. */
    const e=undoStack.pop();undoPersist();const before=canon(state);
    let done=false;
    if(e.inv){try{done=e.inv()===true;}catch(x){log('undo',x);done=false;}if(done)state=normalize(state);}
    if(!done)try{
      const pre=normalize(JSON.parse(e.pre));const post=e.post?normalize(JSON.parse(e.post)):state;
      const P=chunksOf(pre),Q=chunksOf(post),C=chunksOf(state);const stat={conflicts:0};const parts={};
      for(const id of new Set([...Object.keys(P),...Object.keys(Q),...Object.keys(C)])){
        const q=Q[id]||emptyChunk(id);
        parts[id]=id==='draft'?{draft:mergeDraft(Q.draft&&Q.draft.draft,C.draft&&C.draft.draft,P.draft&&P.draft.draft)}
          :mergeChunk(id,q?baseOf(id,q):null,C[id]||emptyChunk(id),P[id]||emptyChunk(id),false,stat);
      }
      state=assemble(parts);
    }catch(x){log('undo',x);toast('Could not undo that');return;}
    if(canon(state)===before){toast('Nothing to undo there: it has changed since.');const below0=undoStack[undoStack.length-1];if(below0&&below0.post==null)below0.post=e.pre;return;}
    // If the step below never saw a save of its own, its result is the state
    // before the step just undone, not what this undo is about to save.
    const below=undoStack[undoStack.length-1];if(below&&below.post==null)below.post=e.pre;
    commit();$('#toast').hidden=true;render();
    toast(`Undone. ${undoStack.length} step${undoStack.length===1?'':'s'} left`);
  },

  finish(){

/* A load far from last time's (under 60% or over 140% of it) is the usual
   sign of a per-dumbbell or per-side mix-up. Said once per exercise per
   session, never blocking. Warm-ups and drop sets are expected to be lighter. */
const mixSeen=new Set();
function mixCheck(bi,si){
  const d=state.draft;const b=d&&d.ex[bi];const s=b&&b.sets[si];if(!s||s.warm||s.drop||!(+s.w>0))return;
  const ex=EX(b.exId);const st=IDX().exStats[b.exId];const last=st&&st.last?st.last.topW:0;if(!(last>0))return;
  const r=(+s.w)/last;if(r>=0.6&&r<=1.4)return;
  const key=d.id+':'+bi;if(mixSeen.has(key))return;mixSeen.add(key);
  toast(`${fmtW(+s.w)} ${U()} is ${r>1?'well above':'well below'} last time's ${fmtW(last)}. This one is logged as ${loadWords(ex)}.`,false,7000);
}
/* ---------- tips ----------
   Any element with data-tip shows it: after a short hover with a mouse, on
   keyboard focus, or when held for about half a second on a touch screen.
   A hold never also fires the tap underneath. The small i buttons show their
   tip on a plain tap too. */
function tipi(text,label){return `<button type="button" class="tipi" data-tip="${esc(text)}" aria-label="${esc(label||'More')}">i</button>`;}

function tipShow(el){
  const box=$('#tip');const txt=el&&el.getAttribute('data-tip');if(!box||!txt)return;
  TIP.el=el;box.textContent=txt;box.hidden=false;
  const r=el.getBoundingClientRect(),b=box.getBoundingClientRect(),vw=window.innerWidth,vh=window.innerHeight;
  let top=r.top-b.height-8;if(top<8)top=r.bottom+8;if(top+b.height>vh-8)top=Math.max(8,vh-b.height-8);
  let left=r.left+r.width/2-b.width/2;left=Math.max(12,Math.min(left,vw-b.width-12));
  box.style.top=top+'px';box.style.left=left+'px';
  el.setAttribute('aria-describedby','tip');
}
function tipHide(){clearTimeout(TIP.t);clearTimeout(TIP.hold);TIP.hold=null;const box=$('#tip');if(box)box.hidden=true;if(TIP.el){TIP.el.removeAttribute('aria-describedby');TIP.el=null;}}

document.addEventListener('pointerdown',e=>{
  TIP.swallow=false;
  if(TIP.el&&!(e.target.closest&&e.target.closest('.tipi')===TIP.el))tipHide();
  if(e.pointerType==='mouse')return;

/* Auto-mark and the grey reps. With auto-mark on, typing reps and leaving the
   field ticks the set (the change handler). Leaving an empty field whose grey
   number is last time's reps is the same confirmation without the typing, so
   it ticks the set with that number, like tapping the checkmark. The iPhone
   number pad has no Next key; its keyboard Done or a tap elsewhere is how a
   field is left there, so both routes land here. Moving to the same row's load
   or RIR is not leaving the set, a tap on a button does that button's job
   instead (the row's own checkmark already takes the grey number), and a
   locked or backgrounded phone blurs fields without the lifter doing anything. */

  const b=state.draft.ex[bi];const x=b&&b.sets[si];
  if(!x||x.done||x.warm||x.drop||+x.r>0)return false;
  const lr=greyR(b,si);if(!(lr>0))return false;

/* ---------- movable, foldable sections ----------
   Every section a tab shows carries data-mkey and a ⠿ handle in its header.
   Dragging the handle reorders sections; the order is saved per tab in
   settings.secOrder and applied after each render by moving the keyed
   elements into the slots the keyed elements occupied, so unkeyed elements
   (page titles, the Start card, notices) never move. Keys a tab does not
   show right now (Injuries with none flagged) keep their saved place.
   On the handle, the arrow keys do the same as dragging. */
/* After a list of sets in History: what the load and reps mean, when it is
   not a plain total. */
function histUnits(ex){const bits=[];const n=loadNote(ex).trim();if(n)bits.push(n);if(ex.perSide)bits.push(ex.timed?'seconds per side':'reps per side');return bits.length?` <span class="muted">(${bits.join(', ')})</span>`:'';}

function orderKeys(saved,present){

function applySecOrder(){
  const saved=state.settings.secOrder[ui.tab];if(!saved||!saved.length)return;
  const kids=keyedKids();if(kids.length<2)return;
  const order=orderKeys(saved,kids.map(e=>e.dataset.mkey));
  const byK={};kids.forEach(e=>{byK[e.dataset.mkey]=e;});
  const marks=kids.map(e=>{const c=document.createComment('slot');e.replaceWith(c);return c;});
  marks.forEach((c,i)=>c.replaceWith(byK[order[i]]));

/* Sections hidden in Settings > Layout are taken out after rendering. Their
   saved position is kept, so showing one again puts it back where it was. */
function applyHidden(){

  const keys=keyedKids().map(e=>e.dataset.mkey);

  old.forEach((k,i)=>{if(out.includes(k))return;const prev=old.slice(0,i).reverse().find(q=>out.includes(q));out.splice(prev?out.indexOf(prev)+1:0,0,k);});

const AI={fn:null,ready:false,off:false,ctl:null};

const setTxt=(ex,s)=>`${s.warm?'warm-up ':''}${s.drop?'drop ':''}${loadLabel(ex,+s.w||0)}${ex.bw?'':' '+U()} ${ex.timed?`held ${s.r} s`:`x ${s.r}`}${!ex.timed&&s.rir!=null&&s.rir!==''?` @ RIR ${s.rir}`:''}${s.cal?` (calibration set: predicted ${s.cal.pred} left at rep ${s.cal.at})`:''}`;
function sessTxt(ss){
  const tag=ss.deload?' (deload)':ss.light?' (lighter)':'';
  const body=ss.ex.map(b=>{const ex=EX(b.exId);return `  ${ex.name} (load ${loadWords(ex)}${ex.perSide?', reps per side':''})${b.rr?` [planned ${b.rr[0]}-${b.rr[1]} reps]`:''}: ${b.sets.map(s=>setTxt(ex,s)).join(', ')}${b.note?` (note: ${b.note})`:''}`;}).join('\n');
  const ck=ss.chk?`, check-in ${CHK_Q.filter(([k])=>ss.chk[k]).map(([k,l,n])=>`${l.toLowerCase()} ${chkWord(n[ss.chk[k]-1])}`).join(', ')}`:'';
  return `${ss.date} ${ss.dayName.replace(/ \((lighter|deload)\)$/,'')}${tag}${ss.free?' (freestyle)':''}${ss.durMin?`, ${ss.durMin} min`:''}${ck}\n${body}${ss.notes?`\n  Session note: ${ss.notes}`:''}`;

/* A plain-text picture of the training: routine, weekly volume against the
   bands, strength trends, stalls, body data, then sessions newest first,
   trimmed from the oldest end to stay well under the 64 KB input cap. */
function aiDigest(maxBytes){
  const I=IDX();const R=activeRoutine();const bands=state.settings.bands;const L=[];
  if(state.settings.heightCm)L.push(`Height: ${heightTxt(state.settings.heightCm)}.`);
  L.push(`Units: ${U()}. For bodyweight exercises the load shown is added weight (BW = bodyweight only). RIR = reps in reserve. Warm-up sets are excluded from analysis. Timed holds are logged in seconds.`);
  if(state.settings.rirMode==='off')L.push('RIR tracking is switched off in this app: every working set counts as hard and estimates use reps alone.');
  else if(state.settings.rirMode==='cal'){const c=calStats();if(c.recent>=2&&c.bias)L.push(`RIR correction is on: logged RIR is shifted by ${c.bias>0?'+':''}${c.bias} (median calibration error) before analysis.`);}
  {const c=calStats();if(c.n)L.push(`Calibration sets: ${c.n}; median error ${c.bias>0?'+':''}${c.bias} reps (positive means the lifter stops with more reps left than they call).`);}
  L.push(`Active routine "${R.name}", ${R.schedule==='weekly'?'fixed weekdays':`${R.days.length}-day cycle`}:`);
  R.days.forEach((d,i)=>L.push(`- ${dayLabel(R,i)} ${d.name}${d.rest?': rest':': '+d.items.map(it=>`${exName(it.exId)} ${it.sets}x${it.repMin}-${it.repMax} @${it.rir} RIR, ${it.rest}s rest`).join('; ')}`));
  const avg=actualAvg4();
  if(avg)L.push(`Hard sets per week, average over the last ${avg._weeks} trained week(s), direct 1 and secondary 0.5, with target band: ${MK.filter(m=>(avg[m]||0)>0||bands[m][0]>0).map(m=>`${ML[m]} ${r1(avg[m]||0)} (${bands[m][0]}-${bands[m][1]})`).join(', ')}.`);
  else L.push('No complete training week in the last 4 weeks yet, so weekly volume is not established.');
  if(I.scores.length)L.push(`Strength trend (median e1RM change over 6 weeks, current rep range): ${I.scores.map(s=>`${ML[s.m]} ${s.score>=0?'+':''}${r1(s.score)}%`).join(', ')}.`);
  const st=stalledIds();if(st.length)L.push(`Stalled (3 exposures without a PR): ${st.map(exName).join(', ')}.`);
  const inj=state.injuries||[];if(inj.length)L.push(`Injury flags: ${inj.map(x=>ML[x.m]+(x.note?` (${x.note})`:'')).join(', ')}.`);
  if(isDeloadWeek())L.push('This week is a deload week.');
  const bws=[...state.bodyweights].sort((a,b)=>a.date<b.date?-1:1).slice(-6);
  if(bws.length)L.push(`Bodyweight: ${bws.map(b=>`${b.date} ${fmtW(b.kg)} ${U()}`).join(', ')}.`);
  const ms=[...state.measurements].sort((a,b)=>a.date<b.date?-1:1).slice(-4);
  if(ms.length)L.push(`Tape (${LU()}): ${ms.map(m=>`${m.date} `+MEAS.filter(([k])=>m[k]>0).map(([k,l])=>`${l} ${lenD(m[k])}`).join(', ')).join('; ')}.`);

  for(const x of ss){const t=sessTxt(x);if(size+t.length>maxBytes)break;out.push(t);size+=t.length+1;}
  return `${head}\n\nSessions, newest first (${out.length} of ${ss.length}):\n${out.join('\n')||'none'}`;
}

/* Typed or dictated sets. Examples it reads:
   "235x5, 5, 4 rir 1"   three sets at 235, RIR 1 on each
   "185x8@2 205x6@1"      load changes mid-exercise, RIR per set
   "225 for 5 5 4 at 1"   "for" and "at" work like x and @ (RIR 1 on the last set)
   "bw x 10, bw+25 x 6"   bodyweight exercises, added load after the plus
   A bare number after the first set repeats the last load. Anything it
   cannot read returns null, and Claude is asked instead. */
function parseSets(text,ex,defW){
  let s=String(text||'').toLowerCase().replace(/[×*]/g,'x').replace(/\bfor\b/g,'x').replace(/\bat\b/g,'@').replace(/\breps?\b/g,'').replace(/\blbs?\b|\bkgs?\b/g,'');

  if(!s)return null;
  const toks=s.split(/[\s,;/]+/).filter(Boolean);
  const re=/^(?:(bw)(?:\+(\d+(?:\.\d+)?))?x|(\d+(?:\.\d+)?)x)?(\d{1,3})(?:@(\d+(?:\.\d+)?))?$/;
  let w=defW==null?null:defW;const out=[];
  for(const t of toks){
    const g=t.match(re);if(!g)return null;
    if(g[1])w=g[2]?fromD(+g[2]):0;else if(g[3]!=null)w=fromD(+g[3]);

    const rir=g[5]!=null?+g[5]:allRir;if(rir!=null&&!(rir>=0&&rir<=10))return null;
    if(w==null&&!ex.bw)return null;

}
function aiSetsValid(a){
  if(!Array.isArray(a)||!a.length||a.length>20)return null;
  const out=[];let w=null;
  for(const x of a){if(!x||typeof x!=='object')return null;
    if(x.w!=null){if(!(isFinite(+x.w)&&+x.w>=0&&+x.w<=3000))return null;w=fromD(+x.w);}
    const r=Math.round(+x.r);if(!(r>=1&&r<=100))return null;
    const rir=x.rir==null||x.rir===''?null:+x.rir;if(rir!=null&&!(rir>=0&&rir<=10))return null;
    out.push({w:w==null?0:w,r,rir});}

}

const AI_STYLE='Write plain text only: no markdown, no headings, no bullet symbols, no bold. Short paragraphs. Be direct and specific, give numbers where they help, and never invent data that is not in what follows. If the data is too thin to support a conclusion, say so in one sentence.';
