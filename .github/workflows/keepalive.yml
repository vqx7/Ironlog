# Free Supabase projects pause after a week without activity. This makes one
# tiny database call a day so the project never pauses while nobody logs.
# It uses only the public publishable key from supabase.config.json and the
# ping() function from SUPABASE.md, which reads nothing and returns "ok".
# GitHub stops scheduled runs in a repository with no commits for 60 days;
# Actions > Keep Supabase awake > Enable workflow turns it back on.
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:
# Least privilege (r66, PENDING 378): it only reads the repository's public settings file.
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned to its commit (NEW-36)
      - name: Ping the database
        run: |
          URL=$(jq -r .url supabase.config.json)
          KEY=$(jq -r .key supabase.config.json)
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
      # The test project the workflow's job `supabase` uses (OWNER.md G1), once its secrets are set: free projects pause too.
      - name: Ping the test project
        env:
          SUPA_TEST_URL: ${{ secrets.SUPA_TEST_URL }}
          SUPA_TEST_ANON_KEY: ${{ secrets.SUPA_TEST_ANON_KEY }}
        if: env.SUPA_TEST_URL != ''
        run: |
          curl -fsS -X POST "$SUPA_TEST_URL/rest/v1/rpc/ping" -H "apikey: $SUPA_TEST_ANON_KEY" -H "Content-Type: application/json" -d '{}'
