# Item 22: every suite runs on every pull request and every push to main, in
# a real Chromium, on both builds (npm test), and since 2026-10-14 in WebKit
# too (npm run test:webkit). A push to main (a merged pull
# request) then publishes dist/ to the gh-pages branch, which GitHub Pages
# serves, but only if every suite passed. A pull request is tested, and if
# every suite passes its build is published to preview/
# (vqx7.github.io/Ironlog/preview/), a separate app with its own storage and
# sync table, so it can be tried on a phone before the merge. Nothing a pull
# request contains reaches the live app until then.
name: Test and publish
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('test-{0}', github.ref) || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # r44: the suites in four shards on four runners at once, one suite at a
  # time on each (the same conditions as before, so nothing new can flake),
  # about a quarter of the old 19 minutes plus each runner's setup.
  # The hour a job had went to the install on a slow runner (r61, 2026-10-26:
  # in four runs six WebKit shards spent 30 to 60 minutes installing the
  # browser's system packages, and those past their limit were stopped
  # before their suites ran; every shard's suites took 12 to 20 minutes, and
  # Chromium's install at most 13). Since r62 every shard runs in
  # Playwright's own image for the version package-lock.json pins, which
  # holds both browsers and the packages they need, so nothing is installed
  # from the system's mirrors; `playwright install` is kept, which does
  # nothing when the image's browser is the one the lock wants and fetches
  # only the browser when it is not. The install and the suites keep their
  # own limits, and the install says how long each part took.
  suites:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        timeout-minutes: 30
        run: |
          t=$SECONDS; npm install --no-audit --no-fund; n=$((SECONDS-t))
          t=$SECONDS; npx playwright install chromium; echo "::notice title=install::npm $n s, chromium $((SECONDS-t)) s"
      # tests/moved.js ran here beside hygiene until it was retired in r54 (PENDING 316).
      - name: The proof suite on its own, so a runner that dropped it could not hide it
        run: node tests/hygiene.js
      - name: Every suite in shard ${{ matrix.shard }} of 4, source and standalone build
        timeout-minutes: 40
        run: node tests/run.js --shard ${{ matrix.shard }}/4 --jobs 1
      - name: Screenshots from the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.shard }}
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7
  # The same suites in WebKit (2026-10-14), in four shards like the above.
  # Every browser on an iPhone is WebKit, Safari and the home-screen app
  # included, and V uses an iPhone, so a change that breaks only there is
  # caught here before it reaches the phone.
  webkit:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        timeout-minutes: 30
        run: |
          t=$SECONDS; npm install --no-audit --no-fund; n=$((SECONDS-t))
          t=$SECONDS; npx playwright install webkit; echo "::notice title=install::npm $n s, webkit $((SECONDS-t)) s"
      - name: Every suite in shard ${{ matrix.shard }} of 4 in WebKit, source and standalone build
        timeout-minutes: 40
        run: node tests/run.js --browser webkit --shard ${{ matrix.shard }}/4 --jobs 1
      - name: Screenshots from the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-webkit-${{ matrix.shard }}
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7
  # One check named test, as OWNER.md B6 asks branch protection to require. It
  # runs whatever the shards did and fails unless all eight passed, the four
  # in Chromium and the four in WebKit: a skipped job would count as passing a
  # required check. So nothing is published, live or preview, that WebKit
  # failed.
  test:
    needs: [suites, webkit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: All eight shards passed
        run: |
          if [ "${{ needs.suites.result }}" != "success" ]; then echo "Chromium shards: ${{ needs.suites.result }}"; exit 1; fi
          if [ "${{ needs.webkit.result }}" != "success" ]; then echo "WebKit shards: ${{ needs.webkit.result }}"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build
        run: |
          npm install --no-audit --no-fund
          node scripts/build.js
      # The live app and the preview share the gh-pages branch, and either can
      # publish while the other is running, so each push starts from the
      # latest branch and tries again if it lost the race. The live publish
      # leaves preview/ alone, and the preview publish touches only preview/.
      # CNAME is the file GitHub writes to gh-pages when a custom domain is set
      # in Settings > Pages; deleting it would take the domain off the site.
      # .nojekyll is GitHub's too, if it is ever added.
      - name: Publish dist/ to gh-pages (live)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for try in 1 2 3; do
            git fetch --depth 1 origin gh-pages
            rm -rf ../pages; git worktree prune
            git worktree add --detach ../pages origin/gh-pages
            rsync -a --delete --exclude .git --exclude preview/ --exclude CNAME --exclude .nojekyll dist/ ../pages/
            cd ../pages
            git add -A
            if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
            git commit -q -m "Publish ${GITHUB_SHA::7}"
            if git push origin HEAD:gh-pages; then exit 0; fi
            cd "$GITHUB_WORKSPACE"; sleep 5
          done
          exit 1
      - name: Publish the pull request to preview/
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          node scripts/build.js --preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for try in 1 2 3; do
            git fetch --depth 1 origin gh-pages
            rm -rf ../pages; git worktree prune
            git worktree add --detach ../pages origin/gh-pages
            mkdir -p ../pages/preview
            rsync -a --delete dist-preview/ ../pages/preview/
            cd ../pages
            git add -A
            if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
            git commit -q -m "Preview of #${{ github.event.pull_request.number }} (${GITHUB_SHA::7})"
            if git push origin HEAD:gh-pages; then echo "Preview: https://vqx7.github.io/Ironlog/preview/" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
            cd "$GITHUB_WORKSPACE"; sleep 5
          done
          exit 1
