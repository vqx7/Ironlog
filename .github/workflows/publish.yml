# Item 22: every suite runs on every pull request and every push to main, in
# a real Chromium, on both builds (npm test). A push to main (a merged pull
# request) then publishes dist/ to the gh-pages branch, which GitHub Pages
# serves, but only if every suite passed. A pull request is only tested, so
# its check shows green or red before it is merged, and nothing it contains
# reaches the live app until then.
name: Test and publish
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('test-{0}', github.ref) || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Every suite, source and standalone build
        run: npm test
      - name: Screenshots from the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish dist/ to gh-pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth 1 origin gh-pages
          git worktree add --detach ../pages origin/gh-pages
          rsync -a --delete --exclude .git dist/ ../pages/
          cd ../pages
          git add -A
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Publish ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
