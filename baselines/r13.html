<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ironlog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   IRONLOG — visual system
   Chalk and iron neutrals. Ink is the action colour (primary
   buttons, selected chips, the active tab); the four plate
   colours are reserved for meaning:
     green  on target, done, PR
     amber  under target, needs a look
     blue   over target, information, supersets
     red    falling, injured, destructive
   Display: Big Shoulders Display (condensed, signage). Body:
   Hanken Grotesk. Every number is tabular.
   ============================================================ */
:root{
  --bg:#ebe9e4; --surface:#f9f8f5; --surface-2:#e4e1da; --surface-3:#d9d5cc;
  --ink:#16171a; --ink-2:#2a2c30; --muted:#5f5b54; --line:#d4cfc5; --line-soft:#e2ded6;
  --green:#23804f; --yellow:#a86a0c; --red:#c0392b; --blue:#2958b8;
  --green-bg:#dcebe1; --yellow-bg:#f1e5cf; --red-bg:#f3dcd8; --blue-bg:#dde5f4;
  --on-accent:#ffffff; --on-ink:#f4f2ed;
  --font:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --display:'Big Shoulders Display','Arial Narrow','Roboto Condensed','Helvetica Neue',system-ui,sans-serif;
  --r-lg:16px; --r-md:12px; --r-sm:9px;
  --head-h:52px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1011; --surface:#17191b; --surface-2:#212326; --surface-3:#2b2e32;
    --ink:#ecebe6; --ink-2:#d6d4ce; --muted:#9b978f; --line:#2c2f33; --line-soft:#232629;
    --green:#4cc38a; --yellow:#e2a940; --red:#f06a57; --blue:#7aa2f0;
    --green-bg:#173327; --yellow-bg:#3a2c12; --red-bg:#3d1c18; --blue-bg:#1a2744;
    --on-accent:#0f1011; --on-ink:#131415;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1011; --surface:#17191b; --surface-2:#212326; --surface-3:#2b2e32;
  --ink:#ecebe6; --ink-2:#d6d4ce; --muted:#9b978f; --line:#2c2f33; --line-soft:#232629;
  --green:#4cc38a; --yellow:#e2a940; --red:#f06a57; --blue:#7aa2f0;
  --green-bg:#173327; --yellow-bg:#3a2c12; --red-bg:#3d1c18; --blue-bg:#1a2744;
  --on-accent:#0f1011; --on-ink:#131415;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
/* Content inside <details> is rendered through the browser's own shadow slot,
   which the rule above cannot reach, so padded inputs stuck out of their card. */
details>*{box-sizing:border-box}
input[type=file]{max-width:100%;width:100%;font-size:14px}
html{scroll-padding-top:calc(var(--head-h) + env(safe-area-inset-top,0px));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.02;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:30px;text-transform:uppercase}
h3{font-size:21px}
p{margin:.35em 0}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums;font-weight:600}
b{font-weight:650}

/* ---------- header ---------- */
/* One sticky bar on every tab: the wordmark, this calendar week, and the save
   state. It replaced a decorative four-colour strip and the week grid that
   used to sit only on Today. */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;height:var(--head-h);padding:0 16px;border-bottom:1px solid var(--line)}
.top h1{font-size:22px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;line-height:1;flex:none}
.top h1 span{color:var(--muted);font-weight:600}
@media (max-width:374px){.top{gap:7px;padding:0 10px}.top h1{font-size:18px;letter-spacing:.03em}}
.wkbar{flex:1 1 auto;min-width:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.wkbar .w{-webkit-appearance:none;appearance:none;position:relative;min-width:0;border:1px solid transparent;border-radius:8px;background:var(--surface-2);padding:3px 0 4px;margin:0;display:flex;flex-direction:column;align-items:center;font:inherit;line-height:1;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent}
.wkbar div.w{cursor:default}
.wkbar .w .wd{font:650 9.5px/1.1 var(--font);letter-spacing:.06em;text-transform:uppercase}
.wkbar .w .dn{font:800 16px/1.1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.wkbar .w .nm{display:none;font-size:10px;line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px}
.wkbar .w.on{background:var(--green);color:var(--on-accent)}
.wkbar .w.on .dn{color:var(--on-accent)}
.wkbar .w.plan{background:transparent;border:1px dashed var(--muted);color:var(--ink)}
.wkbar .w.miss{background:transparent;border:1px dashed var(--red)}
.wkbar .w.rest{background:transparent}
.wkbar .w.rest .dn{color:var(--muted)}
.wkbar .w.cardio{background:transparent;border:1px solid var(--green)}
.wkbar .w.today{box-shadow:0 0 0 2px var(--ink)}
.wkbar .w.live::after{content:"";position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 2px var(--bg)}
.ssb{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0;font:700 14px/1 var(--font);color:var(--muted);cursor:pointer}
.ssb .sst{display:none;font:600 12.5px var(--font)}
.ssb.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,transparent)}
.ssb.warn{color:var(--yellow);border-color:var(--yellow);background:var(--yellow-bg)}
.ssb.bad{color:var(--red);border-color:var(--red);background:var(--red-bg)}
@media (min-width:620px){
  :root{--head-h:62px}
  .wkbar{gap:5px}
  .wkbar .w .nm{display:block}
  .ssb{width:auto;border-radius:999px;padding:0 10px}
  .ssb .sst{display:inline}
}
.sync-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
main{max-width:760px;margin:0 auto;padding:6px 16px 150px}

/* ---------- page header ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:18px 0 10px}
.ph h2{font-size:38px;font-weight:800;letter-spacing:.02em}
.ph .kick{font:600 12px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 2px}
.ph .meta{font-size:14px;color:var(--muted);margin:3px 0 0}
.ph-a{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- bottom tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{position:relative;background:none;border:0;min-height:58px;min-width:0;padding:7px 1px 6px;font:600 11px var(--font);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:50%;width:28px;height:3px;margin-left:-14px;border-radius:0 0 3px 3px;background:var(--ink)}
/* A session in progress: the Today tab reads Session and carries a dot, so it
   can be found again from any tab. */
.tabs button.live::after{content:"";position:absolute;top:7px;left:50%;margin-left:9px;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 2px var(--surface)}

/* ---------- help ---------- */
.hb{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);font:700 13px var(--font);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.hb[aria-expanded="true"]{background:var(--ink);color:var(--on-ink);border-color:transparent}
.ht{font-size:14px;color:var(--ink-2);margin:4px 0 10px;padding:9px 11px;background:var(--surface-2);border-radius:var(--r-sm);line-height:1.5}
.hrow{display:flex;align-items:center;gap:8px}

/* ---------- the one section component ----------
   Every foldable block on every tab is a .sec: one box, one header
   layout (handle, title, summary, help, chevron). Folds inside a
   section are .subsec: a hairline and a smaller title, never a box
   inside a box. */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin:10px 0;overflow:clip}
.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:58px;padding:10px 12px 10px 14px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.sec>summary::-webkit-details-marker{display:none}
.sec-t{font:700 21px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;flex:none}
.sec-s{flex:1 1 auto;min-width:0;text-align:right;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.chev{width:28px;height:28px;border-radius:50%;background:var(--surface-2);flex:none;display:inline-flex;align-items:center;justify-content:center}
.chev::before{content:"";width:7px;height:7px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateY(-2px) rotate(45deg);transition:transform .18s ease}
details[open]>summary .chev::before{transform:translateY(2px) rotate(-135deg)}
.sec[open]>summary{border-bottom:1px solid var(--line-soft)}
.sec-b{padding:12px 14px 14px}
.sec>summary:focus-visible{outline:3px solid var(--ink);outline-offset:-3px;border-radius:var(--r-lg)}
.subsec{border-top:1px solid var(--line-soft);margin:12px -14px 0;padding:0 14px}
.subsec:last-child{margin-bottom:-14px}
.subsec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:50px;padding:6px 0;-webkit-tap-highlight-color:transparent}
.subsec>summary::-webkit-details-marker{display:none}
.subsec>summary .chev{width:24px;height:24px;background:transparent;border:1px solid var(--line)}
.subsec-t{font-weight:650;font-size:15px;flex:none}
.subsec>.sec-b{padding:2px 0 14px}
/* Inner cards lose their box inside a section: the section is the box. */
.sec-b .card{background:none;border:0;border-radius:0;padding:0;margin:12px 0 0}
.sec-b>.card:first-child{margin-top:0}
.panel{background:var(--surface-2);border-radius:var(--r-md);padding:12px}
.callout{border-radius:var(--r-md);padding:10px 12px;font-size:14px;background:var(--surface-2)}
.callout.green{background:var(--green-bg)}.callout.yellow{background:var(--yellow-bg)}.callout.red{background:var(--red-bg)}.callout.blue{background:var(--blue-bg)}
.callout b{font-weight:650}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;letter-spacing:.02em;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.green{background:var(--green-bg);color:var(--green)}.pill.yellow{background:var(--yellow-bg);color:var(--yellow)}.pill.red{background:var(--red-bg);color:var(--red)}.pill.blue{background:var(--blue-bg);color:var(--blue)}

/* ---------- basic blocks ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;margin:10px 0}
.section{margin:18px 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.spread{justify-content:space-between}
.stack>*+*{margin-top:10px}
.explain{font-size:14px;color:var(--muted);margin:2px 0 8px}

.btn{min-height:44px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);font-weight:650;font-size:15px;padding:0 15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);transition:background .12s,transform .06s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--on-ink);border-color:transparent}
.btn.danger{color:var(--red)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:var(--r-sm)}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btn.noted{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ib{width:40px;height:40px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:16px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.ib.sm{width:32px;height:32px;font-size:13px;color:var(--muted)}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);min-height:44px;padding:6px 11px;font-size:16px;width:100%;min-width:0;color:var(--ink)}
.sec input[type=text],.sec input[type=date],.sec input[type=search],.sec select,.sec textarea,.block input,.block select{background:var(--bg)}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 1px var(--ink)}
textarea{min-height:74px;resize:vertical}
label.field{display:block;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.01em}
label.field>input,label.field>select,label.field>textarea{margin-top:4px;color:var(--ink);font-weight:400}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.check-inline{display:flex;align-items:flex-start;gap:10px;font-size:15px;line-height:1.35}
.check-inline input{width:20px;height:20px;flex:none;margin:0;accent-color:var(--ink)}

.tag{display:inline-block;font-size:11.5px;font-weight:650;letter-spacing:.02em;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap;vertical-align:1px}
.tag.rare,.tag.yellow{background:var(--yellow-bg);color:var(--yellow)}
.tag.green{background:var(--green-bg);color:var(--green)}
.tag.red{background:var(--red-bg);color:var(--red)}
.tag.blue{background:var(--blue-bg);color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;font-weight:600;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--on-ink);border-color:transparent}

.plate{display:inline-block;width:6px;height:22px;border-radius:2px;flex:none}
.plate.green{background:var(--green)} .plate.yellow{background:var(--yellow)} .plate.red{background:var(--red)} .plate.blue{background:var(--blue)} .plate.none{background:var(--line)}

/* ---------- program: days ---------- */
.day{background:var(--surface-2);border-radius:var(--r-md);margin:10px 0;overflow:hidden}
.day:first-child{margin-top:4px}
.day.rest{opacity:.75}
.dh{display:flex;gap:8px;align-items:center;padding:8px 8px 6px 10px}
.dh .dlabel{font:700 20px var(--display);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;flex:none}
.dh input[type=text]{font-weight:600;min-height:40px;background:var(--surface)}
.dmeta{padding:0 12px 4px;font-size:13.5px;color:var(--muted)}
.dmeta.row{flex-wrap:nowrap;gap:8px}
.dmeta .check-inline{flex:none;color:var(--ink);font-size:14px;align-items:center}
ul.items,ul.lib{list-style:none;margin:0;padding:2px 10px 6px}
ul.items:empty{min-height:54px;margin:6px 12px;border:2px dashed var(--line);border-radius:var(--r-sm)}
ul.items:empty::before{content:"Drop or add exercises here";display:block;padding:14px;color:var(--muted);font-size:14px;text-align:center}
.it{border-bottom:1px solid var(--line);padding:3px 0}
.it:last-child{border-bottom:0}
.ir{display:flex;align-items:center;gap:6px}
.ir .ib{width:34px;height:34px;background:transparent}
.sgrip{width:26px;height:32px;display:inline-flex;align-items:center;justify-content:center;cursor:grab;color:var(--muted);font-size:17px;touch-action:none;flex:none;user-select:none;-webkit-user-select:none;border-radius:6px;margin-left:-6px;opacity:.7}
.sgrip:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.dgrip{width:26px;height:40px;display:inline-flex;align-items:center;justify-content:center;cursor:grab;color:var(--muted);font-size:19px;touch-action:none;flex:none;user-select:none;-webkit-user-select:none;margin-left:-4px}
.dfold{background:transparent!important;border:0!important}
.dfold::before{content:"";display:inline-block;width:8px;height:8px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateY(-2px) rotate(45deg)}
.dfold[aria-expanded="true"]::before{transform:translateY(2px) rotate(-135deg)}
.grip{width:30px;height:40px;display:inline-flex;align-items:center;justify-content:center;cursor:grab;color:var(--muted);font-size:19px;touch-action:none;flex:none;user-select:none;-webkit-user-select:none}
.imain{flex:1;min-width:0;text-align:left;background:none;border:0;padding:6px 2px;cursor:pointer;color:var(--ink)}
.imain b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imain span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ied{padding:8px 2px 12px 36px}
.sortable-ghost{opacity:.35}
.sortable-chosen{background:var(--surface-3)}
.lib-panel{max-height:340px;overflow:auto;border-radius:var(--r-md);margin-top:10px;background:var(--surface-2)}
.lib-panel .it{border-color:var(--line)}

/* ---------- logger ---------- */
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;margin:10px 0}
.block.ss{box-shadow:inset 3px 0 0 var(--blue)}
.block.ss+.block.ss{margin-top:-4px}
.it.ss .imain b::after{content:" · SS";color:var(--blue);font-size:12px}
.bh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.bh-acts{display:flex;gap:3px;flex:none}
.bh h3{overflow-wrap:anywhere;font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.bh p{margin-top:3px}
.bh>div:first-child{min-width:0}
.hint{font-size:14px;background:var(--surface-2);padding:9px 11px;border-radius:var(--r-sm);margin:10px 0 6px;line-height:1.45}
.hint b{font-weight:650}
.lmrow{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 0}
.lm{display:inline-block;font:650 12px/1 var(--font);letter-spacing:.02em;padding:4px 8px;border-radius:999px;border:1px solid var(--ink);color:var(--ink);white-space:nowrap}
.bnote{margin:6px 0 0;padding:6px 9px;background:var(--surface-2);border-radius:var(--r-sm);color:var(--ink)}
.aiout{white-space:pre-wrap;margin-top:10px;min-height:1.4em;line-height:1.55}
.lnote{margin:6px 0 0;padding:6px 9px;border:1px dashed var(--line);border-radius:var(--r-sm);color:var(--muted)}
.linkbtn{background:none;border:0;padding:4px 2px;margin:0;color:var(--ink);font:inherit;font-weight:650;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.flag{color:var(--yellow);font-weight:650}
.tp{display:block;margin-top:3px;color:var(--muted)}
.tp:empty{display:none}
.tp.beat{color:var(--green);font-weight:650}
.tp.ez{color:var(--blue)}
.trend{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.sg{position:relative;display:grid;grid-template-columns:24px minmax(0,1.3fr) minmax(0,1fr) minmax(0,.8fr) 40px 44px;gap:6px;align-items:center;margin-top:6px}
.sg.head{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:650;margin-top:12px}
.sg .n{font:700 17px var(--display);color:var(--muted);text-align:center}
.sg input{text-align:center;padding:6px 4px;font-variant-numeric:tabular-nums;font-weight:600}
.sg select{text-align:center;padding:6px 2px;min-height:44px}
.sg select.unset{color:var(--muted)}
.sg.done input,.sg.done select{border-color:var(--green);background:var(--green-bg)}
.sg.norir{grid-template-columns:24px minmax(0,1.3fr) minmax(0,1fr) 40px 44px}
.sg .n.drop{color:var(--blue)}
.wbtn,.cbtn{height:44px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:700;color:var(--muted)}
.wbtn.on{background:var(--yellow);color:var(--on-accent);border-color:transparent}
.wbtn.drop{background:var(--blue);color:var(--on-accent);border-color:transparent}
.cbtn{font-size:17px}
.cbtn.on{background:var(--green);color:var(--on-accent);border-color:transparent}
.sg.pr::after{content:attr(data-pr);position:absolute;right:0;top:-9px;background:var(--green);color:var(--on-accent);font:700 10px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:6px;pointer-events:none}
.ci-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap}
.ci-row>span{min-width:58px;font-weight:600}
.cb-row{padding:10px 0;border-bottom:1px solid var(--line-soft)}
.cb-row:first-child{padding-top:0}
.cb-row:last-child{border-bottom:0}
.cb-row .band{margin-top:6px}
.band .fill.cb{background:var(--ink)}
.cbline{margin:6px 0 0;color:var(--muted)}
.cbline b{color:var(--ink);font-weight:650}
.caldue{margin:6px 0 0;color:var(--blue)}
ol.steps{margin:6px 0 10px;padding-left:22px;font-size:15px}
ol.steps li{margin:2px 0}
.welcome h3{margin-bottom:6px;font-size:26px;text-transform:uppercase}
.short-list{list-style:none;margin:10px 0 0;padding:0}
.short-list li{padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:15px}
.short-list li:last-child{border-bottom:0}
.hide-grp{margin-top:12px}
.hide-grp>p{margin:0 0 6px}
.lh-row{margin-top:10px;flex-wrap:wrap}
.lh-row input[type=date]{width:auto;flex:0 1 160px;min-height:36px;padding:4px 8px;font-size:16px}
.whtr{margin:8px 0 0}

/* ---------- stats ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:560px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:559px){.kpis>.kpi:last-child:nth-child(odd){grid-column:1/-1}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:11px 12px 12px}
.sec .kpi{background:var(--surface-2);border:0}
.kpi .v{font:800 36px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.kpi .v .small{font:600 14px var(--font);color:var(--muted)}
.kpi .l{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.35}
.mrow{display:grid;grid-template-columns:6px 92px minmax(0,1fr) auto;gap:9px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:14.5px}
.mrow:last-child{border-bottom:0}
.mrow .plate{height:18px}
.mrow .r{text-align:right;white-space:nowrap;min-width:60px;font-variant-numeric:tabular-nums}
.band{position:relative;height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.sec .band{background:var(--bg)}
.band .zone{position:absolute;top:0;bottom:0;background:var(--green-bg)}
.band .fill{position:absolute;top:2px;bottom:2px;left:0;border-radius:5px}
.band .fill.under{background:var(--yellow)} .band .fill.in{background:var(--green)} .band .fill.over{background:var(--blue)}
.band .fill.down{background:var(--red)}
.band .fill.track{background:var(--muted)}
.band .fill.ghost{opacity:.35}
.band .fill.conf{background:var(--ink);opacity:.6}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 6px}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:4px;vertical-align:1px;font-style:normal}
.chartbox{position:relative;height:220px;margin-top:10px}
.chips.rng{justify-content:flex-end;margin:8px 0 0;gap:4px}
.chips.rng .chip{min-height:30px;padding:0 11px;font-size:13px}
.chartbox.tall{height:320px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.heat div{aspect-ratio:1;border-radius:4px;background:var(--surface-2)}
.heat div.on{background:var(--green)}
.heat div.fut{opacity:.35}
.heat div.today{outline:2px solid var(--ink);outline-offset:-2px}
.heat-h{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-align:center}
table.t{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:7px 4px;border-bottom:1px solid var(--line-soft);text-align:left}
table.t th{color:var(--muted);font-weight:650;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
table.t td.r,table.t th.r{text-align:right}
.scroll-x{overflow-x:auto}
.jump{position:sticky;top:calc(var(--head-h) + env(safe-area-inset-top,0px));z-index:15;display:flex;gap:6px;overflow-x:auto;padding:8px 16px;margin:0 -16px;background:var(--bg);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.jump::-webkit-scrollbar{display:none}
.jump .chip{flex:none;min-height:32px;font-size:13px}
.sec[id^="sec-"]{scroll-margin-top:calc(var(--head-h) + 56px + env(safe-area-inset-top,0px))}
.bw-entry{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto;gap:8px;align-items:end;margin-top:12px}
.bw-entry .btn{min-height:44px}
.bw-list{list-style:none;margin:10px 0 0;padding:0}
.bw-list li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line-soft);font-size:15px}
.bw-list li:last-child{border-bottom:0}
.bw-list .d{color:var(--muted);flex:1}
.body-sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.body-sum>div{background:var(--surface-2);border-radius:var(--r-md);padding:10px 12px}
.body-sum>div:only-child{grid-column:1/-1}
.body-sum .v{font:800 30px/1 var(--display);font-variant-numeric:tabular-nums}
.body-sum .v .small{font:600 13px var(--font);color:var(--muted)}
.body-sum .l{font-size:12px;color:var(--muted);margin-top:4px}

/* ---------- week strip ---------- */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:0 0 8px}
.wk .d{-webkit-appearance:none;appearance:none;width:100%;min-width:0;border:1px solid transparent;border-radius:var(--r-sm);background:var(--surface-2);padding:6px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;font:inherit;color:var(--muted);cursor:default}
.wk .d .wd{font:600 10.5px var(--font);letter-spacing:.08em;text-transform:uppercase}
.wk .d .dn{font:800 19px/1.05 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.wk .d .nm{font-size:10px;line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.wk .d.plan{border:1px dashed var(--muted);background:transparent;color:var(--ink)}
.wk .d.miss{border:1px dashed var(--red);background:transparent}
.wk .d.on{background:var(--green);color:var(--on-accent);cursor:pointer}
.wk .d.on .dn{color:var(--on-accent)}
.wk .d.today{box-shadow:0 0 0 2px var(--ink)}
.wk .d.fut{opacity:.75}
.wk .d.cardio{border-color:var(--green);color:var(--ink)}
.cyc{display:flex;gap:4px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cyc::-webkit-scrollbar{display:none}
.cyc .c{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;white-space:nowrap;color:var(--muted);background:transparent}
.cyc .c b{margin-right:5px;font:800 13px var(--display)}
.cyc .c.done{background:var(--green);color:var(--on-accent);border-color:transparent}
.cyc .c.next{border:2px solid var(--ink);color:var(--ink);font-weight:650}
.cyc .c.rest{opacity:.55}

/* ---------- today: the hero is the one inked block ---------- */
.hero{background:var(--ink);color:var(--on-ink);border-radius:20px;padding:16px 16px 14px;margin:14px 0 12px}
.hero .eyebrow{color:var(--on-ink);opacity:.7}
.hero h2{font-size:48px;font-weight:800;line-height:.95;margin:6px 0 6px;letter-spacing:.015em;overflow-wrap:anywhere}
.hero .muted{color:var(--on-ink);opacity:.72}
.hero .overb{color:var(--yellow)}
.eyebrow{font:600 12px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.hero-note{background:color-mix(in srgb,var(--on-ink) 12%,transparent);border-radius:var(--r-sm);padding:8px 10px;margin:10px 0 0}
.hero .btn{background:transparent;color:var(--on-ink);border-color:color-mix(in srgb,var(--on-ink) 30%,transparent)}
.hero .btn.primary{background:var(--on-ink);color:var(--ink);border-color:transparent}
.hero .btn.noted{box-shadow:inset 0 0 0 1px var(--on-ink)}
.hero .tag.blue{background:color-mix(in srgb,var(--on-ink) 16%,transparent);color:var(--on-ink)}
.btn.big{font:800 22px var(--display);letter-spacing:.06em;text-transform:uppercase;min-height:56px;margin-top:14px}
.inline-sel{display:flex;align-items:center;gap:8px;color:inherit;margin:0;white-space:nowrap;min-width:0;font-size:13px;opacity:.9}
.inline-sel select{max-width:200px;min-width:0;flex:1 1 auto;padding:6px 8px;font-size:13px;min-height:36px}
.hero .inline-sel{flex:1 1 auto}
.hero .inline-sel select{max-width:none;background:color-mix(in srgb,var(--on-ink) 10%,transparent);color:var(--on-ink);border-color:color-mix(in srgb,var(--on-ink) 25%,transparent)}
.hero .inline-sel select option{color:initial}
/* Start variants: a two-line button each, so what it does is on the button. */
.hero-alt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.hero-alt .btn{min-width:0;min-height:44px;padding:0 10px;line-height:1.15;text-align:center}
.hero-alt .btn:last-child:nth-child(odd){grid-column:1/-1}
.hero .hb{border-color:color-mix(in srgb,var(--on-ink) 35%,transparent);color:var(--on-ink)}
.hero .hb[aria-expanded="true"]{background:var(--on-ink);color:var(--ink)}
.hero .ht{background:color-mix(in srgb,var(--on-ink) 12%,transparent);color:var(--on-ink)}
.hero .ht b{font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile.wide{grid-column:1/-1;min-height:0}
.tu{font:600 15px var(--font);color:var(--muted)}
@media (min-width:620px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{-webkit-appearance:none;appearance:none;font:inherit;color:var(--ink);text-align:left;background:var(--surface-2);border:0;border-radius:var(--r-md);padding:11px 12px;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-height:104px;min-width:0}
.tile:active{transform:scale(.98)}
.tile .tv{font:800 40px/1 var(--display);font-variant-numeric:tabular-nums}
.tile .tl{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.tile .ts{font-size:11.5px;color:var(--muted);margin-top:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.bm-wrap{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.bm{margin:0;text-align:center}
.bm svg{width:100%;max-width:170px;height:auto;display:block;margin:0 auto}
.bm figcaption{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.bm-base *{fill:var(--surface-2);stroke:var(--line);stroke-width:.8}
.mm{cursor:pointer;outline:none}
.mm *{stroke:var(--surface);stroke-width:.8}
.mm.st-none *{fill:var(--surface-3)}
.mm.st-under *{fill:var(--yellow)}
.mm.st-in *{fill:var(--green)}
.mm.st-over *{fill:var(--blue)}
.mm.st-track *{fill:var(--muted)}
.mm.sel *{stroke:var(--ink);stroke-width:1.8}
.mm:focus-visible *{stroke:var(--ink);stroke-width:2.2}
.bm-legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;color:var(--muted)}
.bm-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.bm-legend i.st-none{background:var(--surface-3)}.bm-legend i.st-track{background:var(--muted)}.bm-legend i.st-under{background:var(--yellow)}.bm-legend i.st-in{background:var(--green)}.bm-legend i.st-over{background:var(--blue)}
.bm-detail{margin-top:10px;padding:10px 12px;border-radius:var(--r-md);background:var(--surface-2)}

/* ---------- summary rows ---------- */
.headline{font-size:15px;line-height:1.5;margin:0 0 8px;color:var(--ink)}
.summary{padding:2px 0!important}
.srow{-webkit-appearance:none;appearance:none;display:grid;grid-template-columns:8px 64px minmax(0,1fr) 10px;gap:10px;align-items:start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line-soft);padding:12px 14px;font:inherit;color:var(--ink);cursor:pointer}
.srow:last-child{border-bottom:0}
.srow.static{cursor:default;grid-template-columns:8px 64px minmax(0,1fr)}
.srow .sl{font:600 11px var(--font);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding-top:3px}
.srow .st{font-size:14px;line-height:1.45}
.srow .chev2{color:var(--muted);font-size:18px;line-height:1}
.dot{width:8px;height:8px;border-radius:50%;margin-top:6px;display:inline-block;background:var(--line)}
.dot.green{background:var(--green)}.dot.yellow{background:var(--yellow)}.dot.red{background:var(--red)}.dot.blue{background:var(--blue)}
.recap{margin:0;padding-left:18px}.recap li{padding:3px 0}
.linkish{background:none;border:0;padding:0;font:inherit;color:var(--red);font-weight:650;text-decoration:underline;cursor:pointer}

/* ---------- history list ---------- */
.hitem{border-bottom:1px solid var(--line-soft);padding:10px 0}
.hitem:first-of-type{padding-top:4px}
.hitem:last-of-type{border-bottom:0}
.hitem.open{background:none}

/* ---------- modal, toast, timer ---------- */
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,10,12,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:88vh;overflow:auto;overscroll-behavior:contain;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
/* Pickers keep one height while you type, so the search box does not jump as
   the list shrinks; only the list scrolls. */
.sheet.fixed{height:88vh;height:88dvh;display:flex;flex-direction:column;overflow:hidden;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.sheet.fixed .sheet-scroll{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;margin:8px -16px 0;padding:0 16px 8px}
.pick-grp{font:650 11.5px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
.pick-grp:first-child{margin-top:4px}
.pick .tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;flex:none}
.pick.new{color:var(--ink)}
.pcard{border:1px solid var(--line);border-radius:var(--r-md);padding:11px 12px;margin-top:8px}
.pcard.best{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pcard ul{margin:6px 0 0;padding-left:18px}
.pcard li{font-size:14px;margin:2px 0}
.eqsw{list-style:none;margin:8px 0 0;padding:0}
.eqsw li{padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:14.5px}
.eqsw li:last-child{border-bottom:0}
body.modal-open{overflow:hidden}
/* Tips: the longer word on a control, shown on hover, keyboard focus, or a
   press-and-hold on touch, so the screen itself stays short. */
#tip{position:fixed;z-index:80;max-width:min(300px,calc(100vw - 24px));background:var(--ink);color:var(--on-ink);font:500 13.5px/1.4 var(--font);padding:9px 11px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:none;white-space:normal;text-align:left;text-transform:none;letter-spacing:0}
[data-tip]{-webkit-touch-callout:none}
button[data-tip],.lm[data-tip]{-webkit-user-select:none;user-select:none}
.hastip{text-decoration:underline dotted;text-underline-offset:3px;text-decoration-color:var(--muted);cursor:help}
.tipi{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);font:700 11px/1 var(--font);font-style:italic;padding:0;margin-left:4px;vertical-align:3px;cursor:help;letter-spacing:0;text-transform:none}
details.more{border-top:1px solid var(--line-soft);padding-top:4px}
details.more>summary{list-style:none;cursor:pointer;padding:8px 0;font-weight:650}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"+ ";}
details.more[open]>summary::before{content:"− ";}
details.more>summary .small{display:block;font-weight:400}
.block{scroll-margin-top:calc(var(--head-h) + 12px + env(safe-area-inset-top,0px))}
@keyframes flashIn{0%{box-shadow:0 0 0 3px var(--green)}100%{box-shadow:0 0 0 0 transparent}}
.block.flash{animation:flashIn 1.4s ease-out}
.sheet h3{font-size:24px;text-transform:uppercase;letter-spacing:.02em}
@media(min-width:700px){#modal{align-items:center}.sheet{border-radius:20px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.pick{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line-soft);padding:11px 2px;cursor:pointer;color:var(--ink)}
.pick b{font-weight:650}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--on-ink);padding:11px 15px;border-radius:var(--r-md);font-size:15px;display:flex;gap:12px;align-items:center;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.22)}
body.timer-on #toast{bottom:calc(128px + env(safe-area-inset-bottom,0px))}
#toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
#timer{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--ink);color:var(--on-ink);display:flex;align-items:center;justify-content:space-between;padding:6px 16px}
#timer.done{background:var(--green);color:var(--on-accent)}
#timer.compact{left:auto;right:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));border-radius:999px;padding:4px 4px 4px 14px;gap:10px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#timer.compact .tv{font-size:22px}
.btn.rest{font-variant-numeric:tabular-nums}
#timer .tv{font:800 30px var(--display);font-variant-numeric:tabular-nums;letter-spacing:.03em}
#timer button{background:color-mix(in srgb,currentColor 18%,transparent);border:0;color:inherit;border-radius:8px;min-height:36px;padding:0 11px;font-weight:650;cursor:pointer}
.overb{color:var(--yellow);font-weight:650}
.cgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.8fr) minmax(0,.8fr);gap:8px;margin-top:8px}
.clist{list-style:none;margin:0;padding:0}
.clist li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:15px}
.clist li:last-child{border-bottom:0}
.inj-list li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:15px}
.inj-list li:last-child{border-bottom:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><h1>Iron<span>log</span></h1><nav class="wkbar" id="wkbar" aria-label="This week"></nav><button type="button" class="ssb" id="saveState" data-act="goBackup"></button></header>
<main id="view"></main>
<div id="timer" hidden></div>
<nav class="tabs" id="tabs" aria-label="Sections">
  <button data-tab="today" aria-label="Today"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Today</span></button>

/* Region balance: hard sets in a region against the midpoint of that region's

/* ---------- timer ---------- */
const timer={end:0,iv:null,fired:false};
/* navigator.vibrate does not exist on iOS Safari, so the timer used to finish
   in total silence on an iPhone. The audio context is created on the tap that
   starts the timer, which is a user gesture, so the beep is allowed to play
   later. A backgrounded tab can still suppress it, which is why the bar also
   changes state and the elapsed time is computed from an absolute end stamp
   rather than counted down. */
let actx=null;
function beep(){
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    if(!actx)actx=new C();
    if(actx.state==='suspended')actx.resume();
    const t0=actx.currentTime;
    [0,0.22].forEach((off,i)=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type='sine';o.frequency.value=i?1046:784;
      g.gain.setValueAtTime(0.0001,t0+off);
      g.gain.exponentialRampToValueAtTime(0.25,t0+off+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+off+0.18);
      o.connect(g);g.connect(actx.destination);o.start(t0+off);o.stop(t0+off+0.2);
    });
  }catch(e){log('audio',e);}
}
function primeAudio(){
  try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!actx)actx=new C();if(actx.state==='suspended')actx.resume();}catch(e){log('audio',e);}
}
/* A locked phone suspends the page, so the timer cannot sound or vibrate
   until you unlock it. Said once per device, the first time a rest starts
   with the keep-awake setting off. */
function wakeTip(){
  if(state.settings.wakeLock)return;
  try{if(localStorage.getItem(KEY+'.tipWake'))return;localStorage.setItem(KEY+'.tipWake','1');}catch(e){return;}
  setTimeout(()=>toast('If the screen locks, the rest timer cannot alert you until you unlock. Settings has Keep the screen on during a session.',false,8000),600);
}
function startTimer(sec){wakeTip();timer.end=Date.now()+sec*1000;timer.fired=false;primeAudio();$('#timer').hidden=false;if(!timer.iv)timer.iv=setInterval(tick,250);tick();}
/* One place that marks a set done or not done, so the checkmark and auto-done

let lastAuto=null;
function setDone(bi,si,val){
  const b=state.draft.ex[bi];const s=b&&b.sets[si];if(!s)return;
  s.done=val;
  const btn=document.querySelector(`[data-act="sDone"][data-b="${bi}"][data-s="${si}"]`);
  if(btn){btn.classList.toggle('on',val);btn.setAttribute('aria-pressed',String(val));const row=btn.closest('.sg');if(row)row.classList.toggle('done',val);}
  refreshPR(bi,si,true);

  let autoRest=val&&!s.warm&&+b.plan.rest>0&&state.settings.timerMode==='auto';

  if(autoRest&&b.plan.ss){const grp=state.draft.ex.filter(x=>x.plan&&x.plan.ss===b.plan.ss);if(grp[grp.length-1]!==b)autoRest=false;}

/* Screen wake lock, optional. A locked phone suspends the page and with it the
   rest alert, so keeping the screen on is the only way a web page can
   guarantee the beep. Unsupported or refused requests fail quietly. */
let wakeSentinel=null;
async function wakeOn(){
  if(!state.settings.wakeLock||!state.draft||wakeSentinel)return;
  try{if(navigator.wakeLock&&navigator.wakeLock.request){wakeSentinel=await navigator.wakeLock.request('screen');wakeSentinel.addEventListener&&wakeSentinel.addEventListener('release',()=>{wakeSentinel=null;});}}

}
function wakeOff(){try{if(wakeSentinel)wakeSentinel.release();}catch(e){/* already released */}wakeSentinel=null;}

function stopTimer(){clearInterval(timer.iv);timer.iv=null;timer.fired=false;$('#timer').hidden=true;document.body.classList.remove('timer-on');}
function tick(){
  const left=Math.max(0,Math.round((timer.end-Date.now())/1000));

/* Re-rendering replaces #view wholesale, which used to blow away whatever the
   user was typing in. Rebuild a selector for the focused control first, then
   put focus and the caret back where they were. */
function focusKey(el){
  if(!el||!el.tagName||el===document.body)return null;
  if(el.id)return '#'+el.id.replace(/([^\w-])/g,'\\$1');
  const at=[];
  for(const a of el.attributes)if(a.name.indexOf('data-')===0)at.push(`[${a.name}="${String(a.value).replace(/(["\\])/g,'\\$1')}"]`);
  return at.length?el.tagName.toLowerCase()+at.join(''):null;
}
function rerenderKeepScroll(){
  const y=window.scrollY,el=document.activeElement,key=focusKey(el);

  const se=el&&typeof el.selectionEnd==='number'?el.selectionEnd:null;
  render();
  window.scrollTo(0,y);

  let next=null;try{next=document.querySelector(key);}catch(e){/* selector from a stale element */}
  if(!next||typeof next.focus!=='function')return;
  try{
    next.focus({preventScroll:true});
    if(ss!=null&&typeof next.setSelectionRange==='function')next.setSelectionRange(ss,se);
  }catch(e){/* caret restore is best effort */}
  window.scrollTo(0,y);
}

    <button class="btn sm" data-act="iSwap" data-uid="${it.uid}" style="align-self:flex-end">Swap</button><button class="btn sm danger" data-act="iDel" data-day="${di}" data-i="${ii}" style="align-self:flex-end">Remove</button></div>
    ${nx?`<div class="row" style="margin-top:8px"><button class="btn sm ${linked?'noted':''}" data-act="ssToggle" data-uid="${it.uid}">${linked?'Unlink superset':'Superset with next'}</button>${linked?`<span class="small muted">Paired with ${esc(exName(nx.exId))}: alternate sets, rest once after the pair.</span>`:''}</div>`:''}
    ${ex.note?`<p class="small muted">${esc(ex.note)}</p>`:''}</div>`:''}</li>`;
}
function bLibItems(){return libFiltered(ui.bLibQ,ui.bLibM,'',false).map(e=>`<li class="it" data-ex="${e.id}"><div class="ir"><span class="grip" aria-hidden="true">⠿</span><div class="imain"><b>${esc(e.name)}</b><span>${esc(ML[e.primary])}, ${esc(EQL[e.equip]||e.equip)}${e.rare?', less common':''}</span></div><button class="ib" aria-label="Add ${esc(e.name)}" data-act="libAdd" data-ex="${e.id}">+</button></div></li>`).join('');}
function libFiltered(q,m,e,rare){
  q=(q||'').toLowerCase().trim();
  return state.exercises.filter(x=>!x.archived&&(!q||x.name.toLowerCase().includes(q))&&(!m||x.primary===m||x.secondary.includes(m))&&(!e||x.equip===e)&&(!rare||x.rare)).sort((a,b)=>a.name.localeCompare(b.name));
}
function volumeRows(sets,conf){
  const bands=state.settings.bands;
  const maxScale=Math.max(24,...MK.map(m=>Math.max(sets[m]||0,bands[m][1]+2)));
  const hasConf=!!conf;
  const head=hasConf?`<div class="legend"><span><i style="background:var(--ink);opacity:.55"></i>RIR logged</span><span><i style="background:var(--green);opacity:.34"></i>assumed hard (RIR blank)</span></div>`:'';
  return head+MK.map(m=>{
    const v=sets[m]||0;const[lo,hi]=bands[m];const tr=TRACK_ONLY.has(m);const cls=tr?'track':v<lo?'under':v>hi?'over':'in';
    const plate=tr?'none':v<lo?'yellow':v>hi?'blue':'green';
    const c=hasConf?Math.min(conf[m]||0,v):0;
    const tip=` data-tip="${esc(ML[m])}: ${r1(v)} hard sets${hasConf?`, ${r1(c)} with RIR logged, ${r1(v-c)} assumed`:''}. ${tr?'Tracked only: no study sets a weekly dose for it.':`Target ${lo} to ${hi}; the upper number is typical, not a ceiling.`}"`;
    return `<div class="mrow"><span class="plate ${plate}"></span><span>${ML[m]}</span><div class="band"${tip}><div class="zone" style="left:${lo/maxScale*100}%;width:${(hi-lo)/maxScale*100}%"></div><div class="fill ${cls}${hasConf?' ghost':''}" style="width:${Math.min(100,v/maxScale*100)}%"></div>${hasConf&&c>0?`<div class="fill conf" style="width:${Math.min(100,c/maxScale*100)}%"></div>`:''}</div><span class="r num">${r1(v)}<span class="muted small"> /${lo}-${hi}</span></span></div>`;
  }).join('');
}

}

/* ---------- DASHBOARD ---------- */
function viewDash(){
  const I=IDX();const R=activeRoutine();
  /* Adherence counts only days the routine actually plans work on: a non-rest
     day with no exercises in it used to inflate the denominator. Each week is
     capped at its own planned days, so training seven days against a six-day
     routine no longer reports 117%. The window is the four completed weeks
     before this one, which the label now says out loud. */
  const planned=trainDaysOf(R)*weekFactor(R);
  const cur=weekStart(today());
  const sessDates=new Set(state.sessions.map(s=>s.date));
  /* Only weeks since your first session count. Before that there was nothing
     to adhere to, and counting those weeks read 0% on day one. */
  const firstWk=state.sessions.length?weekStart(sortedSessions()[0].date):null;
  let done4=0,wks4=0;
  for(let k=1;k<=4;k++){
    const ws=addDays(cur,-7*k);if(!firstWk||ws<firstWk)break;let n=0;wks4++;
    for(let d=0;d<7;d++)if(sessDates.has(addDays(ws,d)))n++;
    done4+=Math.min(n,planned);
  }
  const adher=planned&&wks4?Math.round(done4/(planned*wks4)*100):null;
  const thisWeek=I.weekSets[cur]||{};
  const thisWeekConf=I.weekConf[cur]||{};
  // Each set once, as on Today. Summing the per-muscle counts double counts
  // secondary work (a bench set is 1 chest + 0.5 triceps + 0.5 delts).
  const wkHard=weekStats().got;
  const pr14=I.prs.filter(p=>p.date>=addDays(today(),-14)).length;
  const stalled=Object.entries(I.exStats).filter(([,s])=>s.stalled);
  // How much of the last 4 weeks of volume is measured rather than assumed.
  const rc=I.rirCov;const covPct=rc.total&&state.settings.rirMode!=='off'?Math.round(rc.logged/rc.total*100):null;
  // Only said when it matters: under 70% of recent sets carry an RIR.
  const cov=covPct==null||covPct>=70?'':`<div class="callout ${covPct>=35?'yellow':'red'}" style="margin:0 0 12px"><p class="small hastip" style="margin:0" data-tip="Sets with a blank RIR still count as hard, so the bars below are partly assumed. The RIR picker on each set takes one tap."><b>RIR on ${covPct}% of recent sets.</b> The bars below are partly assumed.</p></div>`;
  let h=pageHead('Your log, measured','Stats',`${state.sessions.length} session${state.sessions.length===1?'':'s'} logged${state.sessions.length?`, since ${fmtDate(sortedSessions()[0].date)}`:''}`,helpBtn('stats'))+`${helpText('stats','Everything here is calculated from your logged sets: performance trends, not direct measurements of muscle size. Tap a section title to open or fold it. Each visit starts with only the top section open. Each section has its own ? for what the numbers mean.')}
  <nav class="jump" aria-label="Stats sections">${orderKeys(state.settings.secOrder.dash||[],DSEC_KEYS).filter(k=>!state.settings.hidden.includes('dash:'+k)).map(k=>DSECS.find(x=>x[0]===k)).map(([k,l])=>`<button class="chip" data-act="dashJump" data-sec="${k}">${l}</button>`).join('')}</nav>`;
  if(!state.sessions.length){
    h+=`<div class="card"><p><b>No sessions logged yet.</b> Trends, stall detection and rankings appear after a few sessions per exercise. Your planned volume works right away. To preview the full Stats page, load demo data in Settings.</p></div>`;
  }
  h+=`<div class="kpis"><div class="kpi"><div class="v">${adher==null?'n/a':adher+'%'}</div><div class="l">${!planned?'Adherence: no planned days':adher==null?'Adherence: appears after your first full week':`Adherence, previous ${wks4} full week${wks4===1?'':'s'} (${r1(done4)}/${r1(planned*wks4)})`}</div></div>
  <div class="kpi"><div class="v">${wkHard}</div><div class="l">Hard sets this week, of ${weekStats().tgt} planned</div></div>
  <div class="kpi"><div class="v" style="color:${stalled.length>=3?'var(--red)':'inherit'}">${stalled.length}</div><div class="l">Stalled exercises</div></div>${extraKpis()}</div>`;
  if(state.sessions.length)h+=dashSummary();
  if(aiOn()&&state.sessions.some(x=>!x.demo))h+=`<div class="card row spread"><span class="small">Ask Claude a question about your own log: a stall, a split, a weak point.</span><button class="btn sm primary" data-act="aiReview">Ask Claude</button></div>`;

  const avg=actualAvg4();const plan=plannedSets(R);const bands=state.settings.bands;

  // volume: five ways to read the same hard-set counts, plus tonnage
  h+=dsec('volume','Volume','Hard sets per muscle. Direct work counts 1, secondary counts 0.5. A set counts as hard when you logged RIR 3 or less, and also when you left RIR blank, because most working sets are. Blank sets are shaded lighter so you can see how much of the bar is measured and how much is assumed. Amber is under your band, green is inside it, blue is over. Load is total weight × reps per week, comparable week to week but not session to session.',
    `${cov}
  <div class="chips">${[['planned','Planned'],['week','This week'],['avg','Recent average'],['trend','Weekly trend'],['region','By region'],['load','Load']].map(([k,l])=>`<button class="chip ${ui.volMode===k?'on':''}" data-act="volMode" data-v="${k}">${l}</button>`).join('')}</div>
  ${ui.volMode==='region'?regionBody(avg,thisWeek):ui.volMode==='trend'?trendBody():ui.volMode==='load'?`<div class="card">${volHeadline()}${state.sessions.length?`${rangeChips('vol',weeksSpan(firstDate(state.sessions)),8)}<div class="chartbox"><canvas id="chVol"></canvas></div>${chartFallback()}`:'<p class="small muted">Log a session to start this chart.</p>'}</div>`:`<div class="card">${ui.volMode==='planned'?volumeRows(plan):ui.volMode==='week'?volumeRows(thisWeek,state.settings.rirMode==='off'?null:thisWeekConf):(avg?`<p class="small muted" style="margin:0 0 6px">Averaged over the ${avg._weeks} week${avg._weeks===1?'':'s'} with training in the last 4. Weeks with no sessions are excluded rather than counted as zero.</p>${volumeRows(avg,state.settings.rirMode==='off'?null:avg._conf)}`:'<p class="muted">No sessions in the previous 4 full weeks.</p>')}</div>`}`,`${wkHard} hard sets this week`);

  // muscles: weak points, then return on volume folded beneath
  const inj=injuredSet();
  const reasons={};const add=(m,t,c)=>{(reasons[m]||(reasons[m]=[])).push([t,c]);};
  for(const m of inj)add(m,'Injured, targets paused','red');
  for(const s of I.scores)if(s.label==='lagging'&&!inj.has(s.m))add(s.m,s.indirect?'Lagging strength (indirect)':'Lagging strength','red');
  // Plan and actual being under band is one fact about one muscle, not two.
  // Counting it twice also pushed it up a sort that ranks by flag count.
  for(const m of MK){
    if(inj.has(m))continue;
    if(TRACK_ONLY.has(m))continue;
    const uPlan=(plan[m]||0)<bands[m][0],uAct=!!avg&&(avg[m]||0)<bands[m][0];
    if(uPlan&&uAct)add(m,'Under band (plan and actual)','yellow');
    else if(uPlan)add(m,'Under band (plan)','yellow');
    else if(uAct)add(m,'Under band (actual)','yellow');
  }
  for(const m of state.settings.priorities)add(m,'Your priority','blue');
  const wp=Object.entries(reasons).sort((a,b)=>b[1].length-a[1].length);
  const weakBody=`<div class="card">${wp.length?wp.map(([m,rs])=>{const [lo,hi]=bands[m];const bits=[`this week ${r1(thisWeek[m]||0)} of ${lo}-${hi} hard sets`];if(avg)bits.push(`recent average ${r1(avg[m]||0)}`);if((plan[m]||0)<lo)bits.push(`routine plans ${r1(plan[m]||0)}`);
      return `<div style="padding:6px 0;border-bottom:1px solid var(--line)"><div class="row spread"><b>${ML[m]}</b><div class="chips">${rs.map(([t,c])=>`<span class="tag ${c}">${t}</span>`).join('')}</div></div><p class="small muted" style="margin:2px 0 0">${bits.join(', ')}</p></div>`;}).join(''):'<p class="muted">Nothing flagged.</p>'}</div>`;

  // stalls (folded inside Lifts)
  let stl='';
  if(stalled.length){
    stl+=stalled.map(([id,s])=>`<div class="row spread" style="padding:6px 0;border-bottom:1px solid var(--line)"><span><span class="plate yellow" style="height:14px;vertical-align:-2px"></span> ${esc(exName(id))}</span><span class="muted small">last ${fmtDate(s.last.date)}</span></div>`).join('');
    if(stalled.length>=3)stl+=`<p class="small hastip" style="color:var(--red);margin-top:8px" data-tip="Several lifts flat together often points to fatigue. Check sleep, food and stress; Deload week is under More options on Today (half the sets, about 90% loads, kept out of your trends).">${stalled.length} stalled at once: likely fatigue</p>`;
  }else stl+='<p class="muted">No stalls detected.</p>';
  const lw=lastLighterWeek();
  if(lw)stl+=`<p class="small muted" style="margin-top:8px">${lw.weeks==null?`No lighter week in the last 12 (usual ${lw.norm} hard sets a week).`:`Last lighter week: ${lw.weeks} week${lw.weeks===1?'':'s'} ago (${lw.sets>0?`${lw.sets} hard sets against your usual ${lw.norm}`:'a week off'}).`}</p>`;

  // exercise trend
  const withData=Object.keys(I.byEx).filter(id=>I.byEx[id].length).sort((a,b)=>exName(a).localeCompare(exName(b)));
  if(!ui.dashEx||!I.byEx[ui.dashEx])ui.dashEx=withData[0]||null;
  let exh='<div class="card">';
  if(ui.dashEx){
    const st=I.exStats[ui.dashEx];const ex=EX(ui.dashEx);const exps=I.byEx[ui.dashEx];
    exh+=`<select data-bind="dashEx">${withData.map(id=>`<option value="${id}" ${id===ui.dashEx?'selected':''}>${esc(exName(id))}</option>`).join('')}</select>
    <div style="margin-top:8px">${exHeadline(ui.dashEx)}</div>${noE1(ex)?`<div class="kpis" style="margin-top:8px"><div class="kpi"><div class="v">${st.n}</div><div class="l">Sessions logged</div></div><div class="kpi"><div class="v">${st.stalled?'Yes':'No'}</div><div class="l">Stalled</div></div></div>`:''}<div class="kpis" style="margin-top:8px${noE1(ex)?';display:none':''}"><div class="kpi"><div class="v">${st.best?(ex.bw?'≈':'')+fmtW(st.best):'n/a'}</div><div class="l">Best e1RM (${U()}${loadNote(ex)})</div></div><div class="kpi"><div class="v">${st.pct==null?'n/a':(st.pct>=0?'+':'')+r1(st.pct)+'%'}</div><div class="l">Change, first to last exposure</div></div><div class="kpi"><div class="v">${st.slope==null?'n/a':(st.slope>=0?'+':'')+r1(st.slope)+'%'}</div><div class="l">Fitted trend per week</div></div><div class="kpi"><div class="v">${st.n}</div><div class="l">Sessions logged</div></div></div>
    ${st.pct!=null&&st.slope!=null&&(st.pct>0)!==(st.slope>0)&&Math.abs(st.pct)>0.5&&Math.abs(st.slope)>0.1?`<p class="small muted hastip" style="margin-top:6px" data-tip="The change compares the endpoints; the trend fits a line through every session. When they split, trust the trend: one unusual session is pulling an endpoint.">Change and trend disagree</p>`:''}
    ${noE1(ex)?'':`${rangeChips('ex',weeksSpan(exps[0].date),8,'all')}<div class="chartbox"><canvas id="chEx"></canvas></div>${chartFallback()}
    <p class="small muted hastip" style="margin:4px 0 0" data-tip="Filled diamond: a new best estimate. Hollow diamond: a rep PR, more reps at a load than ever before, which can sit below an earlier best. The dashed line to the right appears only when the trend is clearly up, with a range, 4 weeks out. The thin dotted line is your RIR at the top load.">Reading the chart</p>`}
    ${st.easier?`<p class="small" style="color:var(--blue);margin-top:6px"><b>${esc(easierText(ex,st.easier))}</b></p>`:''}
    ${st.fade?`<p class="small" style="color:var(--yellow);margin-top:6px"><b>Set-to-set drop-off is widening at ${esc(loadLabel(ex,st.fade.w))}${ex.bw?'':' '+U()}: ${st.fade.from} → ${st.fade.to} reps lost from first set to last across your last three sessions.</b> That usually means fatigue or shorter rest rather than lost strength.</p>`:''}
    ${ex.bw&&!state.bodyweights.length?'<p class="small" style="color:var(--yellow)">Log your bodyweight on the Today tab so this bodyweight exercise can be trended.</p>':bwBackfillNote(ui.dashEx)}
    <div class="scroll-x"><table class="t" style="margin-top:8px"><tr><th>Date</th><th>Sets</th><th class="r">e1RM</th></tr>${exps.slice(-8).reverse().map(x=>`<tr><td>${fmtDate(x.date)}${x.progress?' <span class="tag green">PR</span>':''}</td><td>${x.pts.map(p=>setShort(ex,p.w,p.r)).join(', ')}</td><td class="r num">${x.best?(ex.bw?'≈':'')+fmtW(x.best):''}</td></tr>`).join('')}</table></div>`;
  }else exh+='<p class="muted">Log a session to see exercise trends.</p>';
  exh+='</div>';
  const prBody=I.prs.length?I.prs.slice(0,15).map(p=>{const ex=EX(p.exId);return `<div class="row spread" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(ex.name)} <span class="tag ${p.type==='e1RM'?'green':'blue'}">${ex.timed&&p.type==='Rep PR'?'Time PR':p.type}</span></span><span class="num">${p.type==='e1RM'?fmtW(p.value)+' '+U():setShort(ex,p.w,p.r)} <span class="muted small">${fmtDate(p.date)}</span></span></div>`;}).join(''):'<p class="muted">No PRs yet. Your first session of an exercise sets the baseline.</p>';
  h+=dsec('exercise','Lifts',`Estimated 1RM works on reps to failure (reps plus RIR; a blank RIR counts as 0, so it errs low): Brzycki up to 10, Epley for 11 and 12, nothing past 12, and a set called at more than 4 RIR is left out. It is in the same frame you log in, so per dumbbell or per side where that applies. Bodyweight lifts add the share of your bodyweight they move (≈): all of it for pull-ups and dips, 64% for push-ups. Leg raises, crunches, Nordics and similar lifts that turn about a joint get no estimate; their progress is reps and load. A lift is moving or falling only past 3% over 6 weeks with a clear trend, since estimates swing 2 to 8% day to day. Stalled: the trend over the last 4 to 6 sessions, 3 weeks or more, is flat or down, leaving out deload, lighter and trimmed sessions. An e1RM PR beats your best from the same band of reps to failure (1-5, 6-10, 11-12); a rep PR is a set no earlier set matched on both load and reps.`,
    exh+sub('stalls','Stalls',stl,stalled.length?`<span class="pill ${stalled.length>=3?'red':'yellow'}">${stalled.length} stalled</span>`:'none')+sub('prs','Recent PRs',prBody,`${pr14} in 14 days`),`${Object.keys(I.byEx).length} lifts tracked`);

  // consistency heat map
  // Starts at your first logged week; weeks ahead fill a young log.
  const hFirst=firstDate(state.sessions);const hWin=weekWindow(hFirst,'heat',12);const hN=weeksSpan(hFirst);
  let heat=`<div class="card">${rangeChips('heat',hN,12)}<div class="heat-h">${DAYS.map(d=>`<span>${d[0]}</span>`).join('')}</div><div class="heat">`;
  const t=today();
  if(!hWin.length)heat+='</div><p class="small muted" style="margin:6px 0 0">Your first logged session starts this grid.</p><div>';
  for(const w of hWin)for(let i=0;i<7;i++){const d=addDays(w.wk,i);heat+=`<div class="${sessDates.has(d)?'on':''} ${d>t?'fut':''} ${d===t?'today':''}" data-tip="${fmtDateLong(d)}${sessDates.has(d)?': lifted':''}"></div>`;}
  heat+='</div></div>';

  // ranking (folded inside Muscles)
  let rank='<div class="card">';
  if(I.scores.length){
    const maxAbs=Math.max(1,...I.scores.map(s=>Math.abs(s.score)));
    const src=avg||thisWeek;
    rank+=I.scores.map(s=>{const c=s.label==='progressing'?'green':s.label==='lagging'?'red':'none';
      const sets=src[s.m]||0;const [lo,hi]=bands[s.m];
      const read=s.score>GROW_PCT?(sets<lo?'Rising on low volume: leave it.':'Rising: hold this volume.')
        :s.score<-GROW_PCT?'Falling: check recovery first.'
        :(sets>=hi?'Flat at high volume: change exercises or effort, not sets.':'Flat: try 2 more sets a week for 3 weeks.');
      return `<div style="padding:6px 0;border-bottom:1px solid var(--line)"><div class="mrow" style="border:0;padding:0"><span class="plate ${c}"></span><span>${ML[s.m]}${s.indirect?' <span class="tag" data-tip="No direct exercise for this muscle. Trend inferred from lifts where it assists.">indirect</span>':''}</span><div class="band"><div class="fill ${s.score>=0?'in':'down'}" style="width:${Math.abs(s.score)/maxAbs*100}%"></div></div><span class="r num">${s.score>=0?'+':''}${r1(s.score)}%</span></div><p class="small muted" style="margin:2px 0 0">${r1(sets)} sets a week · ${read}</p></div>`;}).join('');
    const missing=MK.filter(m=>!I.scores.find(s=>s.m===m));
    if(missing.length)rank+=`<p class="small muted" style="margin-top:8px">Not enough data yet: ${missing.map(m=>ML[m]).join(', ')}.</p>`;
  }else rank+='<p class="muted">Not enough data yet. Log at least 3 sessions of an exercise within 6 weeks.</p>';

      title:its=>its.length?(its[0].datasetIndex===pjIdx?`In 4 weeks, around ${fmtDate(addDays(base,Math.round(its[0].parsed.x)))}`:fmtDateLong(addDays(base,Math.round(its[0].parsed.x)))):'',
      afterLabel:it=>it.datasetIndex===0&&prType[it.dataIndex]?(prType[it.dataIndex]==='e1RM'?'New best estimate':'Rep PR: more reps at a load than ever before'):''}};
    if(exps.some(x=>x.topRir!=null)){
      ds.push({label:'RIR at top load',data:exps.map((x,i)=>({x:xs[i],y:x.topRir==null?null:r1(x.topRir)})),borderColor:yellow,backgroundColor:yellow,borderDash:[2,3],borderWidth:1.5,pointRadius:2,spanGaps:true,fill:false,yAxisID:'y1'});
      eo.scales.y1={position:'right',min:0,max:5,ticks:{color:cssv('--muted'),stepSize:1},grid:{drawOnChartArea:false},border:{display:false},title:{display:true,text:'RIR',color:cssv('--muted')}};
    }
    mkChart('chEx',{type:'line',data:{datasets:ds},options:eo});
  }
  /* One bar per week, split by the session it came from. Session-by-session
     bars alternated chest days with leg days, which are not comparable; weeks
     are. The unfinished current week is labelled as such. */
  {
    const win=weekWindow(sFirst,'vol',8);const wks=win.map(w=>w.wk);
    if(win.length){
    const base=n=>String(n||'Session').replace(/ \((lighter|deload)\)$/,'');
    const types=[];const byT={};
    for(const x of I.sessVol){const wk=weekStart(x.date);const i=wks.indexOf(wk);if(i<0)continue;const t=base(x.day);
      if(!byT[t]){byT[t]=wks.map((_,j)=>win[j].fut?null:0);types.push(t);}byT[t][i]+=x.vol;}
    const pal=[blue,green,yellow,cssv('--red'),'#8b5cf6','#14b8a6','#f97316',muted];
    const vo=baseOpts();vo.scales.x.stacked=true;vo.scales.y.stacked=true;
    const labels=weekAxis(win,vo);
    vo.plugins.tooltip={filter:it=>it.raw!=null,callbacks:{title:its=>its.length?`Week of ${fmtDate(wks[its[0].dataIndex])}`:'',label:it=>`${it.dataset.label}: ${Math.round(it.raw).toLocaleString()} ${U()}`,
      footer:its=>{if(!its.length)return '';const i=its[0].dataIndex;const tot=types.reduce((a,t)=>a+toD(byT[t][i]||0),0);return `Week total: ${Math.round(tot).toLocaleString()} ${U()}`;}}};
    mkChart('chVol',{type:'bar',data:{labels,
      datasets:types.map((t,i)=>({label:t,data:byT[t].map(v=>v==null?null:Math.round(toD(v))),backgroundColor:pal[i%pal.length]+(i<pal.length?'':'99'),borderRadius:2,stack:'v'}))},options:vo});
    }
  }
  const bw=[...state.bodyweights].sort((a,b)=>a.date<b.date?-1:1);
  if(bw.length){
    const avg=bw.map(b=>{const from=addDays(b.date,-6);const w=bw.filter(x=>x.date>=from&&x.date<=b.date);return r1(toD(w.reduce((a,x)=>a+x.kg,0)/w.length));});
    const base=bw[0].date;const xs=bw.map(b=>daysBetween(base,b.date));
    const win=dayWindow(base,xs[xs.length-1],'bw',28,'all');const ax=dayAxis(base,win);
    const bo=baseOpts();bo.scales.x={...bo.scales.x,...ax,ticks:{...bo.scales.x.ticks,...ax.ticks}};
    bo.interaction={mode:'nearest',axis:'x',intersect:false};
    bo.plugins.tooltip={callbacks:{title:its=>its.length?fmtDateLong(addDays(base,Math.round(its[0].parsed.x))):''}};
    mkChart('chBW',{type:'line',data:{datasets:[{label:`Bodyweight (${U()})`,data:bw.map((b,i)=>({x:xs[i],y:r1(toD(b.kg))})),borderColor:muted,backgroundColor:muted,pointRadius:2,showLine:false},{label:'7-day average',data:avg.map((v,i)=>({x:xs[i],y:v})),borderColor:blue,pointRadius:0,tension:.3,borderWidth:2}]},options:bo});
  }
}

/* ---------- HISTORY ---------- */
function viewHistory(){
  const ss=[...state.sessions].sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
  const I=IDX();
  const real=ss.filter(x=>!x.demo).length;
  let h=pageHead('Every session, newest first','History',`${ss.length} session${ss.length===1?'':'s'}${ss.length&&real!==ss.length?` (${ss.length-real} demo)`:''}`);
  const cs=[...state.cardio].sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
  if(cs.length)h+=sec({sk:'history:cardio',key:'cardio',title:'Cardio and mobility',sub:`${cs.length} entr${cs.length===1?'y':'ies'}`,body:`<ul class="clist">${cs.slice(0,40).map(c=>`<li><span><b>${esc(CARDIOL[c.kind])}</b> <span class="small muted">${fmtDate(c.date)} · ${c.min} min${c.hr?` · ${c.hr} bpm`:''}${c.when!=='solo'?' · '+CWHENL[c.when].toLowerCase():''}${c.note?' · '+esc(c.note):''}</span></span><button class="ib sm" data-act="cardioDel" data-id="${c.id}" aria-label="Delete ${fmtDate(c.date)} cardio">✕</button></li>`).join('')}</ul>${cs.length>40?`<p class="small muted">${cs.length-40} older entries are in the CSV export.</p>`:''}`});
  const tr=state.trash||[];
  if(tr.length)h+=sec({sk:'history:trash',key:'trash',title:'Recently deleted',sub:`${tr.length} item${tr.length===1?'':'s'}, kept ${TRASH_DAYS} days`,body:`<ul class="clist">${tr.map(x=>{const nm=x.kind==='session'?`${x.data.dayName||'Session'}, ${fmtDate(x.data.date)}`:x.kind==='cardio'?`${CARDIOL[x.data.kind]||'Cardio'}, ${fmtDate(x.data.date)}`:`Routine: ${x.data.name||'Routine'}`;return `<li><span>${esc(nm)} <span class="small muted">deleted ${fmtDate(x.date)}</span></span><button class="btn sm" data-act="restore" data-id="${x.id}" data-k="${x.kind}">Restore</button></li>`;}).join('')}</ul>`});
  if(!ss.length)return h+'<div class="card"><p style="margin:0">No sessions yet. Start one from the Today tab.</p></div>';
  const withData=Object.keys(I.byEx).sort((a,b)=>exName(a).localeCompare(exName(b)));
  if(ui.histEx&&!I.byEx[ui.histEx])ui.histEx='';
  let body=`<label class="field">Show sessions with<select data-bind="histEx"><option value="">Any exercise</option>${withData.map(id=>`<option value="${id}" ${ui.histEx===id?'selected':''}>${esc(exName(id))}</option>`).join('')}</select></label><div style="margin-top:6px">`;
  const shown=ui.histEx?ss.filter(x=>x.ex.some(b=>b.exId===ui.histEx)):ss;
  if(!shown.length)body+='<p class="muted">No sessions with that exercise.</p>';
  // Every session used to be rebuilt into one string on every render. Past a
  // few hundred logs that is a visible stall on a phone for rows nobody has
  // scrolled to yet.
  const page=shown.slice(0,ui.histLimit);
  for(const s of page){
    const nSets=s.ex.reduce((a,b)=>a+b.sets.filter(isWork).length,0);const vol=(I.sessVol.find(v=>v.id===s.id)||{}).vol||0;const open=ui.histOpen===s.id;
    body+=`<div class="hitem${open?' open':''}"><button class="pick" style="border:0;padding:0" data-act="histToggle" data-id="${s.id}" aria-expanded="${open}"><span style="min-width:0"><b>${esc(s.dayName||'Session')}</b>${s.deload?' <span class="tag blue">deload</span>':''}${s.free?' <span class="tag">freestyle</span>':''}${s.ex.some(b=>b.cut)?' <span class="tag">trimmed</span>':''}${s.demo?' <span class="tag">demo</span>':''}<br><span class="small muted">${fmtDateLong(s.date)}</span></span><span class="num small" style="text-align:right;flex:none">${nSets} sets<br><span class="muted">${Math.round(toD(vol)).toLocaleString()} ${U()}${s.durMin?` · ${s.durMin} min`:''}</span></span></button>`;
    if(ui.histEx&&!open){const b=s.ex.find(x=>x.exId===ui.histEx);const ex=EX(ui.histEx);if(b)body+=`<p class="small" style="margin:6px 0 0">${b.sets.map(x=>setStr(ex,x)).join(', ')}${histUnits(ex)}</p>`;}
    if(open){
      body+='<div class="panel" style="margin-top:10px">';
      if(s.chk)body+=`<p class="small muted" style="margin:0 0 6px">Check-in: ${CHK_Q.filter(([k])=>s.chk[k]).map(([k,l,n])=>`${l.toLowerCase()} ${chkWord(n[s.chk[k]-1])}`).join(', ')}</p>`;
      body+=s.ex.map(b=>{const ex=EX(b.exId);return `<p class="small" style="margin:0 0 6px"><b>${esc(ex.name)}</b>: ${b.sets.map(x=>setStr(ex,x)).join(', ')}${histUnits(ex)}${b.note?`<br><span class="muted">${esc(b.note)}</span>`:''}</p>`;}).join('');
      if(s.notes)body+=`<p class="small muted" style="margin:0 0 6px">${esc(s.notes)}</p>`;
      body+=`<div class="row" style="margin-top:8px"><button class="btn sm" data-act="histEdit" data-id="${s.id}">Edit</button><button class="btn sm" data-act="histRepeat" data-id="${s.id}" data-tip="Start a new session today with these exercises">Do again</button><button class="btn sm danger" data-act="histDel" data-id="${s.id}">Delete</button></div></div>`;
    }
    body+='</div>';
  }
  body+='</div>';
  if(shown.length>page.length)body+=`<button class="btn block" style="margin-top:10px" data-act="histMore">Show ${Math.min(HIST_PAGE,shown.length-page.length)} more (${page.length} of ${shown.length})</button>`;
  h+=sec({sk:'history:sessions',key:'sessions',title:'Sessions',sub:ui.histEx?`${shown.length} with ${esc(exName(ui.histEx))}`:`${ss.length} logged`,body,def:true});
  return h;
}

/* ---------- modal rendering ---------- */
/* Re-rendering a sheet used to rebuild it from the top: a tap on a muscle chip
   halfway down the exercise editor threw the sheet back to its first line and
   dropped the cursor. When the same sheet is redrawn, its scroll positions and
   the focused field (with the caret) are put back. */
function renderModal(){
  const el=$('#modal');const m=ui.modal;
  const same=!!m&&renderModal.last===m&&!el.hidden;
  const old=same?el.querySelector('.sheet'):null,oldIn=same?el.querySelector('.sheet-scroll'):null;
  const st=old?old.scrollTop:0,ist=oldIn?oldIn.scrollTop:0;
  const ae=document.activeElement;const fk=same&&ae&&el.contains(ae)?focusKey(ae):null;
  const ss=fk&&typeof ae.selectionStart==='number'?ae.selectionStart:null,se=fk&&typeof ae.selectionEnd==='number'?ae.selectionEnd:null;
  renderModalBody();
  if(el.hidden||!ui.modal){document.body.classList.remove('modal-open');renderModal.last=null;return;}
  document.body.classList.add('modal-open');renderModal.last=ui.modal;
  if(!same)return;
  const sh=el.querySelector('.sheet'),inn=el.querySelector('.sheet-scroll');
  if(sh)sh.scrollTop=st;if(inn)inn.scrollTop=ist;
  if(fk){let n=null;try{n=el.querySelector(fk);}catch(e){/* stale selector */}
    if(n&&typeof n.focus==='function')try{n.focus({preventScroll:true});if(ss!=null&&typeof n.setSelectionRange==='function')n.setSelectionRange(ss,se);}catch(e){/* caret restore is best effort */}}
}
renderModal.last=null;
function renderModalBody(){
  const m=ui.modal;const el=$('#modal');if(!m){el.hidden=true;return;}
  let h='';
  if(m.kind==='confirm'){
    h=`<div class="sheet" role="dialog" aria-modal="true"><div class="sheet-h"><h3>${esc(m.title)}</h3></div><p>${esc(m.body)}</p><div class="row" style="margin-top:12px"><button class="btn ${m.danger?'danger':'primary'}" data-act="mOk">${esc(m.okLabel)}</button>${m.alt?`<button class="btn" data-act="mAlt">${esc(m.alt.label)}</button>`:''}<button class="btn" data-act="mClose">Cancel</button></div></div>`;
  }else if(m.kind==='picker'){

/* One place that applies a choice from the exercise picker, or an exercise
   just created from it, for every mode the picker opens in. Adding to a
   session scrolls to the new exercise and marks it, instead of leaving it
   somewhere below the fold. */
function applyPick(m,id){
  if(!m||!id)return;
  if(m.mode==='addDay'){const R=curRoutineB();const d=R.days[m.day];closeModal();if(!d){rerenderKeepScroll();return;}d.items.push(newItem(id));if(d.rest)d.rest=false;commit();rerenderKeepScroll();toast(`${exName(id)} added to ${dayLabel(R,m.day)}`);return;}
  if(m.mode==='swapItem'){const f=findItem(m.uid);if(f){f.it.exId=id;commit();}closeModal();rerenderKeepScroll();return;}
  const d=state.draft;closeModal();if(!d){rerenderKeepScroll();return;}
  const half=p=>(d.deload||d.light)?{...p,sets:Math.max(1,Math.ceil(p.sets/2))}:p;
  if(m.mode==='addBlock'){d.ex.push(newBlock(id,half(planFor(id)),{deload:!!d.deload}));saveNow();afterAdd(d.ex.length-1);return;}
  if(m.mode==='swapBlock'){const b=d.ex[m.b];if(!b){rerenderKeepScroll();return;}const nb=newBlock(id,{...b.plan},{deload:!!d.deload});nb.swappedFrom=b.swappedFrom||b.exId;if(nb.swappedFrom===id)nb.swappedFrom=null;d.ex[m.b]=nb;saveNow();rerenderKeepScroll();return;}
  rerenderKeepScroll();
}
function afterAdd(bi){

  try{el.scrollIntoView({block:'start',behavior:calm?'auto':'smooth'});}catch(e){el.scrollIntoView();}

}

/* Routine housekeeping. Empty: no exercise on any day. Duplicate: same name
   and same days and exercises as an earlier routine. Only routines that are
   not active and have no logged sessions are offered for cleanup; logged
   sessions are kept either way. */
const routineEmpty=r=>r.days.every(d=>!d.items.length);
const routineSig=r=>JSON.stringify([r.name.trim().toLowerCase(),r.schedule,r.days.map(d=>[d.name,!!d.rest,d.items.map(i=>[i.exId,+i.sets,+i.repMin,+i.repMax,+i.rir,+i.rest])])]);
function routineClutter(){
  const used=new Set(state.sessions.map(x=>x.routineId));const seen=new Set();const out=[];
  for(const r of state.routines){
    const sig=routineSig(r);const dup=seen.has(sig);seen.add(sig);
    if(r.id===state.activeRoutineId||used.has(r.id))continue;
    if(routineEmpty(r)||dup)out.push(r);
  }
  return out;
}
const nameTaken=(nm,exceptId)=>state.routines.some(r=>r.id!==exceptId&&r.name.trim().toLowerCase()===nm.trim().toLowerCase());
function curRoutineB(){return state.routines.find(r=>r.id===ui.bRoutine)||activeRoutine();}
function findItem(uidv){for(const r of state.routines)for(let di=0;di<r.days.length;di++){const i=r.days[di].items.findIndex(x=>x.uid===uidv);if(i>=0)return {r,di,i,it:r.days[di].items[i]};}return null;}
function newItem(exId){return {uid:uid(),exId,...defPlan(exId)};}
/* Toggle the link between entry i and i+1. get(x) returns the object holding ss. */
function linkToggle(arr,i,get){
  const a=get(arr[i]),b=arr[i+1]&&get(arr[i+1]);if(!a||!b)return false;
  if(a.ss&&a.ss===b.ss){const g=uid(),old=a.ss;for(let k=i+1;k<arr.length&&get(arr[k]).ss===old;k++)get(arr[k]).ss=g;}
  else{const id=a.ss||b.ss||uid();const olds=[a.ss,b.ss].filter(Boolean);for(const x of arr){const o=get(x);if(o.ss&&olds.includes(o.ss))o.ss=id;}a.ss=id;b.ss=id;}
  const tmp=arr.map(get);fixSupersets(tmp);return true;
}
function move(arr,i,j){if(j<0||j>=arr.length)return;const [x]=arr.splice(i,1);arr.splice(j,0,x);}
function draftSet(t){return state.draft.ex[+t.dataset.b].sets[+t.dataset.s];}
/* Exercises added or swapped in a session, relative to the routine day it was
   logged against, so Finish can offer to make the change permanent. */
function routineUpdates(d){
  const R=state.routines.find(r=>r.id===d.routineId);if(!R)return null;
  const day=R.days.find(x=>x.id===d.dayId);if(!day)return null;
  const have=new Set(day.items.map(i=>i.exId));const add=[],swap=[];const seen=new Set();
  for(const b of d.ex){
    if(have.has(b.exId)||seen.has(b.exId)||!b.sets.some(s=>s.done&&!s.warm))continue;seen.add(b.exId);
    // Limited-equipment swaps are for that session only.
    if(d.limited&&b.swappedFrom)continue;
    if(b.swappedFrom&&have.has(b.swappedFrom))swap.push({from:b.swappedFrom,to:b.exId});
    else{const {ss:_s,...p}=b.plan;add.push({exId:b.exId,plan:{...p,sets:Math.max(1,+p.sets||3)}});}
  }
  if(!add.length&&!swap.length)return null;
  const bits=[...swap.map(x=>`${exName(x.from)} → ${exName(x.to)}`),...add.map(x=>`add ${exName(x.exId)}`)];
  return {rid:R.id,dayId:day.id,dayName:day.name,add,swap,text:bits.join(', ')};
}
function toTrash(kind,data){
  state.trash=[{id:data.id,kind,date:today(),data:JSON.parse(JSON.stringify(data))},...(state.trash||[]).filter(t=>!(t.id===data.id&&t.kind===kind))].slice(0,TRASH_MAX);
  while(state.trash.length>1&&JSON.stringify(state.trash).length>TRASH_BYTES)state.trash.pop();
